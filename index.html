"工细浓丽风格的代表作。","f":"清代；袁江（清初\"界画\"名家）绘；绢本设色，界画山水楼阁，题材为骊山避暑行宫；现藏首都博物馆。","im":"images/ep28_25.jpg","it":"骊山避暑图_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/d009b3de9c82d158f8af0bb68d0a19d8bc3e4283?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"珊瑚红地珐琅彩花鸟纹瓶","e":"清雍正","p":"首都博物馆","b":"清雍正景德镇珐琅彩瓶，以珊瑚红为地、绘工笔花鸟，烧造极精、存世极罕，是雍正珐琅彩瓷的孤品级珍品。","f":"清雍正（1723—1735）；景德镇烧胎、清宫造办处珐琅彩二次烧成；珊瑚红地花鸟纹；雍正珐琅彩存世极罕（孤品级）；现藏首都博物馆。","im":"images/ep28_26.jpg","it":"【清 胭脂红地珐琅彩开光花鸟纹双耳瓶】拍卖品_图片_价格_鉴赏_清代其它彩釉瓷器_雅昌艺术品拍卖网","gp":"https://img1.artron.net/auction/2018/art512676/d/art5126760252.jpg"},{"n":"外粉彩内青花镂空花果纹六方套瓶","e":"清乾隆","p":"首都博物馆","b":"清乾隆唐英督造的转心/套瓶类重器，外施粉彩、内为青花、腹部镂空，工艺极繁，曾为圆明园陈设，是乾隆瓷艺巅峰。","f":"清乾隆（1736—1795）；景德镇督陶官唐英监造；外粉彩、内青花、腹部镂空花果纹，六方套瓶；圆明园旧藏遗物；现藏首都博物馆。","im":"images/ep28_27.jpg","it":"青花折枝花果纹瓶_中国国家博物馆官方网站","gp":"https://www.chnmuseum.cn/zp/zpml/201812/P020181218722554242403.jpg"},{"n":"缂丝十二章龙袍","e":"清乾隆","p":"首都博物馆","b":"清乾隆四十五年织造的缂金十二章龙袍，以缂丝（缂金）工艺织就帝王章纹，为宫廷礼服，工艺与等级规制俱高。","f":"清乾隆四十五年（1780）；缂丝（缂金）十二章龙袍；身长约 150 厘米、通袖约 200 厘米；帝王礼服，饰十二章纹；现藏首都博物馆。","im":"images/ep28_28.jpg","it":"缂丝十二章龙袍_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/8326cffc1e178a8231fc26c1f803738da877e88b?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"翠扳指","e":"清","p":"首都博物馆","b":"清末大太监李莲英墓出土翡翠扳指，满绿通透、材质上乘，是清代翡翠工艺与宦官权贵随葬奢华的实物例证。","f":"清代（晚清）；1966 年出土于北京恩济庄李莲英墓；翡翠质，满绿（玻璃种）；墓葬出土；现藏首都博物馆。","im":"images/ep28_29.jpg","it":"翠镶金里扳指 - 故宫博物院","gp":"https://img.dpm.org.cn/Uploads/Picture/dc/50591[1024].jpg"},{"n":"景德街牌楼","e":"明嘉靖","p":"首都博物馆","b":"明嘉靖年间所建景德街（城隍庙）牌楼，1954 年梁思成力主保留、编号保护，被赞为古建保护\"001 号文物\"，后移藏首博。","f":"明嘉靖年间（1522—1566）；北京景德街（都城隍庙）牌楼（景德坊）；1954 年拆除迁建，梁思成称其为古建保护\"001 号文物\"；现藏首都博物馆。","im":"images/ep28_30.jpg","it":"5.18国际博物馆日 北京免费开放的博物馆大盘点[图]--文化--人民网","gp":"http://culture.people.com.cn/NMediaFile/2015/0515/MAIN201505151432000476512866922.jpg"}]},{"no":"29","t":"云南省博物馆","loc":"云南昆明","it":[{"n":"鸡形陶壶","e":"新石器时代","p":"云南省博物馆","b":"云南新石器时代代表陶器，造型似蹲伏母鸡，出土于元谋大墩子儿童瓮棺，被视作早期家鸡驯化的造型佐证，憨态可掬。","f":"新石器时代晚期（距今约 4000 余年）；1972 年出土于云南楚雄元谋大墩子遗址瓮棺；夹砂灰陶，高 12、长 12.6、宽 9 厘米；现藏云南省博物馆。","im":"images/ep29_00.jpg","it":"让观众感受馆藏的精美（华夏博物之旅）--文化--人民网","gp":"http://paper.people.com.cn/rmrb/res/2018-04/29/06/rmrb2018042906p45_b.jpg"},{"n":"牛虎铜案","e":"战国","p":"云南省博物馆","b":"古滇国青铜祭祀礼器，以一大牛为案身、虎噬牛尾、腹下护一小牛，力学美学双绝，与\"马踏飞燕\"并称南北青铜瑰宝。","f":"战国（公元前 475—前 221）；1972 年出土于云南江川李家山 24 号墓；高 43、长 76 厘米；云南省博物馆镇馆之宝；现藏云南省博物馆。","im":"images/ep29_01.jpg","it":"战国牛虎铜案_云南省博物馆 -云南省博物馆官方网站","gp":"https://www.ynmuseum.org/Uploads/Picture/2018/05/22/s5b03d506011ff.jpg"},{"n":"立牛铜葫芦笙","e":"战国","p":"云南省博物馆","b":"古滇国青铜吹奏乐器，笙斗仿葫芦、顶端立一弯角小牛，出土时腹存竹管残痕，是滇人乐舞与中原匏音交融的实证。","f":"战国；1972 年出土于云南江川李家山 24 号墓；通高 28.2 厘米，正面 5 孔、背面 1 孔；青铜葫芦笙，顶端立牛；现藏云南省博物馆。","im":"images/ep29_02.jpg","it":"滇王与南越王大展“宝贝”多 - 广州市人民政府门户网站","gp":"https://www.gz.gov.cn/img/0/328/328810/7101312.jpg"},{"n":"立牛铜伞盖","e":"战国","p":"云南省博物馆","b":"古滇国车马仪仗用的青铜伞盖，伞顶立牛、盖面饰平行线纹，出土时盖下多压头骨，被认为是招魂护主的随葬仪仗器。","f":"战国；出土于云南江川李家山 18 号墓；高 16.5、盖径 43.2 厘米；车马仪仗用伞盖，顶立牛；现藏云南省博物馆。","im":"images/ep29_03.jpg","it":"滇王与南越王大展“宝贝”多 - 广州市人民政府门户网站","gp":"https://www.gz.gov.cn/img/0/328/328810/7101312.jpg"},{"n":"猛虎袭牛铜枕、铜狼牙棒","e":"战国","p":"云南省博物馆","b":"古滇国两件兵器/葬具：猛虎袭牛铜枕马鞍形、两端立牛、侧饰虎噬牛浮雕；虎噬牛铜狼牙棒为迄今最早狼牙棒实物之一。","f":"战国；均出土于云南江川李家山（铜枕出 17 号墓，高 33、长 50.3 厘米；狼牙棒出 24 号墓）；铜枕为随葬枕具，狼牙棒为仪仗/兵器；现藏云南省博物馆。","im":"images/ep29_04.jpg","it":"战国文物猛虎袭牛铜枕高清图片下载_红动中国","gp":"https://img.redocn.com/sheying/20200413/zhanguowenwumenghuxiniutongzhen_10904175.jpg"},{"n":"青铜扣饰系列","e":"战国","p":"云南省博物馆","b":"古滇国佩饰类青铜小品，以高浮雕再现骑士猎鹿、虎噬猪、三虎背牛、乐舞、房屋模型等场景，写实生动，是滇人生活的微缩画卷。","f":"战国；多出于云南江川李家山、晋宁石寨山；题材有二骑士猎鹿、虎噬猪、三虎背牛、鎏金八人乐舞、房屋模型扣饰等；背面有矩形扣；现藏云南省博物馆。","im":"images/ep29_05.jpg","it":"晋宁石寨山铜扣,晋宁石寨山博物馆,滇族青铜扣饰_大山谷图库","gp":"http://5b0988e595225.cdn.sohucs.com/images/20190824/76bc98d87341405295369d9938a77473.jpeg"},{"n":"猎首纹铜剑","e":"战国","p":"云南省博物馆","b":"古滇国青铜短剑，剑柄与剑身近格处浮雕猎头人物——一人提人头、一人跳跃，是滇人猎首祭祀习俗的直白图像证据。","f":"战国；云南江川李家山出土（一说采集）；通高 28.2 厘米，一字格、鼓形剑首；剑柄浮雕右手持刀、左手提人头之人像；现藏云南省博物馆。","im":"images/ep29_06.jpg","it":"先秦时期只有20到30厘米的青铜剑，在战场上到底有多大的杀伤力？_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/72f082025aafa40f4bfb112b4529144f78f0f636b3bd?x-bce-process=image/format,f_auto"},{"n":"滇王之印","e":"西汉","p":"中国国家博物馆","b":"西汉纯金蛇钮\"滇王之印\"，1956 年石寨山 6 号墓出土，与《史记》汉武帝赐滇王印记载互证，是古滇国存在的铁证。","f":"西汉（汉武帝元封二年赐，前 109）；1956 年出土于云南晋宁石寨山 6 号墓；纯金，蛇钮，边长约 2.4、通高约 2 厘米；原件藏中国国家博物馆（云南省博物馆藏复制品）。","im":"images/ep29_07.jpg","it":"云博新展讲述“滇王之印”发掘者孙太初的故事","gp":"http://yn.news.cn/original/2023-06/10/1310726298_16863965109661n.jpg"},{"n":"滇王编钟","e":"西汉","p":"云南省博物馆","b":"与\"滇王之印\"同墓出土的铜编钟，一套六件、皆为偶数，钟面饰双龙纹，体现中原礼乐制度对滇国的影响。","f":"西汉；1956—1957 年出土于云南晋宁石寨山 6 号墓（与滇王之印同墓）；一套 6 件，最大通高约 42、最小约 29.5 厘米；椭圆形、半环钮、双龙纹；现藏云南省博物馆。","im":"images/ep29_08.jpg","it":"趣看文物｜七彩云南 博物馆里的龙都是五颜六色的_新华网","gp":"http://www.yn.xinhuanet.com/20240210/3413a7c8025f44ff803704209f6e025c/202402103413a7c8025f44ff803704209f6e025c_20240210006ae32c1eba4975a38fbc36cb8a3d4f.jpg"},{"n":"吊人铜矛","e":"西汉","p":"云南省博物馆","b":"古滇国仪仗兵器，矛刃两底角各悬吊一名反缚裸体男子，再现活人祭祀与刑罚场景，是滇王权威的威吓性象征。","f":"西汉；出土于云南晋宁石寨山 6 号墓（与滇王之印同墓）及李家山 57 号墓；长 30.5—41.5 厘米；刃下吊二人（椎髻反缚）；仪仗兵器；现藏云南省博物馆（国博亦藏一件）。","im":"images/ep29_09.jpg","it":"汉吊人铜矛 - 藏品详情 - 博物中国","gp":"http://www.museumschina.cn/img/waterMark/2019-01-02-14-28-22/yipu/da/53/04/21/21800102/80000657/5304212180010280000657-A-0001_wm.jpg"},{"n":"云雷鸟兽纹铜棺","e":"战国","p":"云南省博物馆","b":"祥云大波那出土的战国铜棺，由七块铜板拼成\"干栏式\"屋形，满饰云雷蛇纹与鸟兽，是国内唯一完整的青铜时代铜棺。","f":"战国（约公元前 475 年前后，距今约 2300 年）；1964 年出土于云南大理祥云大波那村；长 2、宽 0.62、重约 257 公斤；七块青铜板斗合；现藏云南省博物馆（镇馆之宝）。","im":"images/ep29_10.jpg","it":"技术部对青铜时代展厅战国云雷鸟兽纹铜棺进行清洁养护_云南省博物馆 -云南省博物馆官方网站","gp":"http://www.ynmuseum.org/Uploads/Picture/2019/03/22/s5c94afa5837a2.jpg"},{"n":"贮贝器","e":"西汉","p":"云南省博物馆","b":"古滇国特有\"存钱罐\"，器盖立体铸出祭祀、战争、纳贡等场景，是滇青铜文明最具代表性的器物，宛如一部青铜\"纪录片\"。","f":"西汉；多出于云南晋宁石寨山、江川李家山；器内贮海贝；代表有石寨山 10 号墓四牛鎏金骑士贮贝器（高 50 厘米）、杀人祭柱/诅盟场面贮贝器、战争场面贮贝器等；现藏云南省博物馆。","im":"images/ep29_11.jpg","it":"祭祀场面铜贮贝器_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/500fd9f9d72a6059252d25c86e63239b033b5ab50c93?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_550"},{"n":"广南铜鼓","e":"战国—西汉","p":"云南省博物馆","b":"1919 年广南出土的句町国铜鼓，铸工纹饰精美、鼓胸饰羽人船纹，被誉为\"云南铜鼓之冠\"，是云南省博物馆镇馆之宝。","f":"战国至西汉（句町国时期）；1919 年出土于云南文山广南县黑支果乡阿章村；石寨山型（阿章竞渡鼓）；云南铜鼓之冠，国家一级文物；现藏云南省博物馆。","im":"images/ep29_12.png","it":"64件一级文物齐聚上海 共述长江与海洋文明_央广网","gp":"https://news.cnr.cn/native/gd/20230711/W020230711361960105807.png"},{"n":"银背光金阿嵯耶观音像","e":"大理国（宋）","p":"云南省博物馆","b":"大理国纯金铸造的阿嵯耶观音立像，发髻藏佛、身佩妙音天印，背后银质葫芦形镂空背光，被誉为\"云南福星\"，是宋代最大金佛。","f":"大理国时期（宋，937—1253）；1978/1979 年维修大理崇圣寺主塔千寻塔时出土；纯金观音+银背光，总高 29.5、重 1135 克；现藏云南省博物馆。","im":"images/ep29_13.jpg","it":"云南省博物馆的12件镇馆之宝 - 知乎","gp":"https://picx.zhimg.com/v2-fbd4bec8e47e56d8f2fcba2a55321bf9_1440w.jpg"},{"n":"铜鎏金五股金刚杵","e":"大理国（宋）","p":"云南省博物馆","b":"大理国密宗（滇密）法器，铜胎鎏金、双面五股、四爪作摩羯龙首，1979 年崇圣寺千寻塔出土，是滇密艺术的标型器。","f":"大理国时期（宋）；1979 年出土于云南大理崇圣寺千寻塔；铜鎏金，长 20.8 厘米，双面五股、四爪饰摩羯龙首；密宗法器；现藏云南省博物馆。","im":"images/ep29_14.jpg","it":"五股金刚杵 - 知乎","gp":"https://pic3.zhimg.com/v2-57c2e8709953c51402032ea18ec4a8ca_r.jpg"},{"n":"银鎏金镶珠金翅鸟","e":"大理国（宋）","p":"云南省博物馆","b":"大理国银鎏金金翅鸟（迦楼罗）立像，鹰首羽冠、火焰尾、嵌水晶珠，被奉为洱海\"镇水之神\"，是大理佛教艺术的网红国宝。","f":"大理国时期（宋）；1978 年大理崇圣寺三塔维修时于千寻塔塔顶经幢出土；银鎏金，通高 18.5、重 125 克，嵌水晶珠 5 粒；镇水之神；现藏云南省博物馆。","im":"images/ep29_15.jpg","it":"宋大理国银鎏金镶珠金翅鸟_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/023b5bb5c9ea15ce3c5d95cab8003af33b87b245?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_1000"},{"n":"溪山行旅图","e":"北宋","p":"云南省博物馆","b":"北宋郭熙所作山水立轴，以卷云皴写北方山川，与范宽《溪山行旅图》同名却非一图，系高荫槐捐赠的省博书画镇馆之宝。","f":"北宋；郭熙（字淳夫，河阳温县人，神宗朝画院）绘；绢本水墨，《溪山行旅图轴》，右下落\"臣郭熙\"款；高荫槐捐赠；现藏云南省博物馆（镇馆之宝）。","im":"images/ep29_16.jpg","it":"数藏故事 | 一起来找找《溪山行旅图》隐藏的作者签名--灵境·人民艺术馆--人民网","gp":"http://art.people.com.cn/mediafile/pic/20250318/66/12483652233070520530.jpg"},{"n":"剡溪访戴图","e":"元","p":"云南省博物馆","b":"元代黄公望晚年山水，绘晋人王徽之雪夜访戴逵\"兴尽而返\"故事，浅绛设色、萧瑟清远，是高荫槐捐、徐邦达鉴定的省博珍宝。","f":"元；黄公望（元四家之首）晚年（81 岁，至正九年，1349）作；绢本设色，纵约 75、横约 56 厘米；高荫槐捐赠，1980 年徐邦达鉴定为真迹；现藏云南省博物馆（镇馆之宝）。","im":"images/ep29_17.jpg","it":"中国明代书画市场——由“名家”变“邪学”_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/f9198618367adab44aedd42d7099a41c8701a18b4e04?x-bce-process=image/format,f_auto"},{"n":"明代嵌宝石金头冠","e":"明","p":"云南省博物馆","b":"明代沐氏家族墓出土的金镶红蓝宝石冠，薄金片累叠如莲瓣、嵌各色宝石数十粒，是黔国公一系显赫身份与明代金工的见证。","f":"明代；1963 年出土于云南昆明呈贡王家营沐崧夫妇合葬墓（沐英六世孙）；金镶红蓝宝石冠，高约 11.5、重约 320 克，嵌宝石 50 余粒；国家一级文物；现藏云南省博物馆。","im":"images/ep29_18.jpg","it":"云南省博物馆藏国家一级文物明代金镶红蓝宝石冠_环球收藏网","gp":"http://www.people.com.cn/mediafile/pic/20180112/58/3114703659071275130.jpg"},{"n":"永历敕命之宝玉玺","e":"南明","p":"云南省博物馆","b":"南明永历帝朱由榔的碧玉\"敕命之宝\"玺，1907 年昆明五华山出土时已裂两半，是现存极少南明御用玺印，末代皇权的悲歌实物。","f":"南明（永历，1646—1662 在位）；1907 年（清光绪三十三年）出土于昆明五华山；碧玉质，蟠龙钮，印面边长 12、通高约 7.7 厘米，阳文篆书\"敕命之宝\"；现藏云南省博物馆（一级文物）。","im":"images/ep29_19.jpg","it":"敕命之宝（乾隆时期宝玺）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/ca1349540923dd5473d2fc70de09b3de9c824800?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"聂耳小提琴","e":"近现代","p":"云南省博物馆","b":"人民音乐家聂耳使用过的小提琴，《义勇军进行曲》等多首革命歌曲即以此琴创作，1954 年由亲属捐赠，是省博镇馆之宝。","f":"近现代（聂耳 1931 年于上海购置的德国制二手琴）；聂耳（1912—1935）用以创作《义勇军进行曲》等；1954 年 2 月由其兄聂紫鸣（聂叙伦）捐赠；现藏云南省博物馆（镇馆之宝）。","im":"images/ep29_20.jpg","it":"聂耳小提琴_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/622762d0f703918f83a3f6495c3d269758eec4c7?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_290"}]},{"no":"30","t":"宝鸡青铜器博物院","loc":"陕西宝鸡","it":[{"n":"何尊","e":"西周早期","p":"宝鸡青铜器博物院","b":"1963年宝鸡贾村出土，曾被当废铜30元回购，内底122字铭文首见\"宅兹中国\"，是\"中国\"一词最早文字出处之一。","f":"1963年宝鸡县贾村镇（陈堆家后院）出土；通高38.5厘米，重14.6公斤；内底122字铭文记周成王营建洛邑，含\"宅兹中国\"；现藏宝鸡青铜器博物院。","im":"images/ep30_00.jpg","it":"鉴往知来，跟着总书记学历史丨这个青铜器博物院，有着最早的“中国”印记--时政--人民网","gp":"https://politics.people.com.cn/mediafile/pic/BIG/20240912/68/10455099266712152804.jpg"},{"n":"逨盘","e":"西周晚期","p":"宝鸡青铜器博物院","b":"2003年眉县杨家村窖藏一次出土，内底铸372字，把单氏家族八代辅佐十二位周王的事从头到尾写清楚，号称\"中华第一盘\"。","f":"2003年眉县杨家村西周窖藏出土；通高20.4厘米，重18.5公斤；内底372字铭文，记单氏家族八代辅佐文王至宣王十二王；现藏宝鸡青铜器博物院。","im":"images/ep30_01.jpg","it":"第1视点｜刻于“心底”的“中国”——走进宝鸡青铜器博物院-新华网","gp":"https://www.news.cn/politics/leaders/20240912/d8d43c31d1124a478503860a3a2d62ae/20240912d8d43c31d1124a478503860a3a2d62ae_202409120bda28163c1d426f8d9e7637332324c7.jpeg"},{"n":"逨盉/逨簋/叔五父器物","e":"西周晚期","p":"宝鸡青铜器博物院","b":"和逨盘同出一处窖藏，都是西周晚期单氏家族的重器，逨盉凤鸟盖华丽，叔五父壶等配套成组，印证杨家村窖藏之丰。","f":"2003年眉县杨家村窖藏同出；逨盉通高48厘米、重12公斤，凤鸟形盖、龙首鋬；另有叔五父壶等同窖青铜礼器；现均藏宝鸡青铜器博物院。","im":"images/ep30_02.jpg","it":"宝鸡：一件构思奇巧的青铜盉|青铜|宝鸡|青铜器_新浪新闻","gp":"http://n.sinaimg.cn/sinakd20220608ac/410/w1200h810/20220608/5627-102634a5ec617d5743660898e2e86aa4.jpg"},{"n":"俞伯方簋","e":"西周中期","p":"宝鸡青铜器博物院","b":"文王到穆王时弓鱼国第一代国君弓鱼伯的祭器，1974年从茹家庄大墓挖出，是史籍失载的神秘小方国重现人间的铁证。","f":"西周中期；1974年宝鸡茹家庄（弓鱼国）一号墓出土；墓主为弓鱼伯（弓鱼国第一代国君）；方座簋；现藏宝鸡青铜器博物院。","im":"images/ep30_03.jpg","it":"「带你去逛博物馆」之宝鸡青铜器博物院（中国青铜器博物院） - 知乎","gp":"https://pica.zhimg.com/v2-df58f7a90c1dcb62a31fe23cefb35dc4_1440w.jpg"},{"n":"井姬温鼎","e":"西周中期","p":"宝鸡青铜器博物院","b":"弓鱼伯为妻子井姬做的温食鼎，独柱带盘、底下可加热，1974年出自茹家庄二号墓，是这对异姓联姻夫妻的实物见证。","f":"西周中期；1974年茹家庄二号墓（弓鱼伯之妻井姬墓）出土；通高15.2厘米，重1.8公斤；独柱带盘，用于温食；铭\"弓鱼伯作井姬鼎\"；现藏宝鸡青铜器博物院。","im":"images/ep30_04.jpg","it":"探寻宝鸡青铜器博物院的青铜文明 - 知乎","gp":"https://pic1.zhimg.com/v2-bf18ce550a054b47e72fd01f20e99090_r.jpg"},{"n":"刖刑奴隶守门鼎","e":"西周中期","p":"宝鸡青铜器博物院","b":"鼎身一侧开小门，门边站着个被砍了脚（刖刑）的守门人，把西周\"砍脚的人去看守园囿\"的刑罚制度活生生铸在了铜器上。","f":"西周中期；1988年宝鸡茹家庄出土；通高18.7厘米，重3.92公斤；侧面设可启小门，门侧有刖足守门人像；现藏宝鸡青铜器博物院。","im":"images/ep30_05.jpg","it":"「带你去逛博物馆」之宝鸡青铜器博物院（中国青铜器博物院） - 知乎","gp":"https://pic4.zhimg.com/v2-02d2b98f6ab9989550c329fc985d667b_b.jpg"},{"n":"秦公镈","e":"春秋早期","p":"宝鸡青铜器博物院","b":"1978年太公庙窖藏一次出了三件，最大这件高过半人，135字铭文追述秦襄公到秦宪公世系，是秦人早期建国史的可信物证。","f":"春秋早期；1978年宝鸡太公庙窖藏出土；同出3件，最大通高75.1厘米、重62.5公斤；135字铭文记秦襄公、文公等世系，为秦武公作器；现藏宝鸡青铜器博物院。","im":"images/ep30_06.jpg","it":"文明印记——中国珍贵文物影像志｜秦公镈：秦人开拓精神的见证-新华网","gp":"https://www.news.cn/culture/20240524/1c6b1ba38de94a44845d0f11b7f59da4/202405241c6b1ba38de94a44845d0f11b7f59da4_202405249b463938fd8c4696880343f621067a33.jpg"},{"n":"吕不韦戈","e":"战国（秦）","p":"宝鸡青铜器博物院","b":"长仅21.7厘米的小铜戈，铭文\"相邦吕不韦造\"，是秦王政八年秦国\"物勒工名\"军工追责体系的实物，从废铜堆里拣回的宝贝。","f":"战国秦；长21.7厘米，重约0.3公斤；铭\"五年/八年，相邦吕不韦造\"；现藏宝鸡青铜器博物院。","im":"images/ep30_07.jpg","it":"探寻宝鸡青铜器博物院的青铜文明 - 知乎","gp":"https://pic1.zhimg.com/v2-bf18ce550a054b47e72fd01f20e99090_r.jpg"},{"n":"周厉王簋（胡簋）","e":"西周晚期","p":"宝鸡青铜器博物院","b":"周厉王自作祭器，高近60厘米、重60公斤，是迄今发现最大的青铜簋，124字铭文讲天子册命与赏赐，人称\"簋中之王\"。","f":"西周晚期（厉王）；通高59厘米，重60公斤；124字铭文，周厉王（㝬）自作祭器；现存最大青铜簋；现藏宝鸡青铜器博物院。","im":"images/ep30_08.jpg","it":"周厉王的另一面——㝬hú簋guǐ（又称胡簋、厉王簋、簋王） - 知乎","gp":"https://pic1.zhimg.com/v2-ac85a920b7a7932f40d8a7ce69738580_r.jpg"},{"n":"爬龙","e":"西周","p":"宝鸡青铜器博物院","b":"1992年扶风窖藏出土，通长60厘米、重19公斤的青铜大龙，被誉为\"中华青铜第一龙\"，可能是某件超大青铜器上的附件。","f":"西周；1992年扶风县海家村（巨良村）窖藏出土；通长60厘米，重19公斤；被誉为\"中华青铜第一龙\"；疑为大型青铜器鼎耳附件；现藏宝鸡青铜器博物院。","im":"images/ep30_09.jpg","it":"八百里秦川，三千年传奇_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/3812b31bb051f8198618752b75fe5ded2e738bd44935"},{"n":"琱生尊","e":"西周晚期","p":"宝鸡青铜器博物院","b":"2006年扶风五郡西村窖藏一对出土，每件内壁113字，记召氏家族土地财产分配的一桩诉讼，和传世琱生簋拼成完整事件链。","f":"西周晚期（周宣王五年）；2006年11月扶风县五郡西村窖藏出土一对；通高约31—32厘米，各113字铭文；与五年/六年琱生簋相连，记召氏家族土地财产分配；现展于宝鸡青铜器博物院（扶风县博物馆亦藏）。","im":"images/ep30_10.jpg","it":"何以中国｜欣逢青铜重器 探访最早“中国”-新华网","gp":"https://www.news.cn/politics/2023-07/12/1212243532_16891309166101n.jpg"},{"n":"金柄铁剑","e":"春秋晚期","p":"宝鸡青铜器博物院","b":"1992年益门村秦墓出土，纯金镂空剑柄配柳叶铁身，分铸铆合、嵌绿松石，是秦人早期先进冶铁与金银工艺的巅峰之作。","f":"春秋晚期；1992年宝鸡益门村二号墓出土；通长37.8厘米，重350克；纯金镂空剑柄、柳叶形铁身，分铸铆合，嵌绿松石；现藏宝鸡青铜器博物院。","im":"images/ep30_11.png","it":"中国博物馆协会","gp":"https://www.chinamuseum.org.cn/webfile/upload/2022/05-27/14-32-150584-1859671457.png"},{"n":"鱼国（弓鱼国）墓地出土器物群","e":"西周","p":"宝鸡青铜器博物院","b":"茹家庄、竹园沟、纸坊头三地发掘出的弓鱼国贵族墓地，出土三千余件青铜玉器，揭开这个帮周灭商却史书无载的神秘方国。","f":"西周；1974—1981年宝鸡茹家庄、竹园沟、纸坊头三地发掘；弓鱼国（史籍失载的西周方国）墓地，出土文物3000余件；现藏宝鸡青铜器博物院。","im":"images/ep30_12.jpg","it":"宝鸡青铜器博物院_百度百科","gp":"https://bkimg.cdn.bcebos.com/smart/8b527d27c9609b5a908f9d2f-bkimg-process,v_1,rw_800,rh_581,maxl_391?x-bce-process=image/format,f_auto"},{"n":"三足铜鸟","e":"西周中期","p":"宝鸡青铜器博物院","b":"1974年茹家庄弓鱼国墓出土的青铜神鸟，打破常理生三条腿，取意神话里驮太阳的三足乌，是周人太阳崇拜的稀罕实物。","f":"西周中期；1974年茹家庄弓鱼国墓地一号墓乙室出土；通高15.8厘米，重1400克；国家一级文物；三足造型取意三足乌（太阳神鸟）；现藏宝鸡青铜器博物院。","im":"images/ep30_13.jpg","it":"西周.三足鸟尊/宝鸡青铜器博物院藏……","gp":"https://k.sinaimg.cn/n/sinakd20109/400/w1200h800/20230702/6258-d91e4925e25f8ac6b26ec1bda30a7100.jpg/w700d1q75cms.jpg"}]},{"no":"31","t":"曹操高陵遗址博物馆","loc":"河南安阳","it":[{"n":"石牌（随葬清单）","e":"东汉","p":"曹操高陵遗址博物馆","b":"曹操墓出土六十多枚刻铭石牌，分圭形和六边形两类，像随葬品标签，其中\"魏武王常所用挌虎大戟\"等直接把墓主指向曹操。","f":"东汉；2009—2010年安阳西高穴曹操高陵出土；约60余枚（一说66块），分圭形（长10.8厘米）与六边形（长8.3厘米），汉隶刻器物名与数量；刻\"魏武王常所用挌虎大戟\"等；现藏河南省文物考古研究院、曹操高陵管委会，展于曹操高陵遗址博物馆。","im":"images/ep31_00.jpg","it":"162件三国文物齐聚日本，证明曹操身份的石牌亮相_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/b2de9c82d158ccbf6c813909ce95ab3eb13533faebf8?x-bce-process=image/format,f_auto"},{"n":"私印","e":"东汉","p":"河南省文物考古研究院","b":"曹操墓后室扰土里出的小铜印，边长才2.5厘米，印面刻的到底是啥吵了十几年，至今没有定论，反倒成了热议焦点。","f":"东汉；曹操高陵后室扰土层出土；铜质，桥形钮，印面边长2.55厘米，通高1.92厘米；印面阴刻图案，学界有\"㒼\"字说、\"曹\"字说、铺首衔环肖形印说三派，尚无定论。","im":"images/ep31_01.jpg","it":"曹操高陵遗址博物馆_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/43a7d933c895d143ad4b392999a695025aafa40fa938?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"虎雕、水晶珠、翼状银饰、玛瑙饼、迷你金纽扣","e":"东汉","p":"曹操高陵遗址博物馆","b":"曹操墓里的随身小件，煤精小虎、水晶珠、玛瑙饼、金纽扣、银饰一应俱全，虽倡薄葬，日常衣饰还是留了几件，并不违遗令。","f":"煤精虎雕一件（长3.7厘米、高2.6厘米）；水晶珠（椭圆体，长径2厘米，疑\"夜明珠\"）；玛瑙饼（直径3.7厘米）；金纽扣（金丝、金纽扣）；银饰（银环、箱饰、带扣、银质铺首）；均出曹操高陵。","im":"images/ep31_02.jpg","it":"高陵文物今起集中亮相 往事千年再说魏武遗风-新华网","gp":"https://www.news.cn/politics/2023-04/27/1129569551_16825661640081n.jpeg"},{"n":"穿孔云母片","e":"东汉","p":"河南省文物考古研究院","b":"曹操墓棺床边散落二十多片带孔云母，长方形、圆形、月牙形都有，串起来当\"云母衣\"，是汉代贵族玉衣的省钱替代版。","f":"东汉；曹操高陵后室棺床周边出土二十余片；长方形、圆形、月牙形、水滴形，边缘穿孔，推测穿缀成云母殓服以替代玉衣；现藏河南省文物考古研究院。","im":"images/ep31_03.jpg","it":"河南安阳曹操高陵遗址博物馆开馆-新华网","gp":"https://www.news.cn/culture/20230428/557a773faaad4484acbfd8ce75034230/20230428557a773faaad4484acbfd8ce75034230_20230428e237f53643d8412a879590aefd99956f.jpg"},{"n":"骨牙签、铜耳勺","e":"东汉","p":"曹操高陵遗址博物馆","b":"墓里出的骨质、铜质小件里，应有古人剔牙挖耳的卫生用具，虽是小东西，却拼出曹操讲究起居的一面。","f":"曹操高陵出土骨器有骨簪、骨尺残块、骨板等，铜器有小铜削、铜带钩、铜钗、铜环等；\"骨牙签\"\"铜耳勺\"具体名称未见独立报道，归为梳妆卫生物品类。","im":"images/ep31_04.jpg","it":"新华全媒+丨河南安阳曹操高陵遗址博物馆开馆-新华网","gp":"https://www.news.cn/photo/2023-04/27/1129573590_16825902357971n.jpg"},{"n":"魏武王常所用慰项石枕","e":"东汉","p":"曹操高陵遗址博物馆","b":"刻着\"魏武王常所用慰项石\"的石枕，由公安追缴回归，正好对上史书说曹操常犯头风病、要热敷颈项的说法，很实在。","f":"东汉；石质，追缴回归，刻\"魏武王常所用慰项石\"；与《后汉书》记曹操\"积苦头风眩\"、需热敷颈项相符；现藏曹操高陵遗址博物馆。","im":"images/ep31_05.jpg","it":"安阳曹操高陵遗址博物馆举行开馆仪式_央广网","gp":"https://mediabluk.cnr.cn/img/cnr/CNRCDP/2023/0427/1639ad622122f168259610591961460211.jpg?auth=8004cbf8af7d0da7de308f924cf807c7"},{"n":"陶鼎、耳杯、豆、碗","e":"东汉","p":"曹操高陵遗址博物馆","b":"曹操墓陶器素面无纹、个头偏小、做工粗糙，全是冥器，连十二件陶鼎都只是\"以陶代铜\"，把薄葬写进了实物里。","f":"东汉；曹操高陵出土陶器约200件（复原），体小、素面、无彩绘，为专用冥器；含陶鼎12件及耳杯、豆、碗、盆等；印证曹操\"无藏金玉\"薄葬遗令。","im":"images/ep31_06.jpg","it":"河南安阳曹操高陵遗址博物馆开馆-新华网","gp":"https://www.news.cn/shuhua/20230428/4d955e08df14420db521a030866faf6b/202304284d955e08df14420db521a030866faf6b_20230428050af7110a7140e2b10fe16d6cf1c66c.jpg"},{"n":"男性头骨（60岁以上）+两具女性骸骨","e":"东汉","p":"河南省文物考古研究院","b":"墓里三具人骨一男二女，男的约60岁、和曹操66岁卒年对得上，两女约20岁、50岁，面骨都被破坏，成了身份认定的硬伤佐证。","f":"曹操高陵出土三具人骨（一男二女）；男性约60岁（与曹操卒年66岁吻合），女性约20岁、50岁左右；面骨均遭破坏；现藏河南省文物考古研究院。","im":"images/ep31_07.jpg","it":"安阳曹操高陵遗址博物馆举行开馆仪式_央广网","gp":"https://mediabluk.cnr.cn/img/cnr/CNRCDP/2023/0427/4c4815697f1b2168259608870935066211.jpg?auth=d95ed2de5618e08c25bb75eed9fa9d44"},{"n":"七层夯土","e":"东汉","p":"曹操高陵遗址博物馆","b":"墓道长达近40米，两壁各收七级台阶，民间拿来比\"帝王九层、魏王七层\"的等级，其实它是建筑构造，不是夯土层数。","f":"曹操高陵墓道长39.5米，两壁各设七级（七个）台阶逐级内收，最深处距地表约15米；\"七级台阶\"为墓道构造特征。","im":"images/ep31_08.jpg","it":"安阳曹操高陵遗址博物馆举行开馆仪式_央广网","gp":"https://mediabluk.cnr.cn/img/cnr/CNRCDP/2023/0427/4c4815697f1b2168259608870935066211.jpg?auth=d95ed2de5618e08c25bb75eed9fa9d44"}]},{"no":"32","t":"甘肃省博物馆（马踏飞燕续集）","loc":"甘肃兰州","it":[{"n":"大地湾齐刘海少女陶瓶","e":"新石器时代（仰韶文化）","p":"甘肃省博物馆","b":"1973年秦安大地湾出的彩陶瓶，瓶口塑成披发齐刘海的少女脸，距今五六千年，是仰韶人像雕塑里难得的孤品。","f":"仰韶文化早期；1973年秦安大地湾出土；人头形彩陶瓶，披发（齐刘海）少女形象；距今约5500—6000年；甘肃省博物馆藏。","im":"images/ep32_00.jpg","it":"【让文物活起来】5000多岁的“齐刘海少女”-新华网","gp":"https://www.gs.news.cn/20231215/e8e8615b868f430fbd43e0ef54b9afaa/1deac4b032f046e9ba8267f406343bf5.jpg"},{"n":"甘谷人面鲵鱼纹彩陶瓶","e":"新石器时代（马家窑文化）","p":"甘肃省博物馆","b":"1958年甘谷西坪出土，瓶身画着人面鲵鱼（娃娃鱼），被不少人看作中华龙图腾的早期雏形，是马家窑彩陶名品。","f":"马家窑文化石岭下类型；1958年甘谷县西坪出土；人面鲵鱼纹（娃娃鱼）彩陶瓶；距今约5200年；甘肃省博物馆藏。","im":"images/ep32_01.jpg","it":"甘肃省文物局","gp":"http://wwj.gansu.gov.cn/wwj/c105438/202404/173902246/images/844a9fa7417a45068305ff035d81276b.jpg"},{"n":"马家窑漩涡纹尖底彩陶瓶","e":"新石器时代（马家窑文化）","p":"甘肃省博物馆","b":"马家窑类型的漩涡纹尖底瓶，1971年陇西吕家坪出土，黑彩涡线转着圈，是半山—马家窑水波纹样的典型代表。","f":"马家窑类型；1971年陇西县吕家坪出土；高26.8厘米，口径7.1厘米；漩涡纹尖底瓶；距今约5000年；甘肃省博物馆藏。","im":"images/ep32_02.png","it":"中华文明的辉煌见证——马家窑文化彩陶珍品欣赏","gp":"https://www.gsyongjing.gov.cn/cms_files/filemanager/813956128/picture/20246/9c9262f18ee449468c7074d8ebafc908.png"},{"n":"齐家红陶刻画纹鸟形器","e":"新石器时代（齐家文化）","p":"甘肃省博物馆","b":"齐家文化的红陶鸟形器，身上刻画出羽毛纹样，造型朴拙生动，是研究甘青地区史前鸟形陶塑的一件标本。","f":"齐家文化；红陶鸟形器，刻画纹饰；甘肃省博物馆藏。","im":"images/ep32_03.jpg","it":"齐家文化_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/cebd00173605883a4b90a760?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_572"},{"n":"西周青铜提梁卣（灵台百草坡）","e":"西周","p":"甘肃省博物馆","b":"1967年灵台百草坡西周墓出土，提梁卣里还装着古酒，被称作\"国内最早存世酒\"，把三千年前的酒实打实留到了今天。","f":"西周；1967年灵台县百草坡西周墓出土；提梁卣，内盛古酒（号称\"国内最早存世酒\"）；甘肃省博物馆藏。","im":"images/ep32_04.jpg","it":"新闻资讯-新闻详情","gp":"https://imagecloud.thepaper.cn/thepaper/image/90/223/147.png"},{"n":"灵台青铜大圆鼎","e":"西周","p":"甘肃省博物馆","b":"灵台出土的青铜大圆鼎，有说法把它和商周时期的密须国联系起来，是陇东地区西周方国青铜礼器的重要代表。","f":"西周；灵台县出土（百草坡/姚家河一带）；青铜大圆鼎；一说与密须国（商周方国）有关；甘肃省博物馆藏。","im":"images/ep32_05.jpg","it":"【文物图鉴】穿越千年，遇见甘肃青铜-新华网","gp":"http://gs.news.cn/20241213/b5db65fc0a7342b28bbdd1be11b6c3f6/20241213b5db65fc0a7342b28bbdd1be11b6c3f6_20241213142731828279823db9.jpg"},{"n":"潶伯墓器物","e":"西周","p":"甘肃省博物馆","b":"灵台西周潶伯墓出土，既有玉雕人像，也有带镂空鞘的青铜短剑，把这位西周封君的礼器与兵器一并留了下来。","f":"西周；灵台县百草坡（或姚家河）潶伯墓出土；含玉人（\"潶伯作\"玉人）、镂空鞘青铜短剑等；潶伯为西周封君；甘肃省博物馆藏。","im":"images/ep32_06.jpg","it":"潶伯卣-中国文物网-文博收藏艺术专业门户网站","gp":"http://im.wenwuchina.com/upload/2018/05/23/20180523031429656.jpg"},{"n":"人头銎铜戈——袁伯墓","e":"西周","p":"甘肃省博物馆","b":"灵台百草坡出土的人头形銎青铜兵器，墓主被传为\"袁伯\"，其实应是爰伯，器物本身是戟不是戈，名字两层都得改。","f":"西周；灵台县百草坡出土；人头形銎青铜戟（非戈），墓主为\"爰伯\"（阝爰伯）；甘肃省博物馆藏。","im":"images/ep32_07.jpg","it":"西周人头銎内钺_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/dbb44aed2e738bd4b31c523182c690d6277f9e2f53d7?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"白马作毛笔","e":"东汉","p":"武威市博物馆","b":"武威磨嘴子汉墓出的毛笔，杆上刻\"白马作\"三字，是工匠留名的标准汉笔，常被当作汉代书写工具的范本。","f":"东汉；武威磨嘴子汉墓出土；毛笔杆刻\"白马作\"三字（工匠名）；长约21.9厘米；现藏武威市博物馆。","im":"images/ep32_08.jpg","it":"甘肃武威市凉州区新华乡磨嘴子出土汉代“白马作”毛笔_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/2fdda3cc7cd98d1001e983bb8672af0e7bec55e73aa1?x-bce-process=image/format,f_auto"},{"n":"仪礼简","e":"西汉","p":"甘肃省博物馆","b":"1959年武威磨嘴子出的《仪礼》木简，四百多枚、两万七千余字，是《仪礼》最古老的写本，号称\"天下第一简\"实至名归。","f":"西汉；1959年武威磨嘴子出土；《仪礼》木简（一说469枚，一说496枚），存字约27332；为《仪礼》最古写本；甘肃省博物馆藏。","im":"images/ep32_09.jpg","it":"甘肃简牍博物馆开馆 9月9日起向公众开放 - 甘肃文旅 - 丝绸之路（敦煌）国际文化博览会","gp":"https://www.gswbj.gov.cn/uploadfile/20230911/1694414605940580.jpg"},{"n":"王杖诏书令（鸠杖+简）","e":"西汉","p":"武威市博物馆","b":"1981年武威磨嘴子出土的王杖诏书令册简，写的是西汉养老抚恤法令，配套彩绘漆木鸠，是中国最早的养老法实物。","f":"西汉；1981年武威磨嘴子出土；王杖诏书令册简，记西汉赐王杖者待遇等养老抚恤法令；配套彩绘漆木鸠；现藏武威市博物馆。","im":"images/ep32_10.jpg","it":"【文物图鉴】王杖—— 汉代的“敬老卡”-新华网","gp":"http://gs.news.cn/20231023/2f9681c3f63141b49f27eecaaedc7983/202310232f9681c3f63141b49f27eecaaedc7983_202310230829496203rId7image4.jpeg"},{"n":"医药简","e":"东汉早期","p":"甘肃省博物馆","b":"1972年武威旱滩坡汉墓出的医方木简，载着几十个治病方子，是现存最早的汉代临床医书之一，中医史价值极高。","f":"东汉早期；1972年武威旱滩坡汉墓出土；《治百病方》木简（约92枚，一说78枚），载医方30余；最早汉代医方写本之一；甘肃省博物馆藏。","im":"images/ep32_11.jpg","it":"甘肃简牍博物馆","gp":"https://web.jiandumuseum.cn/gwebpublic/uploadfiles/exhibition_one/20230831/20230831171708nygan.jpg"},{"n":"卷底平绣人像","e":"西汉","p":"甘肃省博物馆","b":"武威磨嘴子汉墓出的绢底平绣人像，在丝绸上绣出完整人物，是现存最早的完整汉代人物刺绣之一，针法很见功夫。","f":"西汉；武威磨嘴子汉墓出土；绢底平绣人像（乘云绣类），最早完整汉代人物刺绣之一；甘肃省博物馆藏。","im":"images/ep32_12.jpg","it":"绢底平绣人像（2022年由百度百科博物馆计划发行的数字藏品）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/48540923dd54564e925863cc6b8d8b82d158cdbfe1b0?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"彩绘木博戏俑、木独角兽（獬豸）","e":"西汉","p":"甘肃省博物馆","b":"武威磨嘴子汉墓出的彩绘木雕，一对老者在博戏对弈，旁边立着木独角兽（獬豸），一个管娱乐一个管镇墓辟邪。","f":"西汉；武威磨嘴子汉墓出土；彩绘木博戏俑（对弈六博）、木独角兽（獬豸，镇墓辟邪）；甘肃省博物馆藏。","im":"images/ep32_13.jpg","it":"【文物图鉴】甘肃文物里的“动物世界” - 甘肃文旅 - 丝绸之路（敦煌）国际文化博览会","gp":"https://www.gswbj.gov.cn/uploadfile/20220817/1660700724671879.jpg"},{"n":"彩绘木轺车","e":"西汉","p":"甘肃省博物馆","b":"武威磨嘴子汉墓出的彩绘木轺车，是汉代马车微缩模型，做工精细，常被称作最精美的汉代木雕车马之一。","f":"西汉；武威磨嘴子汉墓出土；彩绘木轺车（马车模型）；汉代木雕精品；甘肃省博物馆藏。","im":"images/ep32_14.jpg","it":"穿越去秦汉 看看甘肃老乡的日常凤凰网甘肃_凤凰网","gp":"https://x0.ifengimg.com/cmpp/fck/2020_20/7fa8694d6a58f27_w640_h548.jpg"},{"n":"雷台汉墓车马仪仗（铜奔马+39马17骑）","e":"东汉","p":"甘肃省博物馆","b":"1969年武威雷台汉墓出土，青铜车马仪仗近百件，\"马踏飞燕\"（铜奔马）是其中最炸眼的一匹，整队列开起来气势十足。","f":"东汉；1969年武威雷台汉墓出土；铜车马仪仗俑约99件（含铜奔马、铜车、铜马约39匹及骑马俑、武士俑等）；\"马踏飞燕\"（铜奔马）为其代表；甘肃省博物馆藏。","im":"images/ep32_15.jpg","it":"铜车马仪仗俑队_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/08b68e5271bb326d0df3e35a?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_393"},{"n":"驿使图画像砖","e":"魏晋","p":"甘肃省博物馆","b":"嘉峪关新城墓群出的驿使图壁画砖，一名邮差快马奔驰送信，被看作最早\"快递小哥\"形象的画面，生动得很。","f":"魏晋；1972—1973年嘉峪关新城墓群出土；驿使图壁画砖，绘邮驿快马传信场景；甘肃省博物馆（及嘉峪关长城博物馆）藏。","im":"images/ep32_16.jpg","it":"博物馆文物介绍——甘肃博物馆的驿使图画像砖_保密","gp":"http://5b0988e595225.cdn.sohucs.com/images/20190125/deb8c0df8da546c1a8a687682d649b4c.jpeg"},{"n":"北凉石塔（程玄元年）","e":"北凉","p":"甘肃省博物馆","b":"高善穆石造像塔，刻着承玄元年（428年），是我国有纪年的最早佛塔实例，把北凉佛教凿塔的实物摆到了眼前。","f":"北凉；高善穆石造像塔，承玄元年（428年）刻；我国最早纪年佛塔实例；甘肃省博物馆藏。","im":"images/ep32_17.jpg","it":"【文物故事】北凉石塔，怎么看？ - 知乎","gp":"https://pic2.zhimg.com/v2-26a3a2b8c22bea425eefdd932f01d3a1_1440w.jpg"},{"n":"大云寺五重舍利容器（金棺银椁，14粒舍利）","e":"唐","p":"甘肃省博物馆","b":"1969年泾川大云寺出土，金棺、银椁、铜匣、石函、琉璃瓶五重套着，里头14粒舍利，是唐代瘗埋舍利的经典组合。","f":"唐；1969年泾川大云寺遗址出土；金棺、银椁、铜匣、石函、琉璃瓶五重容器，内14粒舍利；甘肃省博物馆藏。","im":"images/ep32_18.jpg","it":"泾川“黑马”一飞冲天凤凰网甘肃_凤凰网","gp":"https://x0.ifengimg.com/ucms/2022_48/0F3596F90AFD6347FFBBA9D767B21BC9CC90457B_size31_w751_h298.jpg"},{"n":"北周比丘慧明舍利（32粒）","e":"北凉—北周","p":"平凉市博物馆","b":"泾川大云寺遗址出的北周比丘慧明舍利，32粒，属国家一级文物，如今藏在平凉，不在省博，别被\"甘肃省博物馆\"带偏。","f":"北周；1969年泾川大云寺遗址（北周石函）出土；舍利32粒；国家一级文物；现藏平凉市博物馆。","im":"images/ep32_19.jpg","it":"北周比丘明藏造像石莲花 - 藏品详情 - 博物中国","gp":"http://www.museumschina.cn/img/waterMark/2019-01-02-14-28-22/yipu/da/61/05/26/21800272/00001233/6105262180027200001233-A-0004_wm.jpg"},{"n":"天梯山石窟彩塑","e":"北凉—北魏","p":"甘肃省博物馆","b":"武威天梯山石窟的彩塑佛像，开凿早、被称\"石窟之祖\"，部分造像后来迁到兰州，是甘肃石窟艺术的根脉之一。","f":"北凉—北魏；武威天梯山石窟；彩塑佛像（北凉最早窟），号称\"石窟之祖\"；部分造像迁藏甘肃省博物馆。","im":"images/ep32_20.jpg","it":"甘肃省博物馆藏· 天梯山石窟唐代一佛二菩萨塑像|博物馆|天梯山石窟|甘肃省博物馆_新浪新闻","gp":"http://n.sinaimg.cn/sinacn20117/298/w1080h1618/20190417/2358-hvvuiym9650224.jpg"},{"n":"东罗马神人纹银盘","e":"东罗马（拜占庭）","p":"甘肃省博物馆","b":"1988年靖远出土的东罗马银盘，盘心捶揲出狄俄尼索斯与奥林匹斯十二神，是中西丝路交流漂来的异域珍宝。","f":"东罗马（拜占庭）；1988年靖远县北滩出土；银盘径约31厘米，捶揲神人纹（狄俄尼索斯与奥林匹斯十二神）；甘肃省博物馆藏。","im":"images/ep32_21.jpg","it":"东罗马神人纹鎏金银盘_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/9345d688d43f8794a4c209d7915719f41bd5ac6e8cbc?x-bce-process=image/resize,m_lfit,w_536,limit_1"},{"n":"元代玻璃莲花托盏","e":"元","p":"甘肃省博物馆","b":"漳县汪世显家族墓出的玻璃莲花托盏，普蓝色半透明，是元代玻璃器的稀罕件，把蒙古贵族的雅致摆上了台面。","f":"元；漳县汪世显家族墓出土；玻璃莲花托盏，普蓝半透明；甘肃省博物馆藏。","im":"images/ep32_22.jpg","it":"甘肃省博物馆藏· 元代玻璃莲花托盏|托盏|甘肃省博物馆|玻璃器|家族墓地|漳县_新浪新闻","gp":"http://k.sinaimg.cn/n/sinacn20122/298/w1080h1618/20190223/a97e-htknpmi1586765.jpg/w700d1q75cms.jpg?by=cms_fixed_width"},{"n":"八思巴文虎符圆牌","e":"元","p":"甘肃省博物馆","b":"兰州废金属收购站征集来的八思巴文圆牌，铁镀金、刻圣旨文，同类全球仅存寥寥几件，是元代符牌的硬通货。","f":"元；兰州废金属收购站征集；八思巴文圆牌（圣旨金牌/圆牌），铁镀金；同类存世极少；甘肃省博物馆藏。","im":"images/ep32_23.jpg","it":"道中华_河北省民族事务委员会","gp":"http://mw.hebei.gov.cn/pic/003/002/617/00300261739_e31d8af7.jpg"},{"n":"肃本淳化阁帖刻石","e":"明","p":"甘肃省博物馆","b":"明万历四十三年肃宪王据宋拓摹刻的《淳化阁帖》刻石，一套上百块，是现存最完整的阁帖刻石，帖学宝库。","f":"明；万历四十三年（1615年）肃宪王据宋拓摹刻；刻石约144块，现存最完整《淳化阁帖》刻石；甘肃省博物馆藏（原肃王府）。","im":"images/ep32_24.jpg","it":"传承四百年 集百家墨宝（文物有话说）","gp":"https://paper.people.com.cn/rmrb/pc/pic/202506/14/024df490-28d2-43b7-b48c-28ea3371236d.jpg"},{"n":"法句经","e":"西晋（存疑）","p":"敦煌研究院","b":"敦煌藏经洞出的《法句经》写本，被说成敦煌最早的经卷写本之一，具体年份有争议，但佛典写本价值摆在那。","f":"敦煌莫高窟藏经洞出土《法句经》写本（梵文/犍陀罗语系）；\"敦煌最早经卷写本\"之一说成立；具体年代存疑（有西晋元康等说）。","im":"images/ep32_25.jpg","it":"细数甘肃省博物馆镇馆之宝_澎湃号·政务_澎湃新闻-The Paper","gp":"https://imagepphcloud.thepaper.cn/pph/image/318/22/231.jpg"},{"n":"北宋报父母恩重经变","e":"北宋","p":"甘肃省博物馆","b":"敦煌藏经洞出的北宋绢本《报父母恩重经变》，把佛经里孝敬父母的故事画成大幅经变图，是绢画里的精品。","f":"北宋；绢本彩绘；敦煌莫高窟藏经洞出土；《报父母恩重经变》图；甘肃省博物馆藏。","im":"images/ep32_26.jpg","it":"报父母恩重经变图（甘肃省博物馆收藏的宋代绘画）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/908fa0ec08fa513d2697ebf25b3e42fbb2fb431673d9?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"}]}]};
const list = document.getElementById('list');
const nav = document.getElementById('nav');
const q = document.getElementById('q');
const cnt = document.getElementById('cnt');
let activeEp = null;

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(s,kw){
  let h = esc(s);
  if(!kw) return h;
  try{ h = h.replace(new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); }catch(e){}
  return h;
}
function inEp(e,it,kw){
  if(!kw) return true;
  const hay = [e.no,e.t,e.loc,it.n,it.e,it.p,it.b,it.f,it.it].join(' ');
  return hay.toLowerCase().includes(kw.toLowerCase());
}
const TOTAL = 545;
function render(){
  const kw = q.value.trim();
  let shown = 0, html = '', navHtml = '<div class="navtip">32 家馆 · 右侧红字 = 本集文物件数</div>';
  for(const e of DATA.eps){
    const hits = e.it.filter(it => inEp(e,it,kw));
    if(!hits.length) continue;
    shown += hits.length;
    navHtml += `<a href="#ep_${e.no}"${activeEp===e.no?' class="on"':''}><i>${e.no}</i><span>${esc(e.t)}</span><u>${e.it.length}</u></a>`;
    html += `<section class="ep" id="ep_${e.no}"><div class="ehead"><span class="no">${e.no}</span><h2>${esc(e.t)}</h2><span class="loc">${esc(e.loc)}</span><span class="m">本集 ${e.it.length} 件</span></div>`;
    for(const it of hits){
      let imgh = '';
      if(it.im){
        const gp = esc(it.gp || it.im);
        imgh = `<div class="cimg"><a href="${gp}" target="_blank" rel="noopener">`
          + `<img src="${esc(it.im)}" alt="${esc(it.n)}" loading="lazy"></a>`
          + `<div class="csrc">${esc(it.it)} · <a href="${gp}" target="_blank" rel="noopener">图源</a></div></div>`;
      }
      html += `<article class="card${it.im?' im':''}">${imgh}<div class="ctop"><h3>${hl(it.n,kw)}</h3>`
        + `<span class="era">${esc(it.e)}</span><span class="place">${esc(it.p)}</span></div>`
        + `<p class="brief">${hl(it.b,kw)}</p>`;
      if(it.f) html += `<div class="row"><span class="k">看点与硬数据</span>${hl(it.f,kw)}</div>`;
      html += `</article>`;
    }
    html += `</section>`;
  }
  list.innerHTML = html || '<div class="empty">没有匹配的条目，换个词试试。</div>';
  nav.innerHTML = navHtml;
  cnt.textContent = `显示 ${shown} / ${TOTAL} 件`;
}

let t; q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(render,140);});
document.addEventListener('click',ev=>{
  const a = ev.target.closest('#nav a'); if(!a) return;
  activeEp = a.getAttribute('href').slice(4); render();
});

/* URL 直达：#q=关键词 直接搜索 */
(function(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h.slice(0,2) === 'q='){ q.value = h.slice(2); }
})();

render();
</script>
</body>
</html>
