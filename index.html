<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>镇馆之宝 · 文物图鉴（32 家馆 / 545 件）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f5f0; --card:#fffdfa; --ink:#2b2622; --ink2:#6b6259; --ink3:#96897c;
  --line:#e6dfd3; --line2:#d8cfbe; --red:#9c2b1e; --gold:#8a6d3b; --teal:#1f5f5b;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
  font:15px/1.75 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrapmax{max-width:1180px;margin:0 auto;padding:0 22px}

/* hero */
.hero{padding:52px 0 30px;border-bottom:1px solid var(--line)}
.kicker{font-size:12.5px;letter-spacing:.16em;color:var(--gold);margin-bottom:12px}
.hero h1{font-family:"Songti SC","SimSun","Noto Serif SC",serif;
  font-size:40px;line-height:1.18;font-weight:700;letter-spacing:.02em}
.hero h1 em{font-style:normal;color:var(--red)}
.sub{margin-top:14px;font-size:15px;color:var(--ink2);max-width:640px}
.stats{display:flex;gap:34px;margin-top:26px;flex-wrap:wrap}
.stats div{display:flex;align-items:baseline;gap:8px}
.stats b{font-size:27px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--ink2)}

/* toolbar */
.bar{position:sticky;top:0;z-index:20;background:rgba(247,245,240,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 0}
.barin{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:220px;padding:9px 13px;font-size:14px;color:var(--ink);
  background:#fff;border:1px solid var(--line2);border-radius:7px;outline:none}
#q:focus{border-color:var(--red)}
.cnt{font-size:13px;color:var(--ink3);margin-left:auto;white-space:nowrap}

/* layout */
.wrap{display:grid;grid-template-columns:188px 1fr;gap:34px;padding:30px 0 90px}
#nav{position:sticky;top:74px;align-self:start;max-height:calc(100vh - 100px);
  overflow:auto;font-size:13px;padding-right:6px}
#nav a{display:flex;gap:7px;align-items:baseline;padding:5px 8px;border-radius:6px;
  color:var(--ink2);line-height:1.45}
#nav a:hover{background:#efeade;color:var(--ink)}
#nav a.on{background:#efeade;color:var(--ink);font-weight:600}
#nav a i{font-style:normal;font-size:11.5px;color:var(--ink3);
  font-variant-numeric:tabular-nums;min-width:18px}
#nav a u{text-decoration:none;font-size:11px;color:var(--red);margin-left:auto}
.navtip{font-size:11.5px;color:var(--ink3);padding:0 8px 8px;line-height:1.5}

/* episode */
.ep{padding:30px 0 6px;scroll-margin-top:76px}
.ep:first-child{padding-top:6px}
.ehead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding-bottom:11px;border-bottom:2px solid var(--ink)}
.ehead .no{font-family:"Songti SC","SimSun",serif;font-size:26px;font-weight:700;
  color:var(--red);font-variant-numeric:tabular-nums}
.ehead h2{font-size:19px;font-weight:700;letter-spacing:.01em}
.ehead .loc{font-size:13px;color:var(--ink3)}
.ehead .m{margin-left:auto;font-size:12.5px;color:var(--ink2);white-space:nowrap}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:17px 19px;margin-top:13px}
.card.im{display:grid;grid-template-columns:206px 1fr;gap:0 18px}
.cimg{grid-row:1/span 4}
.cimg a{display:block}
.cimg img{display:block;width:100%;max-height:250px;object-fit:contain;
  background:#f2ede3;border-radius:7px;border:1px solid var(--line);cursor:zoom-in}
.csrc{margin-top:6px;font-size:11.5px;line-height:1.5;color:var(--ink3);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.csrc a{color:var(--teal)}
.ctop{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card h3{font-size:16.5px;font-weight:700;line-height:1.4}
.era{font-size:12px;color:var(--teal);background:#eaf1f0;padding:2px 8px;
  border-radius:20px;white-space:nowrap}
.place{font-size:12.5px;color:var(--ink3)}
.brief{margin-top:9px;font-size:14.5px;color:var(--ink)}
.row{margin-top:9px;font-size:13.5px;color:var(--ink2);
  padding-left:11px;border-left:2px solid var(--line)}
.row span.k{display:block;font-size:11.5px;letter-spacing:.1em;color:var(--ink3);
  margin-bottom:2px}
mark{background:rgba(156,43,30,.16);color:inherit;padding:0 2px;border-radius:2px}
.empty{padding:60px 0;text-align:center;color:var(--ink3);font-size:14px}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr;gap:0}
  #nav{display:none}
  .hero h1{font-size:30px}
  .hero{padding:36px 0 22px}
  .stats{gap:22px}
}
@media (max-width:700px){
  .card.im{grid-template-columns:1fr}
  .cimg{grid-row:auto;max-width:280px;margin-bottom:12px}
}
</style>
</head>

<script>
const DATA = {"eps":[{"no":"01","t":"南京博物院","loc":"江苏南京","it":[{"n":"金兽","e":"战国晚期至西汉早期","p":"南京博物院","b":"1982年江苏盱眙南窑庄窖藏出土，重达9100克、含金量99%，是我国出土最重的古代黄金铸器，造型蜷伏似豹，究竟是何动物至今众说纷纭。","f":"1982年出土于江苏省盱眙县南窑庄窖藏；长17.5厘米、宽16厘米、高10.2厘米；重9100克，含金量99%；空腹厚壁、浇铸成形，通体锤饰圆形斑纹，腹内刻\"黄六\"二字；年代最晚可至西汉，多推测为战国晚期至西汉早期；现藏南京博物院。","im":"images/ep01_00.jpg","it":"南京博物院藏· 西汉金兽","gp":"https://n.sinaimg.cn/sinacn20112/286/w1606h1080/20190219/7df5-htfpvza0468661.jpg"},{"n":"错金银重络铜壶（陈璋圆壶）","e":"战国（燕）","p":"南京博物院","b":"1982年与金兽同出盱眙南窑庄窖藏，因器身满饰错金银网套（重络）得名，腹有燕国量器铭文，与海外回流的陈璋方壶互为佐证，是先秦金属工艺瑰宝。","f":"又名陈璋圆壶；战国中期燕国铜器；1982年盱眙南窑庄出土；残高约24厘米、口径12.8厘米；器身错金银重络纹，腹刻燕国量器铭（\"廿五重金络壶受一孛五纣\"，\"孛、纣\"为燕国量词）；现藏南京博物院。","im":"images/ep01_01.jpg","it":"南京博物院十大镇院之宝之一：错金银重络铜壶_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/6c224f4a20a4462309f7e0902a6f650e0cf3d6ca79b9?x-bce-process=image/format,f_auto"},{"n":"透雕人鸟兽玉饰件","e":"新石器·良渚文化","p":"南京博物院","b":"1991年江苏昆山赵陵山77号墓出土，以透雕技法琢出神人、鸟、兽组合图案，是迄今所见最早的人鸟兽主题透雕玉作精品，体现良渚微雕高度。","f":"1991年昆山赵陵山遗址77号墓出土；长6.4厘米、宽3.4厘米、厚0.5厘米；透雕人、鸟、兽（虎）图案；良渚文化；现藏南京博物院。","im":"images/ep01_02.png","it":"首次举办！国家博物馆、南京博物院等20家博物馆来厦门 _ 文博资讯 _ 福建省文物局","gp":"http://wwj.wlt.fujian.gov.cn/xwzx/wbyw/202411/W020241104351195005352.png"},{"n":"神人兽面纹玉琮","e":"新石器·良渚文化","p":"南京博物院","b":"1982年江苏武进寺墩4号墓出土，矮方柱体外方内圆，上下两节分饰人面与兽面纹，其徒手雕刻的极细阴线工艺至今仍难以复制。","f":"1982年11月出土于江苏常州武进寺墩遗址4号墓；高7.2厘米、边宽8.5—8.3厘米、内孔径6.1厘米；透闪石软玉，上下两节分饰人面纹、兽面纹；刻纹宽仅0.1—0.2毫米；良渚文化；现藏南京博物院。","im":"images/ep01_03.jpg","it":"良渚与古代中国","gp":"https://ggzlimg.dpm.org.cn/app/gugong/2019/1009/7wHbqwI8yKsulF7kebWFZitca37LcY78jDtzspvF.jpg"},{"n":"银缕玉衣","e":"东汉","p":"南京博物院","b":"1969年徐州土山一号汉墓出土，由2600余片玉片以约800克银丝编缀而成，是首件经科学复原、品相完好的汉代银缕玉衣，墓主为东汉某代彭城王。","f":"1969年出土于徐州土山一号汉墓；全长170厘米，共用玉片2600余片，编缀银丝重约800克；由头罩、上衣、裤子、手套、鞋五部分组成；墓主为东汉某代彭城王（或刘恭）；现藏南京博物院。","im":"images/ep01_04.jpg","it":"银缕玉衣_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/a044ad345982b2b7d0a2353c2cf5dcef76094a362d89?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_852"},{"n":"鎏金镶嵌兽形铜盒砚","e":"东汉","p":"南京博物院","b":"1969年与银缕玉衣同出徐州土山汉墓，通体鎏金银并嵌宝石，形似匍匐蟾蜍，下颌巧作墨池，是汉代文房与鎏金银镶嵌工艺的巅峰之作。","f":"又名鎏金镶嵌琉璃珠兽形铜砚盒；1969年出土于江苏徐州东汉土山汉墓；盒长25厘米、宽14.8厘米、通高10.2厘米；形似匍匐蟾蜍，头生双角、身添羽翼；通体鎏金银并镶嵌绿松石、青金石、玛瑙等；内置石砚及磨石，出土时砚面留有墨痕；现藏南京博物院。","im":"images/ep01_05.jpg","it":"东汉鎏金镶嵌兽形铜盒砚_百度百科","gp":"http://baike.baidu.com/cms/s/museum/v2/uploads/06鎏金镶嵌兽形铜盒砚原尺寸.png"},{"n":"明洪武釉里红三友带盖梅瓶","e":"明洪武","p":"南京博物院","b":"1957年南京东善桥响龙山明墓出土，墓主为驸马宋琥与安成公主，是现存唯一完整带盖的明洪武釉里红梅瓶，属国宝级瓷器。","f":"1957年3月出土于南京市东善桥响龙山明代墓葬；通高41.7厘米；景德镇官窑；白釉微青，釉里红发色略黑；以松竹梅\"岁寒三友\"为主题；墓主为明成祖朱棣之女安成公主与驸马都尉宋琥；1993年定为国宝级文物，现存唯一完整的洪武釉里红带盖梅瓶；现藏南京博物院。","im":"images/ep01_06.jpg","it":"【明洪武 釉里红带盖梅瓶】拍卖品_图片_价格_鉴赏_明代彩瓷_雅昌艺术品拍卖网","gp":"https://img1.artron.net/auction/2013/art002643/d/art0026430241.jpg"},{"n":"青瓷神兽尊","e":"西晋","p":"南京博物院","b":"1976年江苏宜兴周处家族墓出土，以神兽堆塑为饰，造型独特且出自纪年墓葬，至今未见可靠同类器，是西晋青瓷国宝并禁出境展览。","f":"1976年出土于江苏宜兴周处家族墓（周墓墩4号墓）；高27.9厘米、口径13.3厘米；西晋永宁二年（302年）之物；腹部堆塑神兽、口含圆珠，底部刻\"东州\"二字；1993年定为国宝级文物，列入禁止出境展览目录；现藏南京博物院。","im":"images/ep01_07.jpg","it":"禁止出国展览的陶瓷文物--书画--人民网","gp":"http://art.people.com.cn/NMediaFile/2017/0306/MAIN201703061529000292919520128.jpg"},{"n":"广陵王玺金印","e":"东汉","p":"南京博物院","b":"1981年扬州甘泉附近出土，纯金铸龟钮，印文\"广陵王玺\"，是迄今唯一出自考古发掘的汉代刘姓诸侯王金印，并印证了\"汉委奴国王\"金印之真。","f":"1981年2月出土于江苏扬州邗江县甘泉二号汉墓附近；纯金铸成，龟钮；印面边长约2.3厘米、台高0.9厘米、钮通高2.1厘米，重122.8克；阴刻篆文\"广陵王玺\"；墓主为东汉广陵王刘荆；现藏南京博物院。","im":"images/ep01_08.jpg","it":"揭秘“广陵王玺”金印：主人是东汉广陵王刘荆--文化--人民网","gp":"http://paper.people.com.cn/rmrb/res/1/20141214/1418496279731_1.jpg"},{"n":"错银铜牛灯","e":"东汉","p":"南京博物院","b":"1980年扬州甘泉二号东汉墓出土，牛腹中空、以清水溶烟尘，是两千年前兼顾实用与环保的青铜灯具杰作，被誉为\"环保黑科技\"。","f":"1980年出土于江苏扬州邗江县甘泉2号东汉墓；通高46.2厘米、身长36.4厘米；由灯座、灯盏、烟管三部分组成，可拆卸；点燃时烟尘经烟管导入牛腹清水；与广陵王玺同墓出土，属王室器物；现藏南京博物院。","im":"images/ep01_09.jpg","it":"南京：博物馆里过大年-人民图片网","gp":"http://vip-public.people.com.cn/photo/2022/2/3/98a8da5681bb4a06a5354df57cc6f76cWmj2_m.jpg"},{"n":"竹林七贤与荣启期砖画","e":"南朝","p":"南京博物院","b":"1960年南京西善桥南朝墓出土，以近300块模印墓砖拼嵌而成，是现存最早、最完整的魏晋人物组画，画中为何无竹至今成谜。","f":"1960年4月出土于南京西善桥宫山南朝墓葬；分嵌墓室南北两壁，各由近300枚砖拼成，规格约长2.4米、高0.88米；绘嵇康、阮籍、山涛、王戎、向秀、刘伶、阮咸及春秋荣启期八人；国家文物局列禁止出境展览文物；现藏南京博物院。","im":"images/ep01_10.jpg","it":"南京博物院","gp":"https://www.njmuseum.com/files/nb/collection/modify/2020/09/09/159962003516803.jpg"},{"n":"金蝉玉叶","e":"明（中期）","p":"南京博物院","b":"1954年苏州明代张安晚家族墓出土，金蝉栖于玉叶之上，应为贵族女子发簪，取\"金枝玉叶\"谐音，是国内出土的唯一一件此类饰件。","f":"1954年出土于苏州五峰山博士坞明代弘治进士张安晚家族墓地14号墓；金蝉长5.3厘米、重4.65克，成色95%；玉叶长5.2厘米、宽约3.2厘米，和田羊脂白玉；出土于墓主头部，与银笄等共出，为发簪组件；现藏南京博物院。","im":"images/ep01_11.jpg","it":"明金蝉玉叶_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/18d8bc3eb13533fa828b3d505389ea1f4134970aed00?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_960"},{"n":"鎏金喇嘛塔","e":"明","p":"南京博物院","b":"1956年南京牛首山弘觉寺塔地宫出土，通高35厘米，由鎏金塔与须弥座、四瓷罐合成金刚宝座塔式，或有学者认为与郑和有关。","f":"1956年发现于南京牛首山弘觉寺塔地宫；通高35厘米；由塔基、塔身、塔刹组成，须弥座下刻题记，座四角各置青瓷罐（其一藏牙齿及骨灰）；鎏金释迦涅槃像长10厘米；有学者推测与郑和有关，尚无定论；现藏南京博物院。","im":"images/ep01_12.jpg","it":"明鎏金喇嘛塔_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/d62a6059252dd42aac69f351043b5bb5c8eab8ec?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"杂花图卷","e":"明","p":"南京博物院","b":"明代徐渭水墨大写意代表作，十余米长卷写13种花卉蔬果，笔墨狂放淋漓，是南博镇馆之宝中唯一一件书画作品。","f":"明徐渭（1521—1593）作；纵30厘米、横1053.5厘米；纸本水墨，绘牡丹、石榴、荷花等13种花卉蔬果；1954年征集入藏；谢稚柳誉\"天下第一徐青藤\"；南博18件镇院之宝中唯一书画；现藏南京博物院。","im":"images/ep01_13.jpg","it":"艺赏 | 南博携徐渭《杂花图卷》带你感受春天的气息_芭蕉","gp":"http://5b0988e595225.cdn.sohucs.com/images/20200320/d8c674f9369044fd8ff089fc19dfd909.jpeg"},{"n":"明宣德青花寿山福海纹瓷炉","e":"明宣德","p":"南京博物院","b":"明宣德景德镇官窑所制，仿青铜鼎造型，蓝地白花绘汹涌波涛与山峦寓\"寿山福海\"，是南迁文物中幸存的宣德官窑大器。","f":"明宣德景德镇官窑；高58厘米、口径37.6厘米；仿青铜鼎，蓝地白花绘寿山福海纹，用进口苏泥勃青料；1930年代随故宫文物南迁，1949年未及运台而留南京；完整宣德同类器仅存一、二件；现藏南京博物院。","im":"images/ep01_14.jpg","it":"走近永乐时期的辉煌遗产","gp":"https://paper.people.com.cn/rmrbhwb/images/1/20230718/1689618344813_1.jpg"},{"n":"坤舆万国全图","e":"明（万历）","p":"南京博物院","b":"利玛窦与李之藻合作绘刊的世界地图，南博所藏为1608年宫廷彩色摹绘本，是我国现存最早、唯一的据刻本摹绘世界地图。","f":"意大利传教士利玛窦绘制、李之藻合作刊刻；原刻1602年（万历三十年）北京付印，刻本已失传；南博藏本为明万历三十六年（1608）宫廷彩色摹绘本；尺寸约168×382厘米；五大洲四大洋俱全，附九重天等小图；1922年购回，1936年入藏中央博物院（南博前身）；现藏南京博物院。","im":"images/ep01_15.jpg","it":"观天下——大明的世界_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/b7fd5266d0160924ab18b79c715e22fae6cd7a899eb9?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_1000"},{"n":"清代藏传佛教金观音菩萨立像","e":"清（乾隆）","p":"南京博物院","b":"清乾隆宫廷造办处以高纯度黄金铸造的藏传佛教菩萨立像，通高88厘米、重约41斤，嵌珍珠宝石，尽显皇家气派。","f":"清乾隆时期宫廷造办处铸造（一说尼泊尔进贡，学界多倾向宫廷造）；高88厘米，含金量约83%，重约40公斤（41斤）；赤足立于双层莲座，戴五叶冠，嵌珍珠、绿松石等；1994年鉴定为一级藏品；现藏南京博物院。","im":"images/ep01_16.jpg","it":"【宋 鎏金铜观音菩萨立像】拍卖品_图片_价格_鉴赏_佛教文物其它_雅昌艺术品拍卖网","gp":"https://img1.artron.net/auction/2014/art504989/d/art5049890131.jpg"},{"n":"耶稣像（沈寿绣）","e":"民国","p":"南京博物院","b":"刺绣名家沈寿以独创\"仿真绣\"据油画《荆棘冠冕》绣成，1915年获巴拿马博览会金奖，是南博镇馆之宝中最年轻的一件。","f":"沈寿（1874—1921）作，约1915年；纵54.8厘米、横39.4厘米；绸料丝线，仿真绣；取材自意大利画家圭多·雷尼油画《头戴荆冠的基督像》；1915年旧金山巴拿马太平洋万国博览会获一等大奖（金奖）；1986年张謇后人献归南博；现藏南京博物院。","im":"images/ep01_17.jpg","it":"南京博物院","gp":"https://www.njmuseum.com/files/nb/department/image/2019/11/22/b3dc2a622bfb6e18ecf2b4defbbadb1b.jpg"}]},{"no":"02","t":"甘肃省博物馆","loc":"甘肃兰州","it":[{"n":"驿使画像砖","e":"魏晋","p":"甘肃省博物馆","b":"1972年嘉峪关新城魏晋墓出土，画面绘一信使持牍催马疾驰，是我国邮政标志\"驿使图\"的来源，生动再现古代邮驿。","f":"1972年出土于甘肃嘉峪关新城堡魏晋墓（6号墓）；砖面绘驿使骑马传书，马尾束起、无嘴（避讳）；1982年中国邮政发行邮票选用此图，定为邮政标志；现藏甘肃省博物馆。","im":"images/ep02_00.jpg","it":"新一期的《国家宝藏》甘肃省博物馆的三件国宝|甘肃省博物馆|国家宝藏|国宝_新浪新闻","gp":"http://n.sinaimg.cn/sinacn20112/273/w1605h1068/20190122/cd62-hryfqhk6416395.jpg"},{"n":"大云寺五重舍利套函","e":"唐","p":"甘肃省博物馆","b":"1964年甘肃泾川大云寺地宫出土，以石函、铜匣、银椁、金棺、琉璃瓶五重套函瘗藏佛骨舍利，工艺极精，是唐代瘗葬制度实证。","f":"1964年甘肃泾川大云寺遗址（隋代大兴国寺塔基地宫）出土；五重套函依次为石函、铜匣、银椁、金棺、琉璃瓶；内装14粒佛骨舍利；唐代（武则天时期）瘗埋；现藏甘肃省博物馆。","im":"images/ep02_01.jpg","it":"“出圈”的平凉泾川，这里的文物会“说话”_澎湃号·政务_澎湃新闻-The Paper","gp":"https://imagepphcloud.thepaper.cn/pph/image/226/192/960.jpg"},{"n":"泾川出土舍利","e":"唐—宋","p":"甘肃省博物馆","b":"甘肃泾川屡有舍利出土，1964年大云寺14粒、1969年北周慧明32粒、2013年宋代龙兴寺地宫2000余粒，是佛教东传的重要见证。","f":"甘肃泾川多次出土佛舍利：1964年大云寺地宫14粒、1969年北周比丘慧明舍利塔32粒、2013年宋代龙兴寺地宫2000余粒；并非\"约3000粒疑宋代僧人避祸所埋\"一说所能概括；现分藏甘肃省博物馆等机构。","im":"images/ep02_02.jpg","it":"甘肃泾川：中国唯一三次出土佛舍利的圣地","gp":"http://k.sinaimg.cn/n/sinacn/w640h257/20180119/a021-fyqtwzu7601601.jpg/w700d1q75cms.jpg"},{"n":"马踏飞燕（铜奔马）","e":"东汉","p":"甘肃省博物馆","b":"1969年武威雷台汉墓出土，青铜奔马三足腾空、一足踏飞鸟，1983年定为中国旅游标志，是汉代雕塑与青铜工艺的杰作。","f":"1969年出土于甘肃武威雷台汉墓；通高34.5厘米、长45厘米、重7.15公斤；铜奔马三足腾空、一足踏飞鸟；1983年10月被国家旅游局确定为中国旅游标志；学界多称\"铜奔马\"；现藏甘肃省博物馆。","im":"images/ep02_03.jpg","it":"东汉铜奔马，就是我们熟知的马踏飞燕，现藏于甘肃省博物馆|铜奔马|甘肃省博物馆|飞燕|气概|身躯_新浪新闻","gp":"https://n.sinaimg.cn/sinacn20100/152/w2048h2104/20190710/69cb-hzrevpz3199497.jpg"},{"n":"西汉彩绘木轺车","e":"西汉","p":"甘肃省博物馆","b":"武威磨嘴子汉墓出土，由舆、轮、辕、伞盖等组成的彩绘木轺车，是迄今发现最大、最完整的汉代木雕车马模型。","f":"1957—1959年及1972年武威磨嘴子汉墓出土（多座）；木轺车由车舆、车轮、车辕、伞盖、御奴、马组成；马高约87厘米，车通高约97厘米；西汉；现藏甘肃省博物馆。","im":"images/ep02_04.jpg","it":"穿越去秦汉 看看甘肃老乡的日常凤凰网甘肃_凤凰网","gp":"https://x0.ifengimg.com/cmpp/fck/2020_20/7fa8694d6a58f27_w640_h548.jpg"},{"n":"彩绘木雕六博俑","e":"西汉","p":"甘肃省博物馆","b":"1972年武威磨嘴子汉墓出土，二人跪坐对博，再现汉代六博棋戏场景，是罕见的木雕博弈俑，极具生活气息。","f":"1972年出土于甘肃武威磨嘴子汉墓（48号墓）；两件木俑跪坐对弈六博，旁置棋盘；高约29厘米；西汉；现藏甘肃省博物馆。","im":"images/ep02_05.jpg","it":"彩绘木雕六博俑_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/908fa0ec08fa513d9e8c20943d6d55fbb2fbd952?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"彩绘木独角兽（獬豸）","e":"西汉","p":"甘肃省博物馆","b":"武威磨嘴子汉墓出土，独角朝天的镇墓兽，源自\"獬豸\"神兽，被视为明清衙门前石兽的原型，寓意镇墓辟邪。","f":"武威磨嘴子汉墓出土（52号墓等）；木雕彩绘，独角冲天；高约80厘米、长70余厘米；西汉；用于镇墓辟邪，象征獬豸（神羊）；现藏甘肃省博物馆。","im":"images/ep02_06.jpg","it":"数字甘博官方网站","gp":"http://www.gansumuseum.com/sccp-file/1720367572261658626/image/2025-09-22/1970105468839923712.jpg"},{"n":"仪礼简","e":"西汉","p":"甘肃省博物馆","b":"武威磨嘴子汉墓出土《仪礼》竹木简，是迄今所见最古老、最完整的《仪礼》手抄本之一，有\"天下第一简\"之誉。","f":"1959年出土于甘肃武威磨嘴子6号汉墓；共469枚（含木简、木牍）；抄写《仪礼》十七篇中的七篇，为西汉经书足本；现藏甘肃省博物馆。","im":"images/ep02_07.jpg","it":"甘肃简牍博物馆开馆 9月9日起向公众开放 - 甘肃文旅 - 丝绸之路（敦煌）国际文化博览会","gp":"https://www.gswbj.gov.cn/uploadfile/20230911/1694414605940580.jpg"},{"n":"元代玻璃莲花托盏","e":"元","p":"甘肃省博物馆","b":"1975年甘肃定西漳县汪世显家族墓出土，由托与盏组成的玻璃莲花器，是国内罕见的元代玻璃精品，疑为官办仿玉之作。","f":"1975年出土于甘肃定西漳县汪世显家族墓（M20汪惟贤墓）；玻璃莲花形托盏，盏高约4.6厘米、托径约12.5厘米；经研究为元代官办作坊（瓘玉局）所制仿玉玻璃器，非海外输入；现藏甘肃省博物馆。","im":"images/ep02_08.jpg","it":"甘肃省博物馆藏· 元代玻璃莲花托盏|托盏|甘肃省博物馆|玻璃器|家族墓地|漳县_新浪新闻","gp":"http://k.sinaimg.cn/n/sinacn20122/298/w1080h1618/20190223/a97e-htknpmi1586765.jpg/w700d1q75cms.jpg?by=cms_fixed_width"},{"n":"人头形器口彩陶瓶","e":"仰韶文化（庙底沟类型）","p":"甘肃省博物馆","b":"1973年甘肃秦安大地湾出土，瓶口塑成人头面庞、披发\"齐刘海\"，是仰韶彩陶中罕见的人像器口造型，充满神秘感。","f":"1973年出土于甘肃秦安大地湾遗址；高约31.8厘米；细泥红陶，瓶口塑成人头，雕\"齐刘海\"发型、身穿对襟；仰韶文化庙底沟类型（距今约5500—5900年）；现藏甘肃省博物馆。","im":"images/ep02_09.jpg","it":"甘肃省文物局","gp":"http://wwj.gansu.gov.cn/wwj/c105438/202401/173838693/images/a13bba8a1deb436c8770142173ed4090.jpg"},{"n":"鲵纹彩陶瓶","e":"仰韶文化（石岭下类型）","p":"甘肃省博物馆","b":"1958年甘肃甘谷出土的鲵鱼纹彩陶瓶，腹部绘具象鲵鱼（娃娃鱼），是先民图腾或\"龙\"原型猜想的珍贵实物。","f":"1958年出土于甘肃甘谷县西坪遗址；高约38.4厘米；泥质红陶，腹部绘鲵鱼纹（娃娃鱼）；属仰韶文化石岭下类型，距今约5200—5500年；现藏甘肃省博物馆。","im":"images/ep02_10.jpg","it":"到国家博物馆看甘肃文物菁华展","gp":"http://www.ncha.gov.cn/picture/0/1905280939508264574.jpg"},{"n":"高善穆石造像塔","e":"北凉","p":"甘肃省博物馆","b":"甘肃酒泉出土的北凉石塔，基座刻八卦与发愿文，是现存最早带八卦图案的实物之一，弥足珍贵。","f":"1969年出土于甘肃酒泉石佛湾子；北凉承玄元年（428年）造；高44.6厘米、底径15.2厘米；七级楼阁式，基座刻八卦与\"承玄元年\"发愿文；现藏甘肃省博物馆。","im":"images/ep02_11.jpg","it":"文明大观：丝绸之路上的敦煌-中国丝绸博物馆","gp":"https://www.chinasilkmuseum.com/uploadfiles/2023/07/20230714153605616.jpg"},{"n":"彩塑坐佛与胁侍菩萨","e":"北朝（北凉开窟·唐代塑）","p":"甘肃省博物馆","b":"出自武威天梯山石窟，唐代重妆的彩塑，体现\"凉州模式\"石窟艺术，是甘肃石窟造像的代表，1950年代迁藏甘博。","f":"原位于甘肃武威天梯山石窟第3窟（唐窟），1958年因水库建设搬迁，后交甘肃省博物馆；坐佛高约130厘米、左胁侍菩萨高约183厘米、右胁侍高约180厘米；北凉开窟、唐代塑像并重妆；现藏甘肃省博物馆。","im":"images/ep02_12.jpg","it":"【甘快看】文物图鉴 | 甘肃佛教造像艺术图鉴_甘肃文化_中国甘肃网","gp":"https://my-h5news.app.xinhuanet.com/chaobian-difanglink/gs.news.cn/20251210/77dd789de0384745980a0a51c5bfb2da/2025121077dd789de0384745980a0a51c5bfb2da_2025121055612a5dc50c4331949cddfb1e61134a.jpg"},{"n":"东罗马神人纹鎏金银盘","e":"北魏（传入）","p":"甘肃省博物馆","b":"1988年甘肃靖远出土的鎏金银盘，盘心浮雕酒神狄俄尼索斯及环绕神像，是丝绸之路上希腊罗马金银器的见证。","f":"1988年出土于甘肃靖远；直径约31厘米；鎏金银盘，盘心浮雕酒神（狄俄尼索斯）及环列神人、葡萄纹；约公元4—6世纪东罗马（拜占庭）制品，经丝路传入；现藏甘肃省博物馆。","im":"images/ep02_13.jpg","it":"东罗马神人纹鎏金银盘_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/9345d688d43f8794a4c209d7915719f41bd5ac6e8cbc?x-bce-process=image/resize,m_lfit,w_536,limit_1"},{"n":"八思巴文虎符圆牌","e":"元","p":"甘肃省博物馆","b":"元代驿站通行符牌，铁质错银八思巴文，流传极罕，是元代邮驿制度与八思巴文使用的实物见证。","f":"20世纪50年代征集于兰州废金属库（一说1965年）；铁质，通体鎏金错银八思巴文，一面为\"长生天气力里，皇帝圣旨，不从者治罪\"；通高约18厘米、直径约11.7厘米、重约247克；元代驿站符牌；现藏甘肃省博物馆。","im":"images/ep02_14.jpg","it":"道中华_河北省民族事务委员会","gp":"http://mw.hebei.gov.cn/pic/003/002/617/00300261739_e31d8af7.jpg"},{"n":"肃本淳化阁帖","e":"明","p":"甘肃省博物馆","b":"明万历年间以宋拓《淳化阁帖》为底刻石的\"肃府本\"，共144块，是法帖之祖《淳化阁帖》的重要传世刻本。","f":"明万历四十三年（1615）始刻、天启元年（1621）竣工，肃王朱缙斡主持，以宋拓为底本刻石于兰州；富平石144块（后存142方）；1966年交由甘肃省博物馆；1996年列入国家一级文物（国宝）；现藏甘肃省博物馆。","im":"images/ep02_15.jpg","it":"“法帖之祖”《淳化阁帖》：百家墨宝齐鸣千年 - 甘肃文旅 - 丝绸之路（敦煌）国际文化博览会","gp":"https://www.gswbj.gov.cn/uploadfile/20240603/1717397230960267.jpg"},{"n":"人头銎勾戟","e":"西周早期","p":"甘肃省博物馆","b":"1972年甘肃灵台白草坡西周墓出土，刺、援、钩合一的青铜复合兵器，人头形銎口为其特色，极为罕见。","f":"1972年10月出土于甘肃灵台白草坡西周潶伯墓（M1）；通长25.5厘米、宽23厘米、重275克；人头形銎，刺、援、钩组合；西周早期；现藏甘肃省博物馆。","im":"images/ep02_16.jpg","it":"人头銎戟_百度百科","gp":"https://bkimg.cdn.bcebos.com/smart/503d269759ee3d6dea28c77843166d224e4ade93-bkimg-process,v_1,rw_1,rh_1,pad_1,color_ffffff?x-bce-process=image/format,f_auto"},{"n":"北宋报父母恩重经变画","e":"北宋","p":"甘肃省博物馆","b":"敦煌藏经洞出土的绢画，以\"报父母恩重经变\"为主题，绘佛说法与世俗孝养双亲场景，是敦煌绢画珍品。","f":"出自敦煌莫高窟藏经洞（第17窟）；北宋淳化二年（991年）题记；纵182厘米、横127厘米；绘佛说法及孝养父母情节，人物约123身；现藏甘肃省博物馆。","im":"images/ep02_17.jpg","it":"报父母恩重经变图（甘肃省博物馆收藏的宋代绘画）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/908fa0ec08fa513d2697ebf25b3e42fbb2fb431673d9?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"}]},{"no":"03","t":"湖南省博物馆","loc":"湖南长沙","it":[{"n":"人面纹方鼎","e":"商","p":"湖南省博物馆","b":"1959年宁乡黄材出土的商代青铜方鼎，四壁浮雕人面，是我国唯一以人面为饰的青铜鼎，腹内壁铭\"大禾\"，神秘未解。","f":"1959年出土于湖南宁乡县黄材镇炭河里遗址；高38.5厘米、口长29.8厘米、宽23.7厘米；鼎腹四面浮雕人面纹，腹内壁铸\"大禾\"铭文；商代晚期；现藏湖南省博物馆。","im":"images/ep03_00.jpg","it":"探秘商周时期人面青铜鼎：差一点点就失去了，价值连城_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/55e736d12f2eb9389b50911c59379235e5dde611c19d"},{"n":"象纹大铜铙","e":"商","p":"湖南省博物馆","b":"1959年宁乡老粮仓出土的商代巨型铜铙，主纹为象，可一器发双音，是宁乡铜铙中的代表，铸造之谜至今未解。","f":"1959年出土于湖南宁乡老粮仓；高约70—71厘米、重67.25公斤；钲部主饰象纹，可发双音；商代晚期；现藏湖南省博物馆。","im":"images/ep03_01.jpg","it":"传世品_中国国家博物馆官方网站","gp":"https://www.chnmuseum.cn/zp/zpml/csp/202208/P020220830595613459332.jpg"},{"n":"豕形铜尊","e":"商","p":"湖南省博物馆","b":"1981年湘潭船形山出土的商代青铜豕尊，以野公猪为造型的盛酒祭器，是极罕见的肖形青铜重器。","f":"1981年出土于湖南湘潭县船形山；高约40厘米、长72厘米、重19.75公斤；野公猪造型，背有尊口；商代晚期；现藏湖南省博物馆。","im":"images/ep03_02.jpg","it":"商豕形铜尊_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/b8014a90f603738da977bf45d457a751f8198618460d?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"辛追墓棺椁","e":"西汉","p":"湖南省博物馆","b":"1972年马王堆一号汉墓出土的辛追棺椁，一椁四棺层层套合，髹漆彩绘，是汉代丧葬礼制与髹漆工艺的实物标本。","f":"1972年出土于长沙马王堆一号汉墓（辛追墓）；一椁四棺，外椁内四层套棺；棺木髹漆彩绘（黑地彩绘、朱地彩绘）；墓主为西汉长沙国丞相轪侯利苍之妻辛追；现藏湖南省博物馆。","im":"images/ep03_03.jpg","it":"五十年前湖南发现辛追夫人，沉睡千年为何仍能身躯不腐？_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/aa18972bd40735fae6cdda58b61b18b30f2443a7a2b2"},{"n":"辛追墓T形帛画","e":"西汉","p":"湖南省博物馆","b":"马王堆一号汉墓出土的T形帛画，描绘天上、人间、地下三界，是西汉升仙宇宙观的图示，设色瑰丽。","f":"1972年出土于长沙马王堆一号汉墓；通长205厘米、上宽92厘米、下宽47.7厘米；帛画分天上、人间、地下三界；现藏湖南省博物馆。","im":"images/ep03_04.jpg","it":"汉代的天上人间地下：长沙马王堆辛追夫人墓T型帛画详细图解","gp":"http://5b0988e595225.cdn.sohucs.com/images/20180324/346239803bb2495aa807d976dc4822f3.jpeg"},{"n":"辛追夫人（湿尸）","e":"西汉","p":"湖南省博物馆","b":"马王堆一号汉墓出土的辛追遗体，历经两千余年仍肌肤有弹性、脏器完好，是世界罕见的湿尸标本与防腐奇迹。","f":"1972年出土于长沙马王堆一号汉墓；墓主辛追，约死于公元前2世纪，享年约50岁；身长1.54米、体重34.3公斤；尸体保存完好；现藏湖南省博物馆（标本）。","im":"images/ep03_05.jpg","it":"一眼万年，湖南省博物馆长沙马王堆不朽女尸“辛追夫人”不腐之谜 - 知乎","gp":"https://pic2.zhimg.com/v2-852fa5f3478358d1d6b94cef0233b105_r.jpg"},{"n":"素纱单衣","e":"西汉","p":"湖南省博物馆","b":"马王堆出土的两件素纱单衣中，现存展出的直裾衣重49克，另有曲裾衣重48克曾遭盗毁，是汉代丝织工艺巅峰。","f":"1972年马王堆一号汉墓出土；共两件：直裾素纱单衣重49克（现存展出）、曲裾素纱单衣重48克（1983年被盗后烧毁）；均为辛追随身衣；现藏湖南省博物馆。","im":"images/ep03_06.jpg","it":"从庞贝壁画看到汉代单衣：湘博聚焦中意跨文化交流_手机新浪网","gp":"https://k.sinaimg.cn/n/collect/transform/w550h401/20180117/Y6ZW-fyqtwzt9542845.jpg/w700d1q75cms.jpg?by=cms_fixed_width"},{"n":"马王堆帛书","e":"西汉","p":"湖南省博物馆","b":"1973年马王堆三号汉墓出土的帛书，含《老子》甲乙本、《黄帝四经》等数十种古籍，填补诸多学术空白。","f":"1973年出土于长沙马王堆三号汉墓；约12万字（含医书等）的帛书与图；含《老子》甲本乙本、《黄帝四经》《战国纵横家书》等；现藏湖南省博物馆。","im":"images/ep03_07.jpg","it":"雅昌带你看展览 | 长沙马王堆汉墓：辛追的“千金之家”及永生之梦","gp":"http://5b0988e595225.cdn.sohucs.com/images/20180129/72297ecfee6f4ee0b9ebd6e1a3e59c67.jpeg"},{"n":"长沙窑青釉褐彩贴花人物纹壶","e":"唐","p":"湖南省博物馆","b":"1973年衡阳出土的唐长沙窑壶，贴花人物作胡腾舞姿态，曾同型器见于\"黑石号\"沉船，是外销瓷代表。","f":"1973年出土于湖南衡阳；高约16.4厘米；长沙窑，青釉褐彩贴花人物纹；贴花人物为胡腾舞（中亚粟特男子独舞）；同款见于\"黑石号\"沉船；现藏湖南省博物馆。","im":"images/ep03_08.jpg","it":"唐长沙窑青釉褐彩贴花执壶_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/6c224f4a20a446239a4e38ef9822720e0df3d7b3?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"人物龙凤帛画","e":"战国","p":"湖南省博物馆","b":"1949年长沙陈家大山楚墓出土，绘一女子侧立、龙凤引导升天，是迄今最早的人物画之一，弥足珍贵。","f":"1949年出土于长沙陈家大山楚墓；长31厘米、宽22.5厘米；帛画绘墓主妇人、龙、凤；战国中晚期；现藏湖南省博物馆。","im":"images/ep03_09.jpg","it":"人物龙凤帛画 | 古人豁达的生死观 - 知乎","gp":"https://pica.zhimg.com/v2-ca5814e5c9264cc6aae913ec342b4fa0_1440w.jpg"},{"n":"人物御龙帛画","e":"战国","p":"湖南省博物馆","b":"1973年长沙子弹库楚墓出土，绘男子驾龙舟升仙，与人物龙凤帛画并称战国帛画双璧，线条流畅。","f":"1973年出土于长沙子弹库楚墓；长37.5厘米、宽28厘米；帛画绘墓主乘龙船；战国中晚期；现藏湖南省博物馆。","im":"images/ep03_10.jpg","it":"人物御龙图_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/63d0f703918fa0ec7d1dff6c2a9759ee3c6ddbfd?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"楚帛书","e":"战国","p":"湖南省博物馆（部分已归国）","b":"长沙子弹库楚墓出土的战国帛书，书写创世神话与月令禁忌，1942年流出，部分已于2025年自美国返还中国。","f":"出自长沙子弹库楚墓（1942年盗掘流出）；战国帛书，分甲（旋转宫）、乙（四时）、丙（月忌）三篇；长期藏于美国，2025年5月16日第二、三卷（五行令、攻守占）由美国国立亚洲艺术博物馆返还中国，第一卷仍在美国；现部分归国、部分在美。","im":"images/ep03_11.png","it":"子弹库战国帛书正式入藏湖南省博物馆 _光明网","gp":"https://imgpolitics.gmw.cn/attachement/png/site2/20251013/f44d305ea48e2a56ad3351.png"},{"n":"神兽纹玉樽","e":"东汉","p":"湖南省博物馆","b":"1991年安乡西晋刘弘墓出土的玉樽，以神兽纹为饰，是罕见的高等级玉质酒器，列入禁止出境展览名录。","f":"1991年出土于湖南安乡县西晋刘弘墓；高10.5厘米、口径6.7厘米；玉质，腹部饰神兽纹、仙人，带兽首形鋬；东汉；现藏湖南省博物馆，2002年列入禁止出境展览文物。","im":"images/ep03_12.jpg","it":"汉代玉器除了金缕玉衣还有些啥？去良渚博物院看一看_古代艺术_澎湃新闻-The Paper","gp":"https://imagecloud.thepaper.cn/thepaper/image/334/105/153.jpg"},{"n":"唐摹兰亭序黄绢本","e":"唐（摹本）","p":"湖南省博物馆","b":"1952年入藏的唐摹《兰亭序》黄绢本，较\"神龙本\"更接近原作，其流传与唐太宗昭陵陪葬《兰亭》真迹相关。","f":"1952年由湖南省文管会收购入藏；唐摹本，写于黄绢，纵24.5厘米、横65.6厘米；传为最接近王羲之原迹的摹本之一；真迹据载随唐太宗陪葬昭陵；现藏湖南省博物馆。","im":"images/ep03_13.jpg","it":"唐摹“天下第一行书”《兰亭序》——湖南省博物馆必看的艺术珍品_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/55e736d12f2eb9389b50159cc52c9235e5dde711c105?x-bce-process=image/format,f_auto"},{"n":"皿方罍","e":"商晚期","p":"湖南省博物馆","b":"1919年湖南桃源出土的商代青铜罍，器身曾流失海外，2014年器身与器盖终于合体，现为湖南博物院镇馆重器。","f":"1919年出土于湖南桃源县漆家河；通高约88厘米；商代晚期；器盖1919年留国内、器身一度流散海外，2014年皿方罍器身回国与盖合体；现藏湖南省博物馆。","im":"images/ep03_14.jpg","it":"湖南省博物馆（湖南省长沙市境内国家一级博物馆）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/d043ad4bd11373f08202b4a743565cfbfbedab64aecb?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,w_330"}]},{"no":"04","t":"浙江省博物馆（之江馆）","loc":"浙江杭州","it":[{"n":"越王州句剑","e":"战国","p":"浙江省博物馆（之江馆）","b":"战国越王州句（朱勾）之剑，剑身鸟虫书铭文，2002年征集入藏，与越王勾践剑并称越国青铜剑双绝。","f":"战国越王州句（朱勾，勾践曾孙）剑；剑身鸟虫书铭\"越王州句自作用剑\"；2002年由浙江省博物馆征集入藏（非1995年香港发现）；现藏浙江省博物馆。","im":"images/ep04_00.jpg","it":"越王州句复合剑_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/7d989310310b0f12203f2e52?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"伎乐铜屋","e":"春秋","p":"浙江省博物馆（之江馆）","b":"1982年绍兴坡塘出土的先秦青铜房屋模型，内立六名裸身乐师奏乐，是唯一的先秦青铜建筑模型。","f":"1982年出土于浙江绍兴坡塘（306号墓）；通高17厘米、面宽13厘米、进深11.5厘米；铜屋内有6名裸身乐师，分持乐器；唯一先秦青铜房屋模型；现藏浙江省博物馆。","im":"images/ep04_01.jpg","it":"浙江省博物馆（浙江杭州综合性博物馆）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/43a7d933c895d143ad4b62736ca895025aafa40fa911?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_352"},{"n":"彩凤鸣岐七弦琴","e":"唐","p":"浙江省博物馆（之江馆）","b":"唐代雷威所斫\"彩凤鸣岐\"七弦琴，音色绝佳，1953年入藏浙博，是唐琴中的名器，承传有绪。","f":"唐开元二年（714年）由蜀地斫琴名家雷威所制；琴长124.8厘米；\"彩凤鸣岐\"款；1953年由徐桴（浙江镇海人）家属捐献入藏浙江省博物馆；现藏浙江省博物馆。","im":"images/ep04_02.jpg","it":"唐彩凤鸣岐七弦琴_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/dc854fda6824e2bab7fd48f6?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"鎏金纯银阿育王塔","e":"五代（吴越）","p":"浙江省博物馆（之江馆）","b":"2001年杭州雷峰塔地宫出土，纯银鎏金、四面镂刻佛本生故事，内藏佛螺髻发金棺尚未开启。","f":"2001年出土于杭州雷峰塔（吴越国）地宫；通高35.6厘米、底座边长约22.6厘米；纯银鎏金，塔身镂刻佛传故事；塔内供奉佛螺髻发金棺（未开启）；五代吴越国；现藏浙江省博物馆。","im":"images/ep04_03.jpg","it":"五代十国吴越国鎏金纯银阿育王塔_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/728da9773912b31bb0514168b154217adab44aed4b17?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"鎏金铜释迦牟尼说法像","e":"五代（吴越）","p":"浙江省博物馆（之江馆）","b":"2001年雷峰塔地宫出土，通体鎏金、佛座下压盘龙，是吴越国金铜造像精品，工艺精湛。","f":"2001年出土于杭州雷峰塔地宫；通高约68厘米；鎏金铜释迦牟尼说法像，佛座下为盘龙柱；五代吴越国；现藏浙江省博物馆。","im":"images/ep04_04.jpg","it":"文物鎏金铜释迦牟尼佛说法像高清图片下载_红动中国","gp":"https://img.redocn.com/sheying/20170329/wenwujintongshimounifoshuofaxiang_8020893.jpg"},{"n":"彩塑泥菩萨立像","e":"北宋","p":"浙江省博物馆（之江馆）","b":"1965年温州白象塔出土的北宋彩塑菩萨，姿态优美、神态温润，被誉为\"东方维纳斯\"。","f":"1965年出土于浙江温州白象塔（拆除时清理）；高约64厘米；北宋彩绘泥塑，保存完好；被誉为\"东方维纳斯\"；现藏浙江省博物馆。","im":"images/ep04_05.jpg","it":"工艺精湛","gp":"https://www.museum24h.com/bxt/images/fo-3.jpg"},{"n":"剩山图（富春山居图局部）","e":"元","p":"浙江省博物馆（之江馆）","b":"黄公望《富春山居图》前段，清初焚画断为两截，此残卷1956年入藏浙博，后段《无用师卷》藏台北。","f":"元黄公望作《富春山居图》；清初遭火殉断为两段，前段\"剩山图\"、后段\"无用师卷\"；剩山图纵31.8厘米、横51.4厘米；1956年入藏浙江省博物馆；后段藏台北故宫；现藏浙江省博物馆。","im":"images/ep04_06.jpg","it":"《富春山居图·剩山图》在浙江省博物馆之江馆区展出 _ 杭州政协网","gp":"https://www.hzzx.gov.cn/cshz/images/2024-08/30/5437ddd1-acb7-4207-9b7a-6d5353b300ea.jpg"},{"n":"龙泉窑舟形青瓷砚滴","e":"元","p":"浙江省博物馆（之江馆）","b":"1954年龙泉少年发现的舟形砚滴，船舱人物、仓篷俱全，是龙泉青瓷文房雅器的杰作，灵动如生。","f":"1954年由浙江龙泉上严儿村少年何招弟在河边发现；长16.2厘米、宽6.5厘米、高9.1厘米；龙泉窑舟形砚滴，船舷刻纹、舱内塑人物；元代；现藏浙江省博物馆。","im":"images/ep04_07.jpg","it":"元龙泉窑舟形砚滴_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/77c6a7efce1b9d1620361ec9f3deb48f8d5464a1?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"万工轿","e":"清末民初","p":"浙江省博物馆（之江馆）","b":"清末民初宁波朱金木雕花轿，以耗费万工得名\"万工轿\"，富丽繁复，是浙东婚俗与木雕工艺的极致。","f":"清末民初浙江宁波朱金木雕花轿；高约275厘米、宽90厘米、深约150厘米；人称\"万工轿\"\"八抬大轿\"；繁复朱金木雕；现藏浙江省博物馆。","im":"images/ep04_08.jpg","it":"浙江省博物馆十大“镇馆之宝”——从河姆渡到民国的浙地留影_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/d1a20cf431adcbef76090361bee139dda3cc7cd9310c?x-bce-process=image/format,f_auto"},{"n":"双鸟朝阳纹象牙碟形器","e":"新石器·河姆渡文化","p":"浙江省博物馆（之江馆）","b":"1977年河姆渡遗址出土的象牙雕刻，正面双鸟拱卫太阳，是六七千年前先民太阳崇拜的物证。","f":"1977年出土于浙江余姚河姆渡遗址（第四文化层）；长16.6厘米、宽5.9厘米、厚1.2厘米；象牙雕，正面刻双鸟朝阳纹；河姆渡文化，距今约7000年；现藏浙江省博物馆。","im":"images/ep04_09.jpg","it":"双鸟朝阳纹象牙碟形器_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/d833c895d143ad4bd1138a7f58554dafa40f4bfba84e?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_616"},{"n":"朱漆碗","e":"新石器·河姆渡文化","p":"浙江省博物馆（之江馆）","b":"1977年河姆渡遗址出土的木胎漆碗，髹朱漆，是迄今已知最早的漆器之一，改写漆艺史。","f":"1977年出土于浙江余姚河姆渡遗址；口径10.6×9.2厘米、高5.7厘米；木胎，外壁涂天然生漆（掺朱砂）呈暗红色；河姆渡文化，距今约7000年；现藏浙江省博物馆。","im":"images/ep04_10.jpg","it":"浙江省博物馆（浙江杭州综合性博物馆）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/11385343fbf2b21193138070d1d872380cd7912320cf?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_294"},{"n":"猪纹陶钵","e":"新石器·河姆渡文化","p":"浙江省博物馆（之江馆）","b":"1977年河姆渡遗址出土的夹炭黑陶钵，外壁刻划猪纹，是家畜驯养与原始艺术的实证。","f":"1977年出土于浙江余姚河姆渡遗址；高11.7厘米、口径21.7×17.5厘米；夹炭黑陶，外壁刻划猪纹（长吻、鬃毛）；河姆渡文化；现藏浙江省博物馆。","im":"images/ep04_11.jpg","it":"河姆渡“烟火气”文物京城首展_信息提示_首都之窗_北京市人民政府门户网站","gp":"https://www.beijing.gov.cn/fuwu/bmfw/sy/jrts/202311/W020231108350553631142.jpg"},{"n":"玉琮王","e":"新石器·良渚文化","p":"浙江省博物馆（之江馆）","b":"1986年余杭反山12号墓出土的玉琮王，体大纹精、号称\"琮王\"，是良渚神权与王权的象征。","f":"1986年出土于浙江余杭反山12号墓（M12）；高8.8厘米、射径17.1—17.6厘米、重约6500克；四面直槽刻神人兽面纹，单节刻纹线宽最细约0.1—0.2毫米（每毫米刻5—6根线）；良渚文化；现藏浙江省博物馆，禁止出境。","im":"images/ep04_12.jpg","it":"瞭望丨解码良渚玉琮王-新华网","gp":"https://www.zj.news.cn/20251112/9d170642c5794d7e85e533d0fe87a9f2/202511129d170642c5794d7e85e533d0fe87a9f2_2ff1c7b216e441cb88ef5ffdd1aa9661.jpg"}]},{"no":"05","t":"广东省博物馆","loc":"广东广州","it":[{"n":"信宜铜盉","e":"西周","p":"广东省博物馆","b":"1974年广东信宜出土的西周青铜礼器，是广东地区发现的第一件西周铜器，造型为盉，见证岭南早期青铜文明。","f":"年代西周；1974年出土于广东茂名信宜；广东首件西周青铜器；盛酒/水器；现藏广东省博物馆。","im":"images/ep05_00.jpg","it":"广东省博物馆（广东省广州市国家一级博物馆）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/aa18972bd40735fadbd9e5ba99510fb30f240883?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_331"},{"n":"鎏金腰带","e":"南宋","p":"广东省博物馆","b":"出自南宋沉船南海一号，呈阿拉伯(伊斯兰)风格的金腰带，长逾1.7米、重566克，是海上丝路贸易的珍贵物证。","f":"南宋；南海一号沉船出水；长1.72米、重566克；阿拉伯风格金腰带；现藏广东省博物馆。","im":"images/ep05_01.jpg","it":"广东海上丝绸之路博物馆","gp":"https://www.msrmuseum.com/upfiles/image/20180420/6365984003500792989916087.jpg"},{"n":"南海一号沉船","e":"南宋","p":"广东省博物馆（出水文物）","b":"南宋远洋商贸沉船，1987年发现于阳江海域，船载文物极丰，整体打捞后成为海上丝绸之路考古的重大发现。","f":"南宋沉船；1987年发现于广东阳江南海海域；2007年整体打捞；出水文物约18万件(套)，其中瓷器约1 青铜鸮形酒尊，造型威猛，是已知最早的鸟形铜尊之一。","f":"商代晚期(殷墟二期)；1976年安阳殷墟妇好墓出土；通高46.3厘米、重16公斤；鸟形(鸮/猫头鹰)酒尊；一对(另一藏国博)；现藏河南博物院。","im":"images/ep08_02.jpg","it":"妇好鸮尊 - 河南博物院","gp":"https://www.chnmus.net/webfile/images/attachement/jpg/site2/20130917/24be050d2bed13a25e0503.jpg"},{"n":"父乙角","e":"西周早期","p":"河南博物院","b":"1986年信阳出土的西周青铜角，通体黑亮如漆，形体硕大为角中少见，号称\"角王\"。","f":"西周早期；1986年河南信阳浉河港出土；青铜酒器(角)；通高约29厘米；黑漆古状；铭文\"晨肇贮用作父乙宝尊彝\"；现藏河南博物院。","im":"images/ep08_03.jpg","it":"河南博物院","gp":"http://www.chnmus.net/images/201811/20/af6fb50b-74ab-46f8-b213-2dc5150f620b.jpg"},{"n":"匍雁铜盉","e":"西周","p":"河南博物院","b":"1988年平顶山应国墓地出土的西周雁形铜盉，盖内有44字铭文，记录一场诸侯邦交佳话。","f":"西周；1988年河南平顶山应国墓地M50出土；雁形(鸭形)盉；通高25.2厘米；盖内铭文5行44字(应国使者匍使邢)；现藏河南博物院。","im":"images/ep08_04.jpg","it":"“匍”雁形铜盉","gp":"http://www.chnmus.net/sitesources/20201214161549145.jpg"},{"n":"七璜连珠组玉佩","e":"西周晚期","p":"河南博物院","b":"1991年三门峡虢国国君虢季墓出土的大型组玉佩，七璜连珠、璀璨华美，彰显诸侯身份。","f":"西周晚期；1991年河南三门峡虢国墓地M2001虢季墓出土；由七件玉璜与玛瑙、琉璃珠连缀；通长约87厘米(一说126厘米)；现藏河南博物院。","im":"images/ep08_05.jpg","it":"七璜联珠组玉佩 - 河南博物院","gp":"https://www.chnmus.net/webfile/images/attachement/jpg/site2/20120120/2c4138aa3db6108301c801.jpg"},{"n":"玉柄铁剑","e":"西周晚期","p":"河南博物院","b":"1990年虢国墓地出土，以玉、铜、铁复合制成，是中国最早的人工冶铁制品，被誉为\"中华第一剑\"。","f":"西周晚期；1990年河南三门峡虢国墓地M2001虢季墓出土；玉柄、铜芯、铁身；块炼渗碳钢；将中国人工冶铁史提前约两世纪；现藏河南博物院。","im":"images/ep08_06.jpg","it":"东西问｜虢国玉柄铁剑为何可视为\"中华第一剑\"? - 文化旅游 -中新网河南新闻","gp":"https://www.ha.chinanews.com/2024/0117/U869P948DT20240117100820.jpg"},{"n":"青玉人首蛇身饰","e":"春秋","p":"河南博物院","b":"1983年光山黄君孟墓出土的一对青玉饰，人首蛇身、构思奇巧，或即伏羲女娲形象的雏形。","f":"春秋早期；1983年河南光山黄君孟夫妇墓出土；一对青玉人首蛇身环形饰；外径3.8厘米；疑伏羲女娲题材；现藏河南博物院。","im":"images/ep08_07.jpg","it":"青玉人首蛇身饰 - 河南博物院","gp":"https://www.chnmus.net/webfile/images/attachement/jpg/site2/20121129/2c4138aa3db6122104e401.jpg"},{"n":"莲鹤方壶","e":"春秋","p":"河南博物院","b":"1923年新郑郑公大墓出土的一对春秋青铜壶，盖顶莲瓣中立鹤欲飞，郭沫若誉之为\"时代精神之象征\"。","f":"春秋；1923年河南新郑李家楼郑公大墓出土；通高117厘米；莲瓣立鹤盖；一对(分藏河南博物院与北京故宫)；现藏河南博物院。","im":"images/ep08_08.jpg","it":"莲鹤方壶春秋化妆镜 - 河南博物院","gp":"https://www.chnmus.net/sitesources/20200709153704805.jpg"},{"n":"辉县琉璃阁铜禁","e":"春秋晚期","p":"河南博物院","b":"河南博物院镇院之宝中的青铜\"禁\"即云纹铜禁，所谓\"辉县琉璃阁铜禁\"疑为与云纹铜禁相混的转录。","f":"河南博物院所藏铜禁类重器为\"云纹铜禁\"(1978年淅川下寺2号楚墓出土，春秋)；辉县琉璃阁甲乙墓(1936年)出大量青铜礼器，但无以\"铜禁\"著称者；现藏河南博物院。","im":"images/ep08_09.jpg","it":"兽面纹铜罍 - 河南博物院","gp":"https://www.chnmus.net/images/attachement/jpg/site2/20120614/2c4138aa3db6114388290c.jpg"},{"n":"云纹铜禁","e":"春秋","p":"河南博物院","b":"1978年淅川下寺楚墓出土的春秋铜禁，以失蜡法铸成，是中国最早的失蜡法铸件之一，为禁酒之器。","f":"春秋晚期；1978年河南淅川下寺2号楚墓(王子午墓)出土；失蜡法铸造；通长131厘米、重94.2公斤；周人禁酒象征；现藏河南博物院。","im":"images/ep08_10.jpg","it":"河南博物院镇馆之宝｜春秋.云纹铜禁","gp":"https://n.sinaimg.cn/sinakd20123/473/w1073h1000/20230325/1ab0-85e0737db29add0ea9b77063d71d8001.jpg"},{"n":"青铜神兽","e":"春秋","p":"河南博物院","b":"1990年淅川徐家岭楚墓出土的诡谲青铜神兽，龙首虎身、满嵌绿松石，用途或为乐器支架。","f":"春秋晚期；1990年河南淅川徐家岭9号楚墓出土；龙首、虎身、龟足、豹尾；通身嵌绿松石；一对(另一藏省考古院)；现藏河南博物院。","im":"images/ep08_11.jpg","it":"青铜神兽 - 河南博物院","gp":"https://www.chnmus.net/webfile/images/attachement/jpg/site2/20130104/2c4138aa3db612508f5001.jpg"},{"n":"跽坐红铜龙纹方豆","e":"春秋","p":"河南博物院","b":"1978年固始侯古堆出土的春秋青铜方豆，通体铸镶红铜龙纹，精美异常，墓主或涉吴国贵族。","f":"春秋；1978年河南固始侯古堆1号墓(传吴王夫差夫人墓)出土；青铜方豆；器表铸镶(嵌)红铜龙纹；现藏河南博物院。","im":"images/ep08_12.png","it":"铸镶红铜龙纹方豆 - 河南博物院","gp":"https://www.chnmus.net/images/attachement/png/site2/20141128/24be050d2bed15e274cf05.png"},{"n":"四神云气壁画","e":"西汉","p":"河南博物院","b":"1987年永城芒砀山柿园汉墓揭取的西汉墓室壁画，绘青龙白虎朱雀怪兽，被誉为\"敦煌前之敦煌\"。","f":"西汉早期；1987年发现、1993年揭取于河南永城芒砀山柿园汉墓(梁共王刘买)；长5.14米、宽3.27米；青龙白虎朱雀怪兽云气；现藏河南博物院。","im":"images/ep08_13.jpg","it":"Q版插画——明星文物 - 河南博物院","gp":"https://www.chnmus.net/webfile/ch_assets/images/cultural/Q版插画-明星文物/big/四神云气图壁画-西汉.png"},{"n":"七层彩绘连阁陶楼","e":"东汉","p":"河南博物院","b":"1993年焦作汉墓出土的东汉陶楼明器，主楼七层连阁道，是汉代建筑技艺的生动模型。","f":"东汉；1993年河南焦作白庄6号汉墓出土；七层主楼+四层附楼+阁道；通高约192厘米；由31件构件组成；现藏河南博物院。","im":"images/ep08_14.jpg","it":"七层彩绘连阁陶仓楼 - 河南博物院","gp":"https://www.chnmus.net/webfile/images/attachement/jpg/site2/20120206/2c4138aa3db61099c59401.jpg"},{"n":"袁安碑","e":"东汉","p":"河南博物院","b":"1929年偃师发现的东汉篆书碑刻，记司徒袁安生平，字口如新，是汉代小篆书法的杰作。","f":"东汉(永元四年前后立)；1929年河南偃师辛家村发现；全称\"汉司徒袁安碑\"；篆书10行存139字；碑穿居中(汉碑仅见)；现藏河南博物院。","im":"images/ep08_15.jpg","it":"袁安碑 - 河南博物院","gp":"https://www.chnmus.net/images/attachement/jpg/site2/20120328/2c4138aa3db610dca3e407.jpg"},{"n":"武则天金简","e":"武周","p":"河南博物院","b":"1982年嵩山石缝中发现的武则天投简，金质錾文63字，是国内唯一可移动的武则天实物。","f":"武周(公元700年)；1982年河南登封农民于嵩山峻极峰石缝发现；金质、长36.2厘米、重223.5克；双钩楷书63字；投龙简(山简)；现藏河南博物院。","im":"images/ep08_16.png","it":"武则天金简- 河南博物院(试运行)","gp":"https://www.chnmus.net/webfile/ch_assets/images/collection/details/treasure-6-wu-zhao-jin-jian.png"},{"n":"汝窑天蓝釉刻花鹅颈瓶","e":"北宋","p":"河南博物院","b":"1987年宝丰清凉寺汝窑址出土的天蓝釉刻花鹅颈瓶，是现存唯一经科学发掘的完整天蓝釉汝瓷。","f":"北宋晚期；1987年河南宝丰清凉寺汝官窑遗址出土；天蓝釉、腹部刻花叶纹；高19.5厘米；唯一科学发掘所得完整天蓝釉汝瓷、且为唯一刻花者；现藏河南博物院。","im":"images/ep08_17.jpg","it":"汝窑天蓝釉刻花鹅颈瓶- 河南博物院","gp":"https://www.chnmus.net/images/attachement/jpg/site2/20151105/24be050d2bed17a54e5303.jpg"}]},{"no":"09","t":"湖北省博物馆","loc":"湖北武汉","it":[{"n":"郧县人头骨化石","e":"旧石器","p":"湖北省博物馆","b":"100万年前的直立人头颅骨，年代比北京猿人还早，是研究人类起源与中国境内早期人类演化的关键标本。","f":"旧石器时代；距今约100万年；直立人；1975年发现于湖北郧县（今十堰郧阳区）曲远河口；早于北京人。","im":"images/ep09_00.jpg","it":"距今百万年“郧县人”头骨化石科学相貌复原首次揭晓-新华网","gp":"http://www.hb.xinhuanet.com/20241226/49496745ba9f4ef18d64bf49fe7cabb9/2024122649496745ba9f4ef18d64bf49fe7cabb9_20241226834efa0f0a7c485d9ae0be7ec359c102.jpg"},{"n":"石家河玉人像","e":"新石器","p":"湖北省博物馆","b":"4200年前石家河文化的玉雕人像，橄榄形眼、蒜头鼻，造型神秘，和三星堆青铜人像神韵惊人相似。","f":"新石器时代石家河文化；距今约4200年；出土于湖北天门石家河遗址；玉质人像，橄榄眼、蒜头鼻；现藏湖北省博物馆。","im":"images/ep09_01.jpg","it":"荆楚瑰宝：湖北省十大镇馆之宝 -湖北省民族宗教事务委员会","gp":"https://mzw.hubei.gov.cn/ztzl/jcfy/jcxm/202501/W020250115511703738796.jpg"},{"n":"崇阳铜鼓","e":"商","p":"湖北省博物馆","b":"商代青铜鼓，1977年湖北崇阳出土，是迄今罕见的商代铜鼓实物，国内仅此一件，另一件在日本。","f":"商代；1977年出土于湖北崇阳；青铜礼乐器；国内现存唯一商代铜鼓；另一件传世品藏于日本。","im":"images/ep09_02.jpg","it":"文旅新探｜湖北省博物馆：1.6万件文物勾勒荆楚文脉 - 新华网客户端","gp":"https://xhsc.app.xinhuanet.com/cms/article/image/71d171434b4545b9b3dd55cd43095d17.JPG"},{"n":"越王勾践剑","e":"春秋","p":"湖北省博物馆","b":"1965年江陵望山楚墓出土的青铜剑，剑身鸟虫书\"鸠浅\"即勾践之名，千年不锈，铸造防锈工艺至今成谜。","f":"春秋晚期；1965年出土于湖北江陵望山一号墓；剑身鸟虫篆铭文\"越王鸠浅自作用剑\"；\"鸠浅\"即勾践；防锈工艺未完全破解。","im":"images/ep09_03.jpg","it":"湖北省博物馆有四大镇馆之宝，你见过了几件？_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/267f9e2f070828381f30fe0151d0be014c086e065bc6"},{"n":"曾侯乙编钟","e":"战国","p":"湖北省博物馆","b":"1978年随州擂鼓墩曾侯乙墓出土的65件青铜编钟，一钟双音，音域宽广，是先秦礼乐文明的巅峰之作。","f":"战国早期；1978年出土于湖北随州擂鼓墩曾侯乙墓；共65件钟；一钟双音；改写了中国音乐史。","im":"images/ep09_04.jpg","it":"曾侯乙编钟，湖北省博物馆的镇馆之宝……|曾侯乙编钟|湖北省博物馆|楚国_新浪新闻","gp":"http://n.sinaimg.cn/sinakd20230221ac/125/w690h1035/20230221/c0e7-7a8151de1f0ea975ec9f73b4cd75be36.jpg"},{"n":"曾侯乙尊盘","e":"春秋战国","p":"湖北省博物馆","b":"战国早期青铜酒器，由尊和盘组成，满布镂空蟠螭纹，用失蜡法铸造，工艺极繁复，至今难以完美复制。","f":"战国早期（约公元前433年）；曾侯乙墓出土；失蜡法铸造；透空蟠螭纹装饰；青铜尊与盘组合；工艺极复杂。","im":"images/ep09_05.png","it":"中国文物报-2025-12-04-22082版-曾侯乙尊盘三维数字化复原","gp":"http://www.zhongguowenwubao.com/data/upload/ueditor/20251208/69363dfab227b.png"},{"n":"彩绘人物车马出行图","e":"战国","p":"湖北省博物馆","b":"绘在漆奁外壁的战国漆画，展开像长卷，描绘车马出行、宴乐等场景，被认为是最早的\"长卷连环画\"。","f":"战国中晚期；1987年出土于湖北荆门包山楚墓；绘于漆奁外壁；展开为长卷；表现车马出行、迎宾、宴乐；被认为是最早的\"画\"。","im":"images/ep09_06.jpg","it":"车马人物出行图_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/4afbfbedab64034fe98a974cabc379310a551d30?x-bce-process=image/resize,m_lfit,w_536,limit_1/format,f_jpg"},{"n":"虎座鸟架鼓","e":"战国","p":"湖北省博物馆","b":"楚式漆木乐器，两只卧虎为座、双鸟为架撑起一面鼓，造型浪漫，是楚国浪漫主义的代表器物。","f":"战国；2002年出土于湖北枣阳九连墩楚墓；漆木器；虎座、鸟架、悬鼓组合；楚文化典型器物。","im":"images/ep09_07.jpg","it":"湖北省博物馆新馆开馆【11】--图片频道--人民网","gp":"http://pic.people.com.cn/NMediaFile/2021/1221/MAIN202112211452000187092309361.JPG"},{"n":"云梦睡虎地秦简","e":"秦","p":"湖北省博物馆","b":"1975年云梦睡虎地秦墓出土的大量秦代竹简，由基层小吏\"喜\"抄录，是现存最早最完整的秦代法典。","f":"秦代；1975年出土于湖北云梦睡虎地十一号墓；墓主为小吏\"喜\"；含《秦律十八种》等；现存最早最完整的秦代法律文献。","im":"images/ep09_08.jpg","it":"集中亮相！湖北省博“晒”出我国首次出土的秦简【5】--图片频道--人民网","gp":"http://pic.people.com.cn/NMediaFile/2024/0501/MAIN17145270822747F156Y67IS.jpeg"},{"n":"元青花四爱图梅瓶","e":"元","p":"湖北省博物馆","b":"元代青花梅瓶，瓶身绘王羲之爱兰等\"四爱图\"，2006年钟祥明墓出土，是元青花中的珍品。","f":"元代；青花瓷；2006年出土于湖北钟祥；通体青花，腹部绘\"四爱图\"（王羲之爱兰、陶渊明爱菊等）。","im":"images/ep09_09.jpg","it":"元青花四爱图梅瓶（湖北省博物馆馆藏文物）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/7dd98d1001e93901213fb1f221bd43e736d12e2e38e4?x-bce-process=image/resize,m_lfit,w_440,limit_1"}]},{"no":"10","t":"上海博物馆","loc":"上海","it":[{"n":"玉神人","e":"新石器","p":"上海博物馆","b":"石家河文化玉雕神人像，橄榄形眼、蒜头鼻、獠牙，神情诡谲，是史前玉雕人神的巅峰之作。","f":"新石器时代石家河文化；玉质人像；橄榄形眼、蒜头鼻、獠牙；1989年征集；现藏上海博物馆。","im":"images/ep10_00.jpg","it":"上海博物馆十大镇馆之宝，你知道几个？每一件都是国之重器_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/314e251f95cad1c8a78654757c707009c93d70cffb19?x-bce-process=image/format,f_auto"},{"n":"大克鼎","e":"西周","p":"上海博物馆","b":"西周孝王时期青铜重器，内壁290字铭文记录贵族克受赏事迹，1951年潘达于家族捐献，海内三宝之一。","f":"西周中期（孝王）；1890年陕西扶风出土；内壁290字铭文；记\"克\"受周王官职与赏赐；1951年潘达于捐赠；与大盂鼎、毛公鼎并称。","im":"images/ep10_01.jpg","it":"大克鼎——每月一珍 上海博物馆","gp":"http://www.shanghaimuseum.net/resource/museum_files/show_files/20151104094055028/images/t1-1.jpg"},{"n":"晋侯苏钟","e":"西周","p":"上海博物馆","b":"西周晋侯墓出土的青铜编钟，马承源从香港以百万港币购回，曾被疑为赝品，铭文记晋侯苏随周王出征。","f":"西周晚期；出土于山西曲村晋侯墓地；共16件；铭文记晋侯苏随周王征战；马承源自香港购回；曾受真伪争议。","im":"images/ep10_02.jpg","it":"晋侯稣钟——每月一珍 上海博物馆","gp":"https://www.shanghaimuseum.net/mu/asset2/20151230150415016/images/t18_3.jpg"},{"n":"鄂叔簋","e":"西周","p":"上海博物馆","b":"西周青铜簋，上海冶炼厂废铜中抢救出来的，器底还挂着个小铜铃，摇起来至今仍能响。","f":"西周；上海冶炼厂废杂铜中抢救征集；青铜簋；器底附有可摇响的小铜铃；现藏上海博物馆。","im":"images/ep10_03.jpg","it":"西周鄂叔簋_百度百科","gp":"http://baike.baidu.com/cms/s/museum/v2/uploads/14上海青铜抠图-原图.png"},{"n":"颂簋","e":"西周","p":"上海博物馆","b":"西周青铜簋，腹内铭文记录颂受周王册命，上博此器多称\"史颂簋\"，来源记载有出入。","f":"西周（宣王）；青铜簋；腹内铭文记\"颂\"受册命；上海博物馆藏；一般称\"史颂簋\"。","im":"images/ep10_04.jpg","it":"史颂簋_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/b6045da93328f6dd1e17a215?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_1000"},{"n":"子仲姜盘","e":"春秋","p":"上海博物馆","b":"春秋青铜盥洗盘，盘里雕着立体水禽鱼龟，注水后小动物能原地转动，是青铜器里的\"黑科技\"。","f":"春秋中期；青铜水器；盘内浮雕立鸟、鱼、龟等动物，注水后可转动；叶肇夫捐赠；现藏上海博物馆。","im":"images/ep10_05.jpg","it":"上海博物馆 - 维基百科，自由的百科全书","gp":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Shanghai_East_Museum_-_54129149186.jpg/960px-Shanghai_East_Museum_-_54129149186.jpg"},{"n":"浑源牺尊","e":"春秋","p":"上海博物馆","b":"春秋牛形青铜温酒器，牛腹中空可盛酒，背上开盖，造型憨拙生动，1923年山西浑源出土。","f":"春秋晚期；1923年出土于山西浑源李峪村；牛形青铜盛酒/温酒器；浑源彝器之一；现藏上海博物馆。","im":"images/ep10_06.jpg","it":"牺尊——每月一珍 上海博物馆","gp":"https://www.shanghaimuseum.net/resource/museum_files/show_files/20150818125736844/images/pic7.jpg"},{"n":"兽面纹尊","e":"商晚期","p":"上海博物馆","b":"商代晚期青铜尊，通体兽面纹，是海关从文物走私者手中查获追缴回国的重器。","f":"商代晚期；青铜尊；通体兽面纹（饕餮纹）；系海关查获走私文物后追缴；现藏上海博物馆。","im":"images/ep10_07.jpg","it":"上海博物馆（综合性博物馆）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/6d81800a19d8bc3e2de63816848ba61ea9d3457b?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_301"},{"n":"吴王夫差盉","e":"春秋晚期","p":"上海博物馆","b":"春秋吴王夫差自用的青铜盉，器上有铭文，为谁定制有三种说法，何鸿章家族捐回上博。","f":"春秋晚期；青铜盉；器铭\"吴王夫差\"；相传为吴王夫差嫁女之器，定制对象有三说；何鸿章家族捐赠；现藏上海博物馆。","im":"images/ep10_08.jpg","it":"春节“龙出没”！在上海来一场穿梭时光的寻龙记→_澎湃号·政务_澎湃新闻-The Paper","gp":"https://imagepphcloud.thepaper.cn/pph/image/291/570/321.jpg"},{"n":"商鞅方升","e":"战国","p":"上海博物馆","b":"战国商鞅变法时制造的铜量器，是秦国统一度量衡的标准器，上刻商鞅变法铭文，后由龚氏家族捐出。","f":"战国时期（秦孝公）；青铜量器；商鞅变法时颁行；侧壁刻铭文记载量制；标准度量衡器；龚心钊后人捐赠；现藏上海博物馆。","im":"images/ep10_09.jpg","it":"商鞅方升——每月一珍 上海博物馆","gp":"https://www.shanghaimuseum.net/mu/show/202411/4335e32d-3cce-4602-955b-17ed7e0b9e59/pic/p1_3.jpg"},{"n":"上虞帖","e":"东晋","p":"上海博物馆","b":"王羲之草书唐摹本，因帖中有\"夜来腹痛\"等语又称\"夜来腹痛帖\"，是唐人双钩摹拓的稀世墨宝。","f":"东晋王羲之书，唐代摹本；草书；又称\"夜来腹痛帖\"；唐人双钩廓填墨迹；现藏上海博物馆。","im":"images/ep10_10.jpg","it":"我们的人民城市｜“双子山”散发别样魅力，上博东馆尽显“博物馆热”","gp":"https://imgpai.thepaper.cn/newpai/image/20241031/57c963da-d0ed-4d11-b378-2faa1725db00.jpg"},{"n":"鸭头丸帖","e":"东晋","p":"上海博物馆","b":"王献之名帖，讲鸭头丸药的疗效，是现存著名的王献之书法墨迹（唐摹本），帖上有历代收藏印。","f":"东晋王献之书，唐摹本；草书；内容谈\"鸭头丸\"药效；帖存唐代摹本；现藏上海博物馆。","im":"images/ep10_11.jpg","it":"省级博物馆系列17【上海博物馆】-镇馆之宝及典藏 - 知乎","gp":"https://pic3.zhimg.com/v2-830e62aa3f49b53c504376d6f62ad054_1440w.jpg"},{"n":"苦笋帖","e":"唐","p":"上海博物馆","b":"唐代怀素写的草书帖，短短两行写请人尝苦笋，笔势狂放，是怀素传世稀少的真迹之一。","f":"唐代；怀素书；草书；内容为请尝苦笋、茶；怀素传世墨迹（多认定为真迹）；现藏上海博物馆。","im":"images/ep10_12.jpg","it":"上博东馆书画“国宝展”重磅回归！书画常设展厅正式开放","gp":"https://imagepphcloud.thepaper.cn/pph/image/330/157/227.jpg"},{"n":"高逸图","e":"唐","p":"上海博物馆","b":"唐代孙位画的《竹林七贤图》残卷，仅存山涛、王戎等四人，是罕见的唐人人物画真迹。","f":"唐代；孙位（孙遇）绘；原为《竹林七贤图》残卷，仅存四贤；绢本设色人物画；现藏上海博物馆。","im":"images/ep10_13.jpg","it":"高逸图——每月一珍 上海博物馆","gp":"https://www.shanghaimuseum.net/resource/museum_files/show_files/20170412105551693/images/t26.jpg"},{"n":"越窑青釉海棠式碗","e":"唐","p":"上海博物馆","b":"唐代越窑秘色瓷碗，形如海棠花瓣，釉色青润，传世极罕，被称为海内孤品。","f":"唐代；越窑青瓷；海棠式花口碗；釉色青绿（秘色瓷一类）；传世稀少；现藏上海博物馆。","im":"images/ep10_14.jpg","it":"展览列表页","gp":"https://ggzlimg.dpm.org.cn/share_art_banner/small/app/gugong/2017/0616/1497579431_365296.jpg"},{"n":"钧窑月白釉出戟尊","e":"明","p":"上海博物馆","b":"钧窑月白釉出戟尊，仿青铜尊造型，四面出戟，釉色如月，是钧窑名品（年代有争议）。","f":"钧窑；月白釉；仿青铜尊四面出戟；上海博物馆定为明代（传世\"官钧\"）；学界有北宋/明代之争；现藏上海博物馆。","im":"images/ep10_15.jpg","it":"宋钧窑月白釉出戟尊（上海博物馆藏品）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/35a85edf8db1cb13201b2007d054564e92584bb7?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"白釉镂雕宫殿人物枕","e":"北宋","p":"上海博物馆","b":"北宋定窑白瓷枕，枕面镂雕宫殿人物，雕工极细，是定窑瓷枕中的海内孤品。","f":"北宋；定窑白瓷；镂雕宫殿人物纹；瓷枕；传世稀少；现藏上海博物馆。","im":"images/ep10_16.jpg","it":"上海博物馆十大镇馆之宝，你知道几个？每一件都是国之重器_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/eac4b74543a98226cffcfd7589ccae014a90f603bd19?x-bce-process=image/format,f_auto"},{"n":"行书楞严经","e":"北宋","p":"上海博物馆","b":"北宋王安石亲笔行书《楞严经》残卷，是这位政治家罕见的书法墨迹，后由王南屏家族捐出。","f":"北宋；王安石书；行书《楞严经》卷（残）；王安石传世极少书法之一；王南屏家族捐赠；现藏上海博物馆。","im":"images/ep10_17.jpg","it":"“云赏”上博“盛世芳华”展","gp":"http://www.news.cn/shuhua/20220322/9b2eae7ff7ac4a5ab9d500ea10b4e28e/20220322424e6d91f35348f18f1cd5c7180b2b32_2.jpg"},{"n":"淳化阁帖（祖刻本）","e":"北宋","p":"上海博物馆","b":"北宋《淳化阁帖》最善拓本，中国法帖之祖，2003年上博斥巨资从安思远处购回，堪称镇馆之宝。","f":"北宋《淳化阁帖》祖刻系统善本（最善本）；汇刻历代帝王名臣书；2003年上海博物馆购回；现藏上海博物馆。","im":"images/ep10_18.jpg","it":"现场｜上博宋元古籍特展：刊刻千年，件件珍稀_古代艺术_澎湃新闻-The Paper","gp":"https://imagecloud.thepaper.cn/thepaper/image/252/50/771.jpg"},{"n":"歌乐图卷","e":"南宋","p":"上海博物馆","b":"南宋风俗画长卷，描绘宫廷女乐在庭院排练奏乐的场景，是研究宋代音乐与服饰的生动图像。","f":"南宋；绢本设色长卷；表现宫廷女乐排练奏乐；风俗画；现藏上海博物馆。","im":"images/ep10_19.jpg","it":"宋《歌乐图》（上海博物馆藏） - 知乎","gp":"https://pic1.zhimg.com/v2-d95f0e2923188d0278727be30617de30_r.jpg"},{"n":"莲塘乳鸭图","e":"南宋","p":"上海博物馆","b":"南宋朱克柔的缂丝巨作，以通经断纬织出莲塘游鸭，工艺登峰造极，由庞莱臣后人捐给上博。","f":"南宋；朱克柔缂丝；以\"通经断纬\"技法织成；题材为莲塘乳鸭；庞莱臣旧藏，其后人捐赠；现藏上海博物馆。","im":"images/ep10_20.jpg","it":"缂丝莲塘乳鸭图——上海博物馆·每月一珍","gp":"https://www.shanghaimuseum.net/mu/show/202406/a34bb1f3-4e86-44de-9f5a-b6bc68f83d2f/pic/p14.jpg"},{"n":"雍正粉彩福寿橄榄瓶","e":"清","p":"上海博物馆","b":"清雍正粉彩橄榄瓶，绘蝠桃纹寓意福寿，曾流落海外，2002年张永珍拍回捐给上博。","f":"清代雍正；粉彩；橄榄瓶形；蝠桃纹寓\"福寿\"；海外回流；张永珍捐赠；现藏上海博物馆。","im":"images/ep10_21.jpg","it":"一个小小的“鸡缸杯”，款式和图案都不算复杂，它凭什么值2.8亿？ - 知乎","gp":"https://picx.zhimg.com/v2-b076e8ee33d419a141d24f7cf0e45b57_1440w.jpg"}]},{"no":"11","t":"良渚博物院","loc":"浙江杭州余杭","it":[{"n":"玉琮王","e":"新石器","p":"良渚博物院","b":"反山12号墓出土的玉琮，重6.5公斤，四面刻神人兽面纹，是良渚玉琮中最大最精的\"琮王\"。","f":"新石器时代良渚文化；反山遗址12号墓出土；重约6.5公斤；四面刻神人兽面纹；体量最大、纹饰最精的玉琮；现藏良渚博物院。","im":"images/ep11_00.png","it":"良渚玉琮（浙博）_浙江良渚博物院","gp":"https://museum24h.com/liangzhu/uploads/allimg/151012/1-151012232148.png"},{"n":"玉钺王","e":"新石器","p":"良渚博物院","b":"同出反山12号墓的玉钺，两面都雕神徽和神鸟，是良渚唯一双面满工玉钺，象征军事王权。","f":"新石器时代良渚文化；反山12号墓出土；玉钺；正反两面均刻神人兽面纹与神鸟；象征王权（军权）；现藏良渚博物院。","im":"images/ep11_01.jpg","it":"玉钺-良渚博物院","gp":"https://www.lzmuseum.cn/files/images/安_L1579副本副本201306030144551.jpg"},{"n":"神人兽面纹（神徽）","e":"新石器","p":"良渚博物院","b":"良渚核心图腾\"神徽\"，每毫米刻5到6根细线，5000年前没有金属工具如何刻出至今是谜。","f":"新石器时代良渚文化；神人兽面纹（神徽）；线纹细密，每毫米约5-6根；刻于玉琮等礼器；微刻工艺成因成谜；现藏良渚博物院。","im":"images/ep11_02.png","it":"“千年古城，国之玉器”｜玉见文明-良渚博物院","gp":"https://www.lzmuseum.cn/upload/image/20260310/6390873355064114021510142.png"},{"n":"嵌玉漆杯","e":"新石器","p":"良渚博物院","b":"反山12号墓出土的嵌玉漆器，杯身嵌141颗小玉粒，是良渚漆器与玉器结合工艺的孤例。","f":"新石器时代良渚文化；反山12号墓出土；木胎漆杯嵌玉；嵌玉粒约141颗；漆玉结合工艺罕见；现藏良渚博物院。","im":"images/ep11_03.png","it":"良良与M豆说良渚④丨伐木累不累？良渚先民知道-良渚博物院","gp":"https://www.lzmuseum.cn/upload/image/20240407/6384807808326610989448615.png"},{"n":"鸟立高台玉璧","e":"新石器","p":"良渚博物院","b":"反山23号墓出土的玉璧，上面刻鸟立高台符号，被认为与财富权力有关，刻符让人联想到古埃及王名。","f":"新石器时代良渚文化；反山23号墓出土；玉璧；刻\"鸟立高台\"符号；或与财权/神权相关；现藏良渚博物院。","im":"images/ep11_04.jpg","it":"良渚博物院_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/cb8065380cd7912397ddc535406d4e82b2b7d0a22a62?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_293"},{"n":"玉神鸟","e":"新石器","p":"良渚博物院","b":"良渚玉雕小神鸟，造型简练神气，被认为可能是男性贵族专属佩戴的玉饰。","f":"新石器时代良渚文化；玉鸟形饰；造型简练；或为贵族专属佩饰；现藏良渚博物院。","im":"images/ep11_05.png","it":"国际爱鸟日 | 春归鸟回，五千年羽翼生生不息-良渚博物院","gp":"https://www.lzmuseum.cn/upload/image/20240401/6384758637993800603884434.png"},{"n":"玉牌饰","e":"新石器","p":"良渚博物院","b":"瑶山10号墓出土的良渚玉牌饰，雕神人兽面纹，是良渚贵族身份与信仰的玉质标志物。","f":"新石器时代良渚文化；瑶山遗址10号墓出土；玉牌饰；饰神人兽面纹；现藏良渚博物院。","im":"images/ep11_06.jpg","it":"玉牌饰-良渚博物院","gp":"https://www.lzmuseum.cn/files/images/安_L1812-2-1202副本副本201306030207318.jpg"},{"n":"瑶山祭坛","e":"新石器","p":"良渚博物院","b":"1987年发现的良渚祭坛遗址，方位精准对应冬至夏至，是五千年前的天文与祭祀建筑。","f":"新石器时代良渚文化；1987年发现于浙江余杭瑶山；人工土筑祭坛；方位与冬至、夏至等对应；现属良渚遗址；展示于良渚博物院。","im":"images/ep11_07.jpg","it":"一城山色?千载文明 | 春满瑶山-良渚博物院","gp":"https://www.lzmuseum.cn/upload/image/20260420/6391227566053176922687652.jpg"},{"n":"碳化稻米","e":"新石器","p":"良渚博物院","b":"良渚遗址发现的炭化稻谷堆积，证明当时已有大规模稻作农业，是五千年稻作文明的实证。","f":"新石器时代良渚文化；发现于良渚莫角山等处；炭化稻谷堆积；实证良渚稻作农业规模；现藏良渚博物院。","im":"images/ep11_08.jpg","it":"何以中国·缘起良渚丨探寻：考古研究新突破-新华网","gp":"http://zj.news.cn/20241126/181ab99c3b8f48069e912b45c8b14e86/20241126181ab99c3b8f48069e912b45c8b14e86_2024112685c9ed02707c49d79919efc7cbb1bbf8.jpg"},{"n":"良渚独木舟","e":"新石器","p":"良渚博物院","b":"2010年茅山遗址出土的独木舟，长7.35米，是国内已发现最长最完整的史前独木舟。","f":"新石器时代良渚文化；2010年出土于浙江余杭茅山遗址；通长7.35米；国内已发现最长、最完整的史前独木舟；现藏良渚博物院。","im":"images/ep11_09.jpg","it":"杭州：良渚文化茅山遗址出土的独木舟展出 距今约5000年-人民图片网","gp":"http://vip-public.people.com.cn/photo/2022/6/5/11fddab380bb44c8978d5300a85fb555wskN_s.jpg"},{"n":"良渚古城","e":"新石器","p":"良渚博物院","b":"良渚巨型土筑古城，内城周长六千余米，河网纵横像水上都市，是同时期规模最大的史前城址。","f":"新石器时代良渚文化；浙江余杭；内城周长约6000余米；外围水利系统宏大；\"水上都市\"格局；世界遗产；展示于良渚博物院。","im":"images/ep11_10.jpg","it":"良渚古城四季中的十二时辰-良渚博物院","gp":"https://www.lzmuseum.cn/upload/image/20221209/6380617432681144645647858.jpg"},{"n":"良渚大坝","e":"新石器","p":"良渚博物院","b":"2016年确认的良渚水利系统，由多座水坝组成，比传说中大禹治水还早约一千年。","f":"新石器时代良渚文化；水利系统（塘山、岗公岭等水坝）2016年前后系统确认；由多坝组成；年代早于传说大禹治水约千年；展示于良渚博物院。","im":"images/ep11_11.jpg","it":"良渚遗址48小时，宝藏漫游指南来袭!-良渚博物院","gp":"https://www.lzmuseum.cn/upload/image/20251119/6389915743615802971529174.jpg"},{"n":"黑皮陶","e":"新石器","p":"良渚博物院","b":"良渚特有的黑皮陶，胎质细腻漆黑发亮，上面刻画了656个符号，或是早期文字的雏形。","f":"新石器时代良渚文化；黑皮陶（黑衣陶）；器表漆黑光亮；刻画符号众多（相关报告统计达656个）；现藏良渚博物院。","im":"images/ep11_12.jpg","it":"馆藏 - 出土文物 - 苏州博物馆","gp":"https://file.szmuseum.com/ThumbCover/文章管理缩略图/出土_0069.jpg"}]},{"no":"12","t":"四川博物院","loc":"四川成都","it":[{"n":"人面形石佩","e":"新石器","p":"四川博物院","b":"巫山大溪遗址儿童墓出土的人面形石佩，6000年前先民佩戴的护身符，憨态可掬。","f":"新石器时代大溪文化；1959年出土于四川巫山大溪遗址64号墓（儿童墓）；人面形石佩；约6000年；现藏四川博物院。","im":"images/ep12_00.jpg","it":"大溪文化人面形玉佩_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/aa18972bd40735fae6cd8d7f4d0618b30f2443a7a2e7?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"红陶空心球","e":"新石器","p":"四川博物院","b":"大溪文化空心陶球，球面分格几何分割，内装小丸可摇响，是史前的\"摇响玩具\"。","f":"新石器时代大溪文化；出土于巫山大溪遗址；空心陶球；球面作等分几何分割（约24格）；内装丸可摇响；现藏四川博物院。","im":"images/ep12_01.jpg","it":"首页 / 红陶碗","gp":"https://www.shenzhenmuseum.com/upload/jpg/2025-08-14/21f15c5e0e8aea95c1e2b71741838529.jpg"},{"n":"彩陶瓶","e":"新石器","p":"四川博物院","b":"大溪文化彩陶瓶，红陶施彩，造型素雅，是长江中游新石器彩陶的代表器物之一。","f":"新石器时代大溪文化；出土于巫山大溪遗址；彩绘陶瓶；红陶施彩；现藏四川博物院。","im":"images/ep12_02.jpg","it":"四川阿坝孔龙村遗址考古发掘阶段性成果展在四川博物院开幕-新华网","gp":"https://www.news.cn/20260129/8a2fc1df17a94c5084d93d251749759e/202601298a2fc1df17a94c5084d93d251749759e_XxjnzxC000015_20260128_CBMFN0A002.tmp"},{"n":"青玉大牙璋","e":"商","p":"四川博物院","b":"广汉月亮湾出土的巨型玉牙璋，1929年燕氏挖出，是三星堆遗址最早面世的器物之一，长达60厘米。","f":"商代（夏商之际）；1929年发现于广汉月亮湾（燕道诚发现）；三星堆遗址最早出土器物之一；通长约60厘米；现藏四川博物院。","im":"images/ep12_03.jpg","it":"青玉大牙璋_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/cebd0017391883444b90a745?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"象首耳兽面纹铜罍","e":"西周","p":"四川博物院","b":"彭州竹瓦街窖藏出的西周铜罍，双耳做成象头，满身兽面纹，是巴蜀青铜重器。","f":"西周；1980年出土于四川彭州竹瓦街窖藏；青铜罍；象首形双耳；通体兽面纹；现藏四川博物院。","im":"images/ep12_04.jpg","it":"兽面纹铜罍","gp":"https://www.chnmus.net/sitesources/20201216145939116.jpg"},{"n":"带鞘铜双剑 + 柳叶剑","e":"战国","p":"四川博物院","b":"成都出土的巴蜀式青铜剑，带木鞘，柳叶形剑身配扁茎，是古蜀典型兵器组合。","f":"战国；1973年出土于成都（中医学院古墓）；巴蜀式青铜剑；柳叶形剑身、扁茎；配木鞘；现藏四川博物院。","im":"images/ep12_05.jpg","it":"带鞘铜双剑_百度百科","gp":"https://bkimg.cdn.bcebos.com/smart/96dda144ad345982b2b7afb1dabe26adcbef76092ef7-bkimg-process,v_1,rw_1,rh_1,pad_1,color_ffffff?x-bce-process=image/format,f_auto"},{"n":"宴乐水陆攻战纹铜壶","e":"战国","p":"四川博物院","b":"百花潭出土的战国铜壶，壶身满刻水陆攻战、宴乐礼仪，人物多达两百，是先秦社会的全景图。","f":"战国；1965年出土于成都百花潭中学（战国土坑墓）；青铜壶；通体刻宴乐、采桑、水陆攻战等；人物200余；现藏四川博物院。","im":"images/ep12_06.jpg","it":"战国文物水陆攻战宴乐纹铜壶高清图片下载_红动中国","gp":"https://img.redocn.com/sheying/20200410/zhanguowenwushuilugongzhanyanlewentonghu_10900057.jpg"},{"n":"邵之四鼎","e":"战国","p":"四川博物院","b":"新都马家乡出土的战国铜鼎，盖内鸟虫篆铭文在X光下显出残片修复痕迹，是件\"拼修\"重器。","f":"战国；出土于四川新都马家乡（蜀墓）；青铜鼎；盖内鸟虫篆铭文；X光发现由残片修复；现藏四川博物院。","im":"images/ep12_07.jpg","it":"210件（套）川籍文物亮相国博 揭开古蜀文明历史面纱--文化--人民网","gp":"http://culture.people.com.cn/NMediaFile/2018/0720/MAIN201807200940000551038677829.jpg"},{"n":"楚王之印（巴蜀铜印章）","e":"战国","p":"四川博物院","b":"新都马家乡出土的方形铜印，印面并非汉字\"楚王之印\"，而是神秘难解的巴蜀图语符号。","f":"战国；出土于四川新都马家乡；方形铜印；印面为巴蜀图语（似二人抬罍、双铎等）；非汉字\"楚王之印\"；疑为蜀王印；现藏四川博物院。","im":"images/ep12_08.jpg","it":"徐州博物馆藏汉印（高清200方）首次大量公开，年代：西汉！|楚王_新浪新闻","gp":"https://k.sinaimg.cn/n/sinakd20210204s/731/w761h770/20210204/2ecd-kirmait9717792.png/w700d1q75cms.jpg?by=cms_fixed_width"},{"n":"制盐画像砖","e":"东汉","p":"四川博物院","b":"东汉画像砖，生动刻出井架汲卤、竹笕输卤、灶上煮盐的井盐生产全流程，入选《国家宝藏》。","f":"东汉；四川博物院藏；画像砖表现井盐生产（井架、滑车、灶煮）；曾入选央视《国家宝藏》；出土于成都羊子山（一说邛崃花牌坊）；现藏四川博物院。","im":"images/ep12_09.jpg","it":"东汉制盐画像砖到底是个什么砖？《国家宝藏》第二季其实没有说透_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/838ba61ea8d3fd1f4134d6516900321f95cad1c8f100?x-bce-process=image/format,f_auto"},{"n":"说唱陶俑","e":"东汉","p":"四川博物院","b":"郫县出土的说唱陶俑，俳优袒胸凸肚、手舞足蹈，是汉代\"说唱歌手\"的生动写照，憨态可掬。","f":"东汉；1963年出土于四川郫县宋家林；陶俑；原型为俳优（说唱艺人）；高约66.5厘米；现藏四川博物院。","im":"images/ep12_10.jpg","it":"博物馆里笑意盈盈的人物陶俑--文化--人民网","gp":"http://paper.people.com.cn/rmrb/res/1/20181114/1542135222580_1.jpg"},{"n":"摇钱树","e":"东汉","p":"四川博物院","b":"彭山崖墓出土的东汉摇钱树，树上挂满方孔钱和神兽，是巴蜀人求富升仙观念的明器。","f":"东汉；1972年出土于四川彭山双江乡崖墓；青铜摇钱树；通高约135厘米；饰钱纹、神兽；现藏四川博物院。","im":"images/ep12_11.jpg","it":"川蜀特产青铜摇钱树究竟有何用途，祭祀、陈设、还是明器？","gp":"http://n.sinaimg.cn/sinakd20109/794/w600h994/20200414/d73a-isehnnk0848529.jpg"},{"n":"错金铭文铜带钩","e":"三国蜀汉","p":"四川博物院","b":"绵阳出土的蜀汉错金铜带钩，饰北斗七星纹并刻72字铭文，民间附会为蒋琬之物。","f":"三国蜀汉；征集/出土于四川绵阳；青铜带钩；错金装饰；饰北斗七星纹并刻铭文（约72字）；民间传为蒋琬墓物；现藏四川博物院。","im":"images/ep12_12.jpg","it":"错金银铜带钩，战国，四川蒲江飞虎村M1出土……|四川省|考古|新星|成都|中国风_新浪新闻","gp":"http://n.sinaimg.cn/sinakd20211117ac/125/w690h1035/20211117/9415-1fb8b9b90152980f2c7baa34ec6a57f6.jpg"},{"n":"铜弩机","e":"三国蜀汉","p":"四川博物院","b":"郫县晋墓出土的蜀汉铜弩机，刻\"景耀四年\"铭文，是诸葛亮连弩时代的实物见证。","f":"三国蜀汉；1964年出土于四川郫县（晋墓）；青铜弩机；刻\"景耀四年\"（蜀汉，公元261年）铭文；现藏四川博物院。","im":"images/ep12_13.jpg","it":"铜弩机","gp":"http://chnmus.net/images/attachement/jpg/site2/20120413/00248121d8eb10f1d1a722.jpg"},{"n":"背光式佛立像","e":"南北朝","p":"四川博物院","b":"成都万佛寺遗址出土的南朝背屏式佛立像，浮雕飞天伎乐，是南朝石刻造像的精品。","f":"南北朝（南朝）；出土于成都万佛寺遗址；背屏式（背光式）佛立像；浮雕飞天伎乐；万佛寺石刻；现藏四川博物院。","im":"images/ep12_14.jpg","it":"“青州微笑——中国古青州佛造像艺术展”在广州艺术博物院开幕","gp":"https://static.museum.cn/uploadfile/museumdaily/img/ff1e5475-18fa-4c9c-bd4a-2ea5a878b092.jpeg"},{"n":"石涧敲冰七弦琴","e":"唐","p":"四川博物院","b":"唐代神农式古琴，琴底刻\"石涧敲冰\"与\"玉泉\"印，曾为耶律楚材收藏，1951年入藏川博。","f":"唐代；神农式；通长约122.7厘米；琴底刻\"石涧敲冰\"、篆印\"玉泉\"；曾为耶律楚材藏；1951年征集（蓝敬礼捐）；现藏四川博物院。","im":"images/ep12_15.jpg","it":"石涧敲冰七弦琴_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/eaf81a4c510fd9f9d72a04cdf467c32a2834349b0e76?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"兔形谥宝","e":"五代前蜀","p":"四川博物院","b":"前蜀王建墓出土的谥宝，兔首龙身白玉印，阴刻\"高祖神武圣文孝德明惠皇帝谥宝\"十四字。","f":"五代前蜀；1942年冯汉骥主持发掘成都永陵（王建墓）出土；白玉谥宝；兔首龙身钮；阴刻十四字谥号；现藏四川博物院。","im":"images/ep12_16.jpg","it":"国社@四川｜这只兔子帅！兔首龙身-新华网","gp":"http://sc.news.cn/content/2023-01/24/1129310373_16745425800081n.jpg"},{"n":"玉大带","e":"五代前蜀","p":"四川博物院","b":"永陵王建墓出土的云龙纹玉带，七方玉銙加铊尾，是迄今唯一可确认皇帝生前佩戴的玉带。","f":"五代前蜀；1942年出土于成都永陵（王建墓）；和田玉；七方玉銙、一方铊尾、银扣；銙雕蟠龙；现存唯一帝王生前玉带；现藏四川博物院。","im":"images/ep12_17.jpg","it":"新华全媒+丨在成都，触摸大运之城的文化脉动-新华网","gp":"https://www.news.cn/photo/2023-07/20/1129759988_16898510318021n.JPG"},{"n":"蜀石经","e":"五代后蜀","p":"四川博物院","b":"后蜀孟昶刊刻的儒家石经残石，经注并刻、历时近两百年，是我国唯一附注文的石经，川博藏六块。","f":"五代后蜀（广政元年，938年起）；孟昶、毋昭裔主持刊刻；立于成都文翁石室；经注并刻，十三经；残石现存约7块（川博藏6块，1块在中国国家博物馆）；现藏四川博物院。","im":"images/ep12_18.jpg","it":"比较研究","gp":"https://www.chnmus.net/images/201803/26/89d62a6c-621f-437d-be74-7229026987f3.jpg"},{"n":"腊梅双禽图","e":"北宋","p":"四川博物院","b":"宋徽宗赵佶真迹纨扇面，腊梅枝头两只山雀相顾，右下\"天下一人\"花押，生漆点睛。","f":"宋代（北宋）；宋徽宗赵佶绘；绢本纨扇面；纵25.8、横26.1厘米；右下\"御笔\"\"天下一人\"押、钤\"御书\"葫芦印；生漆点睛；现藏四川博物院。","im":"images/ep12_19.jpg","it":"云逛博物馆，身临其境-中国丝绸博物馆","gp":"https://www.chinasilkmuseum.com/uploadfiles/2020/05/20200519105857625.jpg"},{"n":"芙蓉花瓣纹金盏","e":"宋代","p":"四川博物院","b":"安县宋代窖藏出的芙蓉花形金酒盏，八瓣错叠、锤揲錾刻，尽显宋人素雅的饮酒审美。","f":"宋代；1973年出土于四川安县文星公社（今花荄镇）；金质酒盏；芙蓉花形、八瓣错叠；锤揲与錾刻工艺；现藏四川博物院。","im":"images/ep12_20.jpg","it":"成都金沙遗址博物馆","gp":"https://www.jinshasitemuseum.com/steponview/files/20230106/宋芙蓉花金盏_1672973956573.jpg"},{"n":"侍女拥衾图轴","e":"近现代","p":"四川博物院","b":"张大千1946年仕女画，拥被侧卧的仕女融入敦煌藻井纹样，是其敦煌归来后的变法代表作。","f":"1946年；张大千绘；纸本设色；纵117、横47.3厘米；仕女拥衾题材；受敦煌壁画影响；现藏四川博物院。","im":"images/ep12_21.jpg","it":"国博开年大展 讲述张大千的书画一生【2】--书画--人民网","gp":"http://www.people.com.cn/mediafile/pic/20180117/74/12559041646484662474.jpg"}]},{"no":"13","t":"陕西历史博物馆","loc":"陕西西安","it":[{"n":"禹鼎 / 五祀卫鼎 / 多友鼎","e":"西周","p":"陕西历史博物馆（禹鼎一说藏中国国家博物馆）","b":"三件西周青铜鼎，靠肚子里的长篇铭文出名。五祀卫鼎记一场土地官司，多友鼎记一场反击猃狁的战争，都是没有别的史书能替代的第一手材料。","f":"五祀卫鼎1975年岐山董家村窖藏出土，通高36.5—37.2厘米（官网与百科数据略有出入）、口径32.7—34.3厘米、重11.5公斤，铭文19行207字，记周共王五年裘卫与邦君厉换地，是西周中期断代标准器；多友鼎1980年长安斗门镇出土，通高51.5厘米、重35公斤，铭文22行279字，记反击猃狁之战，现藏陕西历史博物馆；禹鼎传1942年扶风任家村出土，铭文记鄂侯驭方叛乱，现藏中国国家博物馆。","im":"images/ep13_00.jpg","it":"五祀卫鼎（陕西历史博物馆馆藏文物）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/a044ad345982b2b77849cb7c31adcbef77099bb0?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,w_440"},{"n":"牛尊","e":"西周中期","p":"陕西历史博物馆","b":"做成牛形的盛酒器，牛背开口加盖，盖上蹲一只小虎当钮。商周把酒器做成牲口形状很常见，但做得这么\"写实又卡通\"的不多。","f":"1967年陕西岐山贺家村出土；西周中期；牛体浑圆、四足粗壮，背有方口与盖，盖钮为一立虎；现藏陕西历史博物馆。","im":"images/ep13_01.jpg","it":"陕西西安：陕西历史博物馆-人民图片网","gp":"http://vip-public.people.com.cn/photo/2021/6/23/3bd9108ee44c4fc2a084a24d4e973ccfR0zI_m.jpg"},{"n":"日己方彝 / 方尊 / 觥","e":"西周中期","p":"陕西历史博物馆","b":"同一个人\"日己\"做的一套酒器，方彝、方尊、觥三件齐出，铭文里带着族徽。三件套完整存世，是西周青铜\"系列收藏\"的典型样本。","f":"1963年扶风齐家村窖藏出土；日己方彝通高38.5厘米、重12.8公斤，通体以饕餮纹为主题；日己觥通高32厘米、通长33.5厘米，器盖同铭各18字；现藏陕西历史博物馆。","im":"images/ep13_02.jpg","it":"超震撼的文物：告诉你陕西历史博物馆有多牛__凤凰网","gp":"https://x0.ifengimg.com/res/2020/66DF2FB26CDB0E4E96282456A5D71B211BA6BC34_size104_w640_h899.jpeg"},{"n":"师丞钟","e":"西周中期","p":"陕西历史博物馆","b":"西周贵族的打击乐器，也是\"记事本\"——钟上48字铭文记了师丞受周王赏赐的事。它的价值在于器形有明确断代意义。","f":"1974年扶风强家村出土；西周中期（一般定为周孝王时期）；通高76.5厘米；铭文48字，记师丞受赏、为其祖考作器；现藏陕西历史博物馆。","im":"images/ep13_03.jpg","it":"西周师丞钟：你知道3000年前的周人怎么祭祖的吗？|青铜|青铜钟|陕西省|万年|铭文_新浪新闻","gp":"https://n.sinaimg.cn/sinakd20260323s/341/w1242h699/20260323/598a-55924c126d507554793854b70897fab7.jpg"},{"n":"它盉 + 它盘","e":"西周晚期","p":"陕西历史博物馆","b":"一套洗手用的家伙——上面用盉倒水，下面用盘接水，盘底还刻着\"它\"字族徽。这是中国最早成组的\"盥洗用具\"之一。","f":"1963年扶风齐家村窖藏出土；它盘通高14.1厘米、口径40.4厘米、腹深6.8厘米、重8.3公斤，盘腹刻\"它\"字族徽；它盉与之配套，属西周晚期；现藏陕西历史博物馆。","im":"images/ep13_04.jpg","it":"它盉_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/ca5257546d08f56d564e00c1?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_504"},{"n":"鸟盖瓠壶","e":"战国（秦）","p":"陕西历史博物馆","b":"壶身做成一个弯脖子葫芦，盖子上立一只大鸟，鸟爪抓着两条扭动的小龙，肩部还有个虎形提手。实用器做成了雕塑。","f":"1967年陕西绥德出土；战国时期秦国器物；通高32.6厘米、口径6厘米、圈足径8.8厘米、最大腹围39.7厘米；现藏陕西历史博物馆。","im":"images/ep13_05.jpg","it":"1719884994361027298.jpg","gp":"https://www.shenzhenmuseum.com/userfiles/ueditor/jsp/upload/image/20240702/1719884994361027298.jpg"},{"n":"杜虎符","e":"战国（秦）","p":"陕西历史博物馆","b":"调兵用的虎形凭证，一剖为二，君王拿右半、将领拿左半，对得上才能发兵。这是中国现存最早的虎符实物之一，错金铭文里写明了整套用兵制度。","f":"1975年西安南郊北沈家桥村出土；长9.5厘米、高4.4厘米、厚0.7厘米；虎作行走状，昂首卷尾，错金铭文40字，规定\"甲兵之符，右才（在）君，左才（在）杜\"；现藏陕西历史博物馆；首批禁止出境展览文物。","im":"images/ep13_06.jpg","it":"揭秘《国家宝藏》中的杜虎符背后的历史故事_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/8326cffc1e178a82b9011d626456648da977381242e1"},{"n":"两诏高奴铜权","e":"战国（秦）","p":"陕西历史博物馆","b":"一个铜秤砣，上面刻着秦始皇和秦二世两代皇帝的诏书，等于把统一的度量衡法令铸在了实物上。","f":"1964年西安三桥出土；秦代；器身刻秦始皇二十六年诏与秦二世元年诏两段铭文，\"高奴\"是铸造地；现藏陕西历史博物馆。","im":"images/ep13_07.jpg","it":"秦铜权_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/8ad4b31c8701a18b3c6e7efb9e2f07082938fef9?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_415"},{"n":"皇后之玺","e":"西汉","p":"陕西历史博物馆","b":"一枚小小的白玉印章，却是迄今唯一的汉代皇后玉玺实物。1968年一个少年在水渠边捡到，让\"皇后制度\"第一次有了实物。","f":"1968年陕西咸阳韩家湾出土；正方形，边长2.8厘米，通高2厘米，重33克；和田羊脂白玉，螭虎钮，阴刻篆书\"皇后之玺\"；与《汉官旧仪》\"皇后之玺，金螭虎纽\"记载相合；出土地近汉高祖长陵与吕后陵，学界多认为是吕后之物；第三批禁止出境展览文物；现藏陕西历史博物馆。","im":"images/ep13_08.jpg","it":"西汉皇后之玺是陕西历史博物馆三大镇馆之宝之一_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/faedab64034f78f0f7361e7b557f1d55b319eac4b6af?x-bce-process=image/format,f_auto"},{"n":"鎏金铜蚕","e":"西汉","p":"陕西历史博物馆","b":"一只鎏金的铜蚕，9个腹节、胸脚腹脚齐全。2017年\"一带一路\"论坛上被点名称它是丝绸之路的见证，从此全国知名。","f":"1984年陕西石泉县出土；通长5.6厘米、胸围1.9厘米、胸高1.8厘米；首尾共9个腹节，体态作仰头或吐丝状；汉代；把石泉的养蚕史推前到汉代；现藏陕西历史博物馆。","im":"images/ep13_09.jpg","it":"陕西历史博物馆千年“鎏金铜蚕”见证丝绸之路历史_央广网","gp":"https://www.cnr.cn/sxpd/sx/20170515/W020170515414435631534.jpg"},{"n":"鎏金银铜竹节熏炉","e":"西汉","p":"陕西历史博物馆","b":"竹节状的香炉，通体鎏金鎏银，底刻\"阳信家\"字样。它跟汉武帝茂陵有关，是西汉皇家用器里最讲究的几件之一。","f":"1981年陕西兴平茂陵1号墓南侧出土；通高58厘米；器身作五节竹竿状，柄部刻\"阳信家\"铭文；汉武帝时期；现藏陕西历史博物馆。","im":"images/ep13_10.jpg","it":"陕西历史博物馆藏· 西汉鎏金竹节铜香熏|熏炉|公主墓|陪葬坑_新浪新闻","gp":"http://n.sinaimg.cn/sinacn09/798/w960h1438/20180821/888f-hhzsncz9945951.jpg"},{"n":"金怪兽","e":"战国（匈奴）","p":"陕西历史博物馆","b":"纯金打的一只\"四不像\"怪兽，角是鸟形、身是兽形、嘴是鹰嘴。匈奴墓葬里出来的金器，说明北方草原贵族的审美和中原完全是两路。","f":"1957年陕西神木纳林高兔村匈奴墓出土；纯金，通高11.5厘米、长11厘米，重160克；金片最薄处约0.12厘米；造型为多种动物合体；现藏陕西历史博物馆。","im":"images/ep13_11.jpg","it":"千余件珍宝亮相 讲述秦汉文明【5】--图片频道--人民网","gp":"http://pic.people.com.cn/NMediaFile/2024/0517/MAIN1715932857744O1UHXIO8W0.JPG"},{"n":"独孤信多面体印","e":"西魏","p":"陕西历史博物馆","b":"一枚煤精石做的26面体印章，14个面上刻着不同用途的印文——上书、写信、行文各用一面。一个人带着一枚印就能走遍官场，是西魏权臣独孤信的\"随身公文包\"。","f":"1981年陕西旬阳出土；煤精石；共26面，其中14面刻有印文；印文含\"独孤信白书\"\"臣信上疏\"\"大都督印\"等，阴文楷书，带魏碑风格；西魏；现藏陕西历史博物馆。","im":"images/ep13_12.jpg","it":"高考数学捧红独孤信印 他被称为“天下第一岳父”_凤凰网","gp":"http://e0.ifengimg.com/06/2019/0613/53CDB8D04EEA685283B1038BAF7A66C24B4A8F3C_size53_w702_h646.jpeg"},{"n":"绿琉璃瓶","e":"隋代","p":"陕西历史博物馆","b":"隋代的一件绿色透明玻璃瓶，球状。中国本土玻璃器存世不多，这类\"绿玻璃\"通常跟外来工艺有关联。","f":"高8.4厘米，球形，绿色透明；出土于西安东郊（一说长乐路、一说清禅寺塔基地宫，两种说法并存）；隋代；现藏陕西历史博物馆。","im":"images/ep13_13.jpg","it":"隋绿色琉璃瓶_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/d8f9d72a6059252dd42a91d14bd4143b5bb5c8ea139c?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"唐墓壁画群","e":"唐","p":"陕西历史博物馆（唐代壁画珍品馆）","b":"陕历博最\"豪\"的一批藏品——近600幅、1000多平方米从唐墓整体搬下来的壁画。客使图里有外国使节，马球图是最早的马球图像，阙楼仪仗图如实记录了唐代皇家建筑长什么样。","f":"馆藏唐墓壁画来自20多座唐墓，面积1000余平方米；客使图185×242厘米（章怀太子墓墓道东壁）、马球图、狩猎出行图高209厘米（章怀太子墓）、阙楼仪仗图305×298厘米（懿德太子墓）、宫女图168×188厘米（永泰公主墓）；均1971年前后发掘；现藏陕西历史博物馆唐代壁画珍品馆。","im":"images/ep13_14.jpg","it":"【西安游学】1月27至28日，唐墓壁画 千尊彩塑 古建天宫 汉唐碑绝|壁画|西安|唐墓_新浪新闻","gp":"http://n.sinaimg.cn/sinacn/w1920h1080/20180110/f044-fyqnick1271933.jpg"},{"n":"何家村遗宝（鸳鸯莲瓣纹金碗、鎏金舞马衔杯纹银壶、葡萄花鸟纹银香囊、镶金兽首玛瑙杯、鎏金鹦鹉纹提梁银罐）","e":"唐","p":"陕西历史博物馆","b":"1970年西安南郊施工挖出两个陶瓮一个银罐，里面塞了1000多件唐代金银玉器。它是\"大唐盛世到底多有钱\"最直接的物证——舞马衔杯、鸳鸯莲瓣、香囊里那个不会翻倒的万向环，件件都是顶级工艺。","f":"1970年10月西安南郊何家村（唐代兴化坊）出土，两瓮一罐共1000余件；鸳鸯莲瓣纹金碗高5.5厘米、口径13.7厘米，两件，内壁墨书\"九两半\"\"九两三\"；鎏金舞马衔杯纹银壶通高14.8厘米，仿皮囊造型；葡萄花鸟纹银香囊外径4.6厘米、链长7.5厘米，内设同心圆机环；镶金兽首玛瑙杯长15.6厘米、口径5.9厘米，海内孤品；鎏金鹦鹉纹提梁银罐高24.2厘米，盖内墨书\"紫英五十两\"；埋藏者主流推测为唐代租庸使刘震，埋于783年泾原兵变；现藏陕西历史博物馆。","im":"images/ep13_15.jpg","it":"“大唐遗宝——何家村窖藏出土文物展”全新亮相-新华网","gp":"http://sn.news.cn/2022-05/19/1128663954_16529236154831n.jpg"},{"n":"三彩载乐骆驼俑","e":"唐","p":"陕西历史博物馆","b":"一只骆驼背上塞了8个人——7个乐手围坐，中间一位女舞者。唐三彩里最有名的一件，把丝绸之路上的胡乐胡舞固定在了一尊陶俑上。","f":"1959年西安市西郊中堡村唐墓出土；通高58厘米、长41—43厘米（不同来源数据略有出入，驼高48.5厘米）；驼背平台上有7个男乐俑执笙、箫、琵琶、箜篌、笛、拍板、排箫，中间1名女舞俑；唐；第三批禁止出境展览文物；现藏陕西历史博物馆。","im":"images/ep13_16.jpg","it":"唐三彩骆驼（北京故宫博物院馆藏文物）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/b03533fa828ba61ea8d3aa86006c800a304e251ff358?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_1000"},{"n":"彩绘釉陶载物骆驼俑 / 戴帷帽女骑马俑","e":"唐","p":"陕西历史博物馆","b":"一批彩绘釉陶俑，主角是驮着货的骆驼和戴帷帽骑马的女人。前者是丝路上跑运输的标准像，后者说明唐代女性出门骑马、还遮个帽檐挡风沙。","f":"1972年陕西礼泉郑仁泰墓出土；唐（郑仁泰卒于664年）；彩绘釉陶；现藏陕西历史博物馆。","im":"images/ep13_17.jpg","it":"彩绘骑马戴帷帽仕女泥俑_百度百科","gp":"https://bkimg.cdn.bcebos.com/smart/4a36acaf2edda3cc7cd94d5a9ebe2e01213fb80e340b-bkimg-process,v_1,rw_1,rh_1,pad_1,color_ffffff?x-bce-process=image/format,f_auto"},{"n":"青瓷提梁倒灌壶","e":"五代","p":"陕西历史博物馆","b":"一把没有盖子、只有壶底一个梅花孔的壶。从底孔灌水、翻过来正着倒，滴水不漏——靠的是连通器原理。民间叫它\"魔壶\"。","f":"1968年陕西彬县出土；高18.3厘米、腹径14.3厘米、腹深12厘米、足径7.5厘米；耀州窑青釉；提梁作伏凤、流作母子狮、饰牡丹，故有\"三王壶\"之说；五代；第三批禁止出境展览文物；现藏陕西历史博物馆。","im":"images/ep13_18.jpg","it":"陕西历史博物馆最全攻略指南 - 知乎","gp":"https://pic4.zhimg.com/v2-2fa7747ad910b91e51c030ee76679b15_r.jpg"},{"n":"黑釉油滴碗","e":"宋","p":"陕西历史博物馆","b":"一口又大又黑、釉面浮满银灰色\"油滴\"的碗。油滴釉要高温烧成，成品率极低，而这件是同类里尺寸最大的一口。","f":"西安蒲城县城关镇征集入藏；高8.5厘米、口径30厘米、底径10.6厘米；黑釉，釉面布满具金属光泽的圆点状结晶；宋代；现藏陕西历史博物馆。","im":"images/ep13_19.jpg","it":"陕历博全攻略，18件镇馆之宝一览表，收藏此表每件国宝都不会错过_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/5243fbf2b2119313b07ebc42b3751bd7912396dd27b9?x-bce-process=image/format,f_auto"}]},{"no":"14","t":"天津博物馆","loc":"天津河西","it":[{"n":"太保鼎","e":"西周早期","p":"天津博物馆","b":"西周初年重臣召公奭铸的方鼎，清末\"梁山七器\"里唯一留在国内博物馆的一件。它的柱足上带扉棱、中部还有个圆盘，这两处装饰在商周青铜器里独一份。","f":"通高57.6厘米、长35.8厘米、宽22.8厘米，重26公斤；四柱足、双立耳、耳上浮雕双兽，腹饰蕉叶纹与饕餮纹；腹内壁铸\"大保铸\"三字；清道光或咸丰年间山东寿张县梁山（今泰安东平）出土；1958年徐世昌后人捐献；首批禁止出境展览文物；现藏天津博物馆。","im":"images/ep14_00.jpg","it":"馆藏天津 | 游览这座博物馆，你将领略各色文物不..._百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/562c11dfa9ec8a1363274292064e868fa0ec08fa6a39?x-bce-process=image/format,f_auto"},{"n":"夔纹铜禁","e":"西周","p":"天津博物馆","b":"一件放酒器的长方形青铜\"台子\"，四周镂空。传世的西周铜禁只找到两件，另一件在纽约大都会博物馆。这是国内唯一一件。","f":"高23厘米、长126厘米、宽46.6厘米；扁平长方体、中空无底，禁面有三个椭圆形子口，前后各两排共16个长方形孔、左右各4个；四周饰夔纹；现为焊接修复件；现藏天津博物馆。","im":"images/ep14_01.jpg","it":"周夔纹铜禁的曲折往事 - 济宁博物馆","gp":"https://www.jiningmuseum.com/uploadimg/jsp/upload/image/20220324/1648081568727098978.jpg"},{"n":"小克鼎","e":"西周晚期","p":"天津博物馆","b":"和上海博物馆的大克鼎同属\"克氏青铜器\"，但个头小得多。72字铭文记周王派\"克\"去成周整饬驻军，是研究西周晚期军政的一手材料。","f":"通高35.1厘米、口径32.8厘米；双立耳、三兽蹄足；腹内壁铭文8行72字，记周厉王二十三年王命膳夫克巡视成周军队；清光绪十六年（1890）陕西扶风法门寺任村出土；徐世昌旧藏，其后人张秉慧捐献；现藏天津博物馆。","im":"images/ep14_02.jpg","it":"小克鼎_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/d009b3de9c82d158ff0d0b338e0a19d8bd3e42a0?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_439"},{"n":"克钟、克镈","e":"西周晚期","p":"天津博物馆","b":"一套西周青铜乐器。克镈是出土的克氏青铜器里唯一一件\"镈\"，79字铭文记\"克\"受周王赏赐去巡察、回来又得车马。它是中国早期音乐制度和礼制的实物凭据。","f":"克镈通高63.5厘米，椭圆体、平口、四面透雕夔纹凸棱，鼓部铭文79字；克钟高51.1—63.5厘米（不同来源数据不一），铭文79字分刻两器、天博藏为下半篇、上半篇在上海博物馆；清光绪十六年（1890）陕西扶风任村出土；克镈由张叔诚于上世纪80年代捐献；现藏天津博物馆。","im":"images/ep14_03.jpg","it":"天津博物馆百年华诞 三大镇馆之宝齐亮相--书画--人民网","gp":"http://www.people.com.cn/mediafile/pic/20180604/32/10467823529642377472.jpg"},{"n":"楚王酓悍鼎","e":"战国（楚）","p":"天津博物馆","b":"楚幽王熊悍铸造的大鼎，铭文写明他是用缴获的兵器熔了铸的。同款两件，另一件在国家博物馆。","f":"通高53厘米、口径45.5厘米、腹围148厘米；附耳直腹、兽蹄足、有盖，盖内与口沿、腹部共铭文60字，记楚幽王庆胜利用缴获兵器铸鼎以祭祀；安徽寿县朱家集（今属长丰）李三孤堆出土；同形同铭另有一件藏中国国家博物馆；现藏天津博物馆。","im":"images/ep14_04.jpg","it":"楚幽王_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/0dd7912397dda144ad34981320edc7a20cf431ad2845?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_514"},{"n":"青玉行气铭文","e":"战国","p":"天津博物馆","b":"一件12面棱柱状的小玉器，45个字讲怎么练气。它是现在能见到的最早的气功（导引）理论实物。","f":"高5.4厘米、外径3.4厘米；12面棱筒状，中空，下部有一穿孔；每面刻篆书，共45字（含8个重文符号，第7行首字漏刻1个）；郭沫若释文为\"行气，深则蓄，蓄则伸……顺则生，逆则死\"；现藏天津博物馆。","im":"images/ep14_05.jpg","it":"战国 青玉“行气铭”文饰-中国文物网-文博收藏艺术专业门户网站","gp":"http://im.wenwuchina.com/upload/2018/06/06/20180606114540146.jpg"},{"n":"白釉龙柄连腹传瓶","e":"隋","p":"天津博物馆","b":"两个瓶身连在一起、共用一个口，两侧各有一条龙形长柄，龙头探进瓶口。隋代白瓷的创新器型，瓶底还刻着\"此传瓶，有並\"。","f":"高18.5厘米、口径5.2厘米、底径2.5厘米、腹径11厘米；盘口、单颈、双腹相连、双龙柄；双平底刻\"此传瓶，有並\"；隋代；第三批禁止出境展览文物；另有一件同类藏中国国家博物馆，出自隋李静训墓，无刻款；现藏天津博物馆。","im":"images/ep14_06.jpg","it":"首页 / 白釉双龙柄瓶","gp":"https://www.shenzhenmuseum.com/upload/jpg/2024-04-28/67c5dbc68fa6642c9599fd68aab8013c.jpg"},{"n":"寒切帖","e":"唐","p":"天津博物馆","b":"王羲之草书的唐代摹本，一件纸本手札。真迹早就不在了，唐摹本是今天能看到的最接近原貌的样子之一。","f":"唐代摹本，纸本；内容是王羲之的一封短札；现藏天津博物馆。","im":"images/ep14_07.jpg","it":"听文物讲故事｜“书圣”王羲之在这封信里说了啥？-新华网","gp":"https://www.news.cn/2023-04/28/1129578815_16826790758961n.jpg"},{"n":"雪景寒林图","e":"北宋","p":"天津博物馆","b":"范宽画的三拼绢大幅立轴。雪山、寒林、萧寺，画面前景树干里藏着\"臣范宽制\"的款。现存大陆唯一被公认为范宽的作品，天博的镇馆之首。","f":"绢本水墨，约160.3×193.5厘米；三拼大幅立轴；图上有宋\"御书之宝\"印；《宣和画谱》著录，曾入宋内府；一般记载由张叔诚捐献；现藏天津博物馆。","im":"images/ep14_08.jpg","it":"天津博物馆百年华诞 三大镇馆之宝齐亮相--书画--人民网","gp":"http://www.people.com.cn/mediafile/pic/20180604/7/48881705317682975.jpg"},{"n":"金明池争标图","e":"北宋","p":"天津博物馆","b":"一个团扇大小的册页，画的是一大群人看龙舟争标。作者署名张择端——就是画《清明上河图》那位。","f":"绢本设色册页，传为北宋张择端作；描绘北宋汴京金明池龙舟竞渡场景；现藏天津博物馆。","im":"images/ep14_09.jpg","it":"金明池争标图：全景“达人”张择端的又一神作_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/00e93901213fb80e7bec235ed881382eb9389a503ea3"},{"n":"濠梁秋水图","e":"宋","p":"天津博物馆","b":"取材庄子与惠施\"濠梁观鱼\"的故事，李唐画的。清宫旧藏散出的东西。","f":"绢本设色，传为南宋李唐作；内容取《庄子·秋水》濠梁观鱼典故；现藏天津博物馆。","im":"images/ep14_10.jpg","it":"濠梁秋水图（濠梁秋水图）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/aec379310a55b31979fdd57c44a98226cffc17b6?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_371"},{"n":"玉壶冰琴","e":"南宋","p":"天津博物馆","b":"一把南宋的古琴，名字取自\"一片冰心在玉壶\"。古琴看的是音，也看断纹和铭文，这类存世宋琴数量不多。","f":"南宋；古琴（七弦琴）；现藏天津博物馆。","im":"images/ep14_11.jpg","it":"深挖馆藏资源，运用数字技术，推进文教结合，天津博物馆——多措并举让文物“活”起来-新华网","gp":"https://www.news.cn/politics/2023-04/04/1129492580_16805739685621n.jpg"},{"n":"青玉翼龙纹双耳壶","e":"元","p":"天津博物馆","b":"一件元代青玉壶，身上浮雕一只带翅膀、有鹿角、鱼尾巴的翼龙，底下卷着海水。元代玉器里壶本来就罕见，这件通体六层纹饰。","f":"高15.5厘米、宽12.4厘米、口径5.9厘米、底径5.3厘米；青玉，器表有褐色斑缕；直口、两侧云纹半环耳；腹部浮雕翼龙与海水，下腹饰莲瓣纹；元（1271—1368）；现藏天津博物馆。","im":"images/ep14_12.jpg","it":"实拍元青玉翼龙纹双耳壶|天津博物馆_新浪新闻","gp":"http://n.sinaimg.cn/sinacn20117/157/w757h1000/20181205/54ee-hprknvt2253015.jpg"},{"n":"青花枇杷绶带鸟纹盘","e":"明永乐","p":"天津博物馆","b":"永乐青花的标准样——枇杷枝上落一只绶带鸟，苏麻离青发色浓艳。这类盘子当时是官窑精品，存世不多。","f":"明永乐；青花瓷盘，主题纹饰为枇杷绶带鸟；现藏天津博物馆。","im":"images/ep14_13.jpg","it":"明 青花枇杷绶带鸟图盘-中国文物网-文博收藏艺术专业门户网站","gp":"http://im.wenwuchina.com/upload/2018/06/06/20180606021616706.jpg"},{"n":"珐琅彩芍药雉鸡图玉壶春瓶","e":"清乾隆","p":"天津博物馆","b":"乾隆亲自在一批同款里挑出来的那一件，挑剩的当场砸掉，所以它是孤品。瓶上题诗、画芍药雉鸡、盖印章，集诗书画印于一身。","f":"高16.3厘米、口径4厘米、底径5厘米；小撇口、长颈、圈足；颈部蓝料彩绘蕉叶纹，腹部珐琅彩绘芍药雉鸡图；空白处墨彩题\"青扶承露蕊，红妥出阑枝\"，朱文\"春和\"、白文\"翠铺\"、朱文\"霞映\"印；底赭彩四字款\"乾隆年制\"；清宫散出后经潘芝翘收藏，20世纪60年代天津市政府以1.32万元留购；现藏天津博物馆。","im":"images/ep14_14.jpg","it":"一物丨珐琅彩芍药雉鸡图玉壶春瓶_烧制","gp":"http://5b0988e595225.cdn.sohucs.com/images/20180919/aa3930009c864711a5d111ef305ec6e8.jpeg"},{"n":"万笏朝天图卷","e":"清乾隆","p":"天津博物馆","b":"把苏州天平山的山势画成一排排\"笏板\"，寓意群臣朝拜。这是乾隆南巡题材里比较出名的一卷。","f":"清乾隆年间；纸本设色长卷，绘苏州天平山万笏朝天景；现藏天津博物馆。","im":"images/ep14_15.jpg","it":"天津博物馆馆藏金碧山水人物长卷《万笏朝天图》首次展全貌-新华网天津","gp":"http://tj.news.cn/20230623/719da69f060a46079707e8198bf7297d/20230623719da69f060a46079707e8198bf7297d_2023062348f108a963f74ba4b7b53e598f5750f6.jpg"},{"n":"翡翠蝈蝈白菜","e":"清","p":"天津博物馆","b":"一块翡翠，绿的部分雕成蝈蝈和螳螂，白黄带褐的部分雕成白菜。这叫\"俏色\"，是清代玉雕里最考手艺的一类。","f":"高19.4厘米、宽14厘米，重约2公斤；翡翠俏色圆雕，白菜下部灰黄伴褐斑，菜心处绿色圆雕一对蝈蝈与一只螳螂；清代；现藏天津博物馆。","im":"images/ep14_16.jpg","it":"天津博物馆_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/faedab64034f78f0f73616375d691d55b319eac4b6e5?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_1000"}]},{"no":"15","t":"台北历史博物馆","loc":"中国台湾台北","it":[{"n":"蟠龙方壶（盘龙方壶）","e":"春秋中期","p":"中国台湾台北·台北历史博物馆","b":"1923年新郑郑公大墓出的方壶，原为一对，1949年一只搭上最后一班运宝专机到了台湾，另一只留在了北京故宫。壶顶镂空蟠蛇纹盖冠、两侧龙形耳、底下两只猛虎当足。","f":"通高90厘米；圆角长方形，盖顶饰镂空蟠螭纹，颈部浮雕山形夔龙纹，腹侧顾首龙形耳，圈足底铸双虎形兽；1923年8月25日河南新郑李家楼郑公大墓出土，同批\"新郑彝器\"共1000余件；同形方壶共四对，分藏两岸多家博物馆；中国台湾台北·台北历史博物馆藏，另一件在北京故宫博物院。","im":"images/ep15_00.jpg","it":"春秋蟠龙纹铜方壶（春秋时期青铜礼器）_百度百科","gp":"http://baike.baidu.com/cms/s/museum/v2/uploads/23春秋蟠龙纹铜方壶原尺寸.png"},{"n":"兽面人形觥座（兽形器座）","e":"春秋中期","p":"中国台湾台北·台北历史博物馆","b":"一个人头兽身的青铜座子，全器上下找不到第二件同款。至于它是干嘛用的，学界到今天也没说清。","f":"新郑郑公大墓出土；春秋中期；青铜，兽面人身造型；用途不明，\"器座\"为后加定名；中国台湾台北·台北历史博物馆藏。","im":"images/ep15_01.jpg","it":"兽面专题· 『从北朝到唐风宋韵 』 - 知乎","gp":"https://pic2.zhimg.com/v2-0e351b1ee6c2afe39d5b57f2dff66199_1440w.jpg"},{"n":"金柄兽面纹铜短剑","e":"春秋","p":"中国台湾台北·台北历史博物馆","b":"一把剑柄纯金的短剑，剑格上兽面纹，那么多年了金柄还是亮的。出土于河南辉县琉璃阁甲墓，一般认为是卫国国君随身佩带的兵器。","f":"1936年河南辉县琉璃阁甲墓出土；长30.8厘米、宽3.9厘米、高3厘米；剑身狭长、中脊突起；剑柄金质，剑首中空椭圆形饰蟠螭纹，剑格饰饕餮纹，两瓣各伏一小兽，茎作螺旋纹；春秋；琉璃阁甲乙两墓文物现分藏两岸六地7家博物馆；中国台湾台北·台北历史博物馆藏。","im":"images/ep15_02.jpg","it":"东方吉金——中韩日古代青铜器展","gp":"https://www.chnmuseum.cn/portals/0/web/zt/202207dfjj/img/bdyimg1.jpg"},{"n":"曹天度造九层千佛石塔","e":"北魏","p":"中国台湾台北·台北历史博物馆（塔刹另存山西）","b":"北魏一个叫曹天度的小官，为死去的父亲和儿子造的九层石塔，塔上刻了1300多尊小佛。塔身塔座1949年运到台湾，塔刹当年被农民藏起来躲过日军劫掠，从此两地分居。","f":"北魏献文帝天安元年（466）造；约160厘米高的石料上雕佛像1300余尊；塔身、塔座藏中国台湾台北·台北历史博物馆，塔刹存山西朔州（一般记载藏朔州市文物保管所／马邑博物馆）；中国台湾台北·台北历史博物馆列为国宝。","im":"images/ep15_03.jpg","it":"千佛石塔_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/5bafa40f4bfbfbed0155380076f0f736afc31f44?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"溪山无尽图","e":"南宋（传）","p":"中国台湾台北·台北历史博物馆","b":"一幅16米多长的纸本山水长卷，卷末写\"臣夏圭进\"。张大千看完题了\"天下夏圭第一\"。不过画风也有人说更像明代人手笔。","f":"纸本水墨，纵38厘米、横1639.5厘米，整卷无一接缝，以鄱阳白长纸绘成；卷末有\"臣夏圭进\"款，卷首有张大千题\"天下夏圭第一\"；历经宋贾似道、明项元汴、清赵元中收藏；原属陕西省政府，1955年起寄存台北历史博物馆，馆藏编号\"陕西一号\"；官方登录为\"（传）宋代\"，但有研究认为斧劈皴已程式化、笔法近明代戴进吴伟一路。","im":"images/ep15_04.jpg","it":"溪山无尽图（溪山无尽图）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/b3fb43166d224f4a5a4af5b805f790529922d14e?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,w_440"},{"n":"皇明监国鲁王圹志","e":"明永历十六年（1662）","p":"中国台湾台北·台北历史博物馆","b":"南明监国鲁王朱以海的墓志。志文写他病死于康熙元年，直接推翻了《明史》里\"被郑成功沉海而死\"的说法，替郑成功洗了冤。","f":"1959年8月22日在金门旧金城城东炸山采石时发现；玄武岩；长63.5厘米、宽47厘米、厚5厘米；碑额隶书\"皇明监国鲁王圹志\"，志文楷书；制作于永历十六年（1662），记朱以海因哮疾去世，卒于1662年11月13日；1960年移交中国台湾台北·台北历史博物馆典藏。","im":"images/ep15_05.jpg","it":"走进滕州博物馆！5万余件藏品，感受传统建筑和艺术的完美结合_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/64380cd7912397dda144ce8eb6cfa5b7d0a20df429a1?x-bce-process=image/format,f_auto"},{"n":"甘国宝指画虎","e":"清","p":"中国台湾台北·台北历史博物馆","b":"用手指蘸墨画的老虎，作者甘国宝是清代武将，指画老虎是他的招牌。","f":"清代；指画（以指代笔）；作者甘国宝（1709—1776）；中国台湾台北·台北历史博物馆藏。","im":"images/ep15_06.jpg","it":"甘国宝（清代雍正元年武进士）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/5d212aa8b49a139ccb130cd0?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_820"},{"n":"大墨荷通屏","e":"民国（1945）","p":"中国台湾台北·台北历史博物馆","b":"张大千1945年画的一堂四屏丈二墨荷，高过3米、合起来宽6米多。据研究这类尺寸的大荷花通屏全世界只有两件，这件在史博馆。","f":"1945年作，四屏（连屏）巨幅水墨荷花；画幅高度超过3米、总宽逾6米；张大千1941—1943年赴敦煌临摹壁画后风格转雄阔，此作为其画荷最大尺幅之一；中国台湾台北·台北历史博物馆藏。","im":"images/ep15_07.jpg","it":"墨荷通景屏_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/b21c8701a18b87d632f19e1b070828381f30fd06?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"溪山楼阁","e":"民国","p":"中国台湾台北·台北历史博物馆","b":"溥心畬画的一幅山水，巨石盘松、高士过桥，远处山壁直接笔绘楼阁飞檐。他跟张大千并称\"南张北溥\"。","f":"纸本水墨设色；构图集中于左侧，右侧以淡染远山与留白对比；右上题款\"峻极何年殿，高标多烈风……心畲\"；溥心畬（1896—1963）；1965年\"纽博案\"徵购入藏；中国台湾台北·台北历史博物馆藏（馆藏编号08206）。","im":"images/ep15_08.jpg","it":"溪山楼阁图_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/a8362712d07e214ff819b8a1?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"菊花静物","e":"现代","p":"中国台湾台北·台北历史博物馆","b":"常玉画的花卉静物。他民国初年去法国学画，画风留在巴黎，作品却大量回到台湾——史博馆是全球藏常玉最多的机构之一。","f":"常玉（1901—1966）；中国台湾台北·台北历史博物馆藏常玉作品数十幅，是其重要收藏；馆藏亦以其裸女题材最为知名。","im":"images/ep15_09.jpg","it":"故宫半解之菊花，还有一段被认为是外来品种的历史","gp":"https://k.sinaimg.cn/n/sinacn10112/443/w753h490/20191004/58f0-ifmectm1192242.jpg/w700d1q75cms.jpg"}]},{"no":"16","t":"山西博物院","loc":"山西太原","it":[{"n":"三棱尖状器","e":"旧石器时代","p":"山西博物院","b":"一块打制成三棱形的石头，横截面是个三角形，底端圆钝便于手握。它是丁村人的\"万能挖掘工具\"，也是山西境内最早的一批人造工具之一。","f":"山西襄汾丁村遗址出土；角页岩打制；器身厚重、左右对称、横断面呈三角形、底部圆钝；约10万年前；因在丁村文化中极其典型，又称\"丁村尖状器\"；山西博物院藏。（山西博物院另藏一件西侯度遗址采集的三棱大尖状器，新测年约距今243万年。）","im":"images/ep16_00.jpg","it":"旧石器三棱大尖状器_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/e61190ef76c6a7ef194b28b6fdfaaf51f3de6635?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"彩陶罐","e":"新石器时代","p":"山西博物院","b":"一口45厘米高的大彩陶罐，上腹用黑彩画弧线和圆点组成花卉纹。仰韶文化庙底沟类型的标准件，也是山西新石器时代彩陶的代表。","f":"高45厘米、口径35厘米、腹径43厘米、底径15.6厘米；泥质红陶、器表磨光；侈口圆唇、短颈、宽肩、上腹突出、小平底；上腹黑彩绘花卉图案；1989年山西芮城金胜庄出土；仰韶文化庙底沟类型；山西博物院藏。","im":"images/ep16_01.jpg","it":"山西博物院 - 维基百科，自由的百科全书","gp":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/32/Yangshao_Miaodigou_ca._4000_BC_Shanxi_Prov_Museum%2C_Taiyuan.JPG/960px-Yangshao_Miaodigou_ca._4000_BC_Shanxi_Prov_Museum%2C_Taiyuan.JPG"},{"n":"彩绘龙盘（彩绘蟠龙纹陶盘）","e":"新石器时代","p":"山西博物院","b":"陶寺遗址出土的红陶盘，盘内画一条盘卷的龙。这是目前所见到的最早的龙纹图像之一，也是\"陶寺是帝尧之都\"这条论证里的重要物证。","f":"山西襄汾陶寺遗址出土；红陶，盘内壁彩绘蟠龙纹；龙山文化陶寺类型；山西博物院藏。","im":"images/ep16_02.jpg","it":"中国龙与西方龙：两个世界的传说与艺术","gp":"http://k.sinaimg.cn/n/sinakd20240209s/115/w863h852/20240209/b11a-89b033bce4e63b958100d10dc1ea72da.jpg/w700d1q75cms.jpg"},{"n":"青铜龙形觥","e":"商代晚期","p":"山西博物院","b":"整体做成一条龙舟的样子，前端是昂起来的龙首。最稀罕的是腹部两侧刻着鼍纹——鳄鱼纹，商周青铜器上极罕见，也让人猜想3000年前的山西是不是真有鳄鱼。","f":"高19厘米、长43厘米、宽13.4厘米；1959年山西石楼桃花者村出土；盖面饰龙纹，腹两侧主纹为鼍纹与夔龙纹，一边一对贯耳；商代晚期方国青铜文化代表，青铜酒器中的孤品；第三批禁止出境展览文物；山西博物院藏。","im":"images/ep16_03.jpg","it":"龙形觥_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/21a4462309f790529822a5f441abc0ca7bcb0b467ffa?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"晋侯鸟尊","e":"西周中期偏早","p":"山西博物院","b":"山西博物院的院徽原型。一只回头的凤鸟，尾巴下卷成象鼻撑地、形成第三个支撑点，背上还有一只小鸟当盖钮。盖内和腹底的\"晋\"字，是迄今发现最早的金文\"晋\"字。","f":"高39厘米（一说通高39厘米）；2000年山西曲沃北赵村晋侯墓地114号墓出土；整体为凤鸟回眸造型，象鼻内卷成第三支点，小鸟为盖钮；盖内与腹底铸铭文\"晋侯作向太室宝尊彝\"9字，是晋国开国的重要物证；出土时已被盗扰碎成百余块，经北京大学团队长期修复；第三批禁止出境展览文物；山西博物院藏。","im":"images/ep16_04.jpg","it":"晋侯鸟尊（山西博物院的“镇馆之宝”）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/bba1cd11728b471096ac5088c3cec3fdfd0323f6?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,w_440"},{"n":"晋侯苏钟（晋侯稣编钟）","e":"西周","p":"山西博物院（2枚）／上海博物馆（14枚）","b":"一套16件的编钟，355字铭文完整记了晋侯苏随周厉王东征的战功。这场战争史书上一个字都没有，全靠这套钟补上。","f":"全套16件，分两组三种式样；16件钟共刻铭文355字，凿刻而成，在西周青铜器中属首见；铭文记西周厉王三十三年晋侯苏率军从周厉王东征东夷并多次受赏；1992年山西曲沃晋侯8号墓地出土；14枚早年被盗后由上海博物馆购回，2枚在山西博物院；比湖北曾侯乙编钟早约400年。","im":"images/ep16_05.jpg","it":"山西博物院图片_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/0d338744ebf81a4c510f555470637759252dd42a085e?x-bce-process=image/watermark,image_d2F0ZXIvYmFpa2UxNTA=,g_7,xp_5,yp_5/format,f_auto"},{"n":"玉组佩（晋侯夫人组玉佩）","e":"西周","p":"山西博物院","b":"204件玉器、玉管、玛瑙管串成的一套大玉佩，复原起来一米五还多，是西周最高等级女性的\"首饰\"。走路时不能让玉相撞出声，这是礼。","f":"1993年山西曲沃北赵村晋侯墓地63号墓出土，墓主一般推定为晋穆侯次夫人；由玉璜、玉珩、玉管、料珠、玛瑙管等共204件组成，其中玉璜45件；复原长约158厘米；是同期墓葬中规模最大的玉组佩；第三批禁止出境展览文物；山西博物院藏。","im":"images/ep16_06.jpg","it":"君子必佩玉，西周贵族佩戴的组玉佩","gp":"http://k.sinaimg.cn/n/front/464/w502h2362/20181225/laHn-hqqzpkv6097428.jpg/w700d1q75cms.jpg"},{"n":"侯马盟书","e":"春秋晚期","p":"山西博物院","b":"5000多片玉片、石片上用朱砂写的盟誓文书，写的是晋国几个家族结盟、互相表忠、断绝旧主关系。中国现存最早的毛笔字实物之一，也是\"歃血为盟\"第一次有了实物。","f":"1965—1966年山西侯马晋国遗址出土；5000余件玉、石片上朱书盟誓文字，可辨识者656件；字体为晋国古文，内容分宗盟类、委质类、纳室类、诅咒类、卜筮类；大多数记公元前497至前489年间赵鞅与诸卿的盟誓；山西博物院藏。","im":"images/ep16_07.jpg","it":"“盟书墨源——侯马盟书文字艺术展”开幕【2】--山西频道--人民网","gp":"https://sx.people.com.cn/NMediaFile/2024/0430/LOCAL1714462266100ZPZZICGA4S.jpg"},{"n":"赵卿墓器物群","e":"春秋晚期","p":"山西博物院","b":"1988年太原金胜村挖出一座大墓，随葬青铜器成套：鸟尊、方壶、虎形灶、大镬鼎，光是升鼎就配了三套。按器物规格墓主用的是诸侯之礼，是\"礼崩乐坏\"的实物注脚。学界一般认墓主是赵简子。","f":"1988年太原金胜村赵卿墓出土；出土3套升鼎（7件、6件、5件各一套）；赵卿鸟尊为昂首鸷鸟形，钩喙可自动开合，背有虎形提梁，尾下设虎形支脚；虎形灶一组7件，含灶体、釜、甑与四节烟筒，通高162厘米；附耳凤螭纹蹄足镬鼎高93厘米、口径102厘米；时代为春秋晚期；山西博物院／山西青铜博物馆藏。","im":"images/ep16_08.jpg","it":"人民日报看山西 | 走进太原市博物馆：感受三晋风韵 品读锦绣龙城_人民日报","gp":"https://cdnjdphoto.aikan.pdnews.cn/zhbj-20241119/image/content/76f4828d3cc84d96b968961bcf34b912.jpg"},{"n":"侯马铸铜遗址陶模陶范","e":"东周","p":"山西博物院","b":"春秋晋国都城新田的\"青铜器工厂\"遗址里挖出来的模具。花纹陶范5000多块，能认出器形的4000多块——从模到范到芯一整套，等于把3000年前的铸造工序摊开给你看。","f":"侯马铸铜遗址发现于1956年；面积估计5000平方米以上；出土陶范陶模3万余块，其中有花纹者5000余块，可辨器形者4000余块，完整工具范103副；另有空首布范芯10万以上；时代为春秋中期以来；山西博物院藏。","im":"images/ep16_09.jpg","it":"古代中国-中国国家博物馆","gp":"https://www.chnmuseum.cn/portals/0/web/zt/gudai/thumb/3/3.23.jpg"},{"n":"铜刖人漆绘盘","e":"战国","p":"山西博物院","b":"盘上画着受过刖刑（砍脚）的人。它把刑罚制度画在了日常器物上，是研究先秦刑法的图像材料。","f":"山西长治分水岭出土；战国；青铜，器身漆绘；山西博物院藏。","im":"images/ep16_10.png","it":"不朽 | 漆与人：贵族生活图漆盘（内含导览招募）-良渚博物院","gp":"https://www.lzmuseum.cn/upload/image/20240312/6384583266175050555473816.png"},{"n":"胡傅酒樽（胡傅温酒尊）","e":"西汉（河平三年，前26年）","p":"山西博物院","b":"一件通体鎏金又加彩的盛酒器，身上画着虎、象、鹿、马。口沿铭文写着\"河平三年造\"，是汉匈和平时期文化交流的实物。","f":"1962年山西右玉大川村出土；高34.7厘米；通体鎏金加彩绘，器身彩绘虎、象、鹿、马等动物，外围三个兽首衔环，下承三虎形足；口沿刻铭文\"勮阳阴城胡傅铜酒樽，重百廿斤，河平三年造\"；现藏山西博物院。","im":"images/ep16_11.jpg","it":"山西博物院馆藏胡傅酒樽-中国文物网-文博收藏艺术专业门户网站","gp":"http://im.wenwuchina.com/upload/2014/07/23/20140723025128688.jpg"},{"n":"雁鱼铜灯","e":"西汉","p":"山西博物院","b":"一只回头衔鱼的鸿雁做成的灯。烟顺着雁颈进入盛水的雁腹，不会熏黑屋子——2000年前的环保设计。灯盘还能转，用来调亮度。","f":"山西襄汾吴兴庄出土；青铜，鸿雁回首衔鱼造型；雁腹中空可贮水，烟尘经鱼、雁颈导入水中；灯盘可转动调节光照角度；西汉；山西博物院藏。","im":"images/ep16_12.jpg","it":"汉雁鱼铜灯_百度百科","gp":"http://baike.baidu.com/cms/s/museum/v2/uploads/28汉雁鱼铜灯原尺寸.png"},{"n":"九人杂技陶俑","e":"北魏","p":"山西博物院","b":"一组九个人的陶俑，摆出各种杂技动作。北魏平城（今大同）时期的随葬明器，反映当时杂技百戏的流行。","f":"山西大同出土；北魏；陶质彩绘；山西博物院藏（陈列于\"民族熔炉\"展厅）。","im":"images/ep16_13.jpg","it":"游走博物馆之——山西博物院 阅山西，尽千年 - 知乎","gp":"https://pic4.zhimg.com/v2-dededc24d4e2c45f531741a3b4f1df43_r.jpg"},{"n":"司马金龙墓木板漆画屏风","e":"北魏太和八年（484）","p":"山西博物院（2块）／大同市博物馆（3块）","b":"北魏司马金龙墓里出的木板漆画屏风，朱漆底、黑漆勾线，配榜题文字画列女故事。1500多年了颜色还鲜亮，画风直追顾恺之，是北朝绘画极稀有的实物。","f":"1965—1966年山西大同石家寨司马金龙墓出土；木质屏风构件，朱漆为地、黑漆勾线，绘《列女传》等故事并附榜题；共出土较完整屏板5块，山西博物院藏2块、大同市博物馆藏3块；北魏太和八年（484）；第一批禁止出境展览文物；山西博物院藏。","im":"images/ep16_14.jpg","it":"不朽 | 司马金龙墓漆画屏风——以漆为媒，1500多年朱颜未改~-良渚博物院","gp":"https://www.lzmuseum.cn/upload/image/20240103/6383988929732866755871095.jpg"},{"n":"鎏金狩猎纹银盘","e":"北魏","p":"山西博物院","b":"一件萨珊波斯风格的鎏金银盘，大同出土（清单记为北魏）。它说明北魏平城时期波斯工艺已经进到中国北方。","f":"山西大同出土；银质鎏金，主题为狩猎纹，具萨珊波斯风格；山西博物院藏品名录中作\"狩猎纹波斯银盘\"；北魏；山西博物院藏。","im":"images/ep16_15.jpg","it":"鎏金龙凤纹银盘_百度百科","gp":"https://bkimg.cdn.bcebos.com/smart/00e93901213fb80e236a749730d12f2eb9389432-bkimg-process,v_1,rw_1,rh_1,pad_1,color_ffffff?x-bce-process=image/format,f_auto"},{"n":"娄睿墓壁画","e":"北齐","p":"山西博物院（原件藏太原北齐壁画博物馆）","b":"北齐娄睿墓的墓室壁画，200多平方米，画了几百匹马，匹匹姿态不同。被称为\"北朝绘画天花板\"，其中一匹枣红马不管从哪个角度看都像在看着你。","f":"山西太原王郭村娄睿墓出土；壁画面积200余平方米，内容含鞍马出行、宴饮、仪仗；北齐；\"娄睿墓鞍马出行图壁画\"列禁止出境展览文物；壁画原件现藏太原北齐壁画博物馆，山西博物院展出高精度复制品。","im":"images/ep16_16.jpg","it":"现场｜大展来袭！山西北朝壁画展首日直击！|壁画|壁画墓|娄睿墓壁画_新浪新闻","gp":"http://n.sinaimg.cn/sinacn20115/290/w1080h810/20191213/7029-ikrsess4628843.jpg"},{"n":"徐显秀墓壁画 + 嵌蓝宝石黄金戒指","e":"北齐","p":"山西博物院（壁画原件藏太原北齐壁画博物馆）","b":"北齐徐显秀墓的壁画，加上墓里捡回的一枚嵌蓝宝石金戒指。戒指上的兽首、联珠纹、宝石上刻的深目高鼻人物，全是粟特一路的东西——一枚戒指讲完一条丝路。","f":"2000—2002年发掘太原王家峰徐显秀墓；墓已被盗数次，在朽棺木间清理出嵌蓝宝石金戒指一枚与素面银指环一枚；金戒指由黄金戒托、指环与宝石戒面组成，重约23.443克，戒面阴雕持杖人物，指环近戒托两端铸怪兽首并饰联珠纹；宝石经鉴定为碧玺（电气石），摩氏硬度7—8；北齐；山西博物院藏。","im":"images/ep16_17.jpg","it":"古人的戒指也是用来求婚的吗？_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/7dd98d1001e9390169979e7075ec54e737d196e2"},{"n":"虞弘墓石椁","e":"隋（592年）","p":"山西博物院","b":"一座汉白玉石椁，做成仿木结构的三开间歇山顶殿堂。椁壁上50多幅浮雕里全是深目高鼻的中亚人、波斯乐舞、祆教祭祀场面。墓主虞弘是西域鱼国人，却在北齐、北周、隋三朝当官。","f":"1999年7月太原晋源区王郭村出土；汉白玉；长约295厘米、宽约220厘米、高约200厘米；由底座、中部墙板和歇山顶三部分组成；椁壁浮雕含宴饮、乐舞、狩猎等中亚题材，中部墙板主图为男女主人对坐庐帐饮酒、六名乐师与胡人舞者；隋代；1999年全国十大考古新发现之一；山西博物院藏。
