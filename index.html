","im":"images/ep16_18.jpg","it":"天下宝藏@山西省博物馆八大镇馆之宝_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/2e2eb9389b504fc2d5627e7b9491f01190ef76c6c732?x-bce-process=image/format,f_auto"},{"n":"开宝藏（晋本）","e":"北宋","p":"山西博物院","b":"北宋官刻的佛教大藏经《开宝藏》，是中国第一部雕版大藏经。全藏早就不存了，全世界零散只余十几卷，山西博物院藏有其中一卷（\"晋本\"）。","f":"北宋元符年间印本；《开宝藏》为中国第一部刻本大藏经，全藏基本散佚，全球存世仅十余卷；山西博物院所藏一卷因刊记地缘称\"晋本\"；山西博物院藏。","im":"images/ep16_19.jpg","it":"晋地宝藏 · 山西博物馆之旅启程，首站山西博物院！视频海报发布_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/3b292df5e0fe9925bc314c9044e449df8db1ca13db95?x-bce-process=image/format,f_auto"},{"n":"金代砖雕二十四孝陶塑","e":"金","p":"山西博物院","b":"金代墓里出的24孝人物砖雕/陶塑，把孝子故事一个一个立起来。晋南金墓砖雕是山西的一大特色，这组是完整的二十四孝。","f":"山西稷山马村金墓出土；金代；砖雕／陶塑，二十四孝人物题材；山西博物院藏。","im":"images/ep16_20.jpg","it":"山西博物院收藏的金代二十四孝陶塑…|二十四孝|陶塑|砖雕","gp":"https://k.sinaimg.cn/n/sinakd20120/600/w1080h1920/20241118/4666-47eb47990b790976d2f32b446f3462ed.jpg/w700d1q75cms.jpg"},{"n":"宝宁寺水陆画","e":"明代","p":"山西博物院","b":"139幅明代水陆画，一堂完整的水陆法会画。全国唯一一套完整存世的明代水陆画，画的是佛道儒和民间诸神。","f":"明代；共139幅；原藏山西右玉宝宁寺；明英宗天顺年间（一说明代中期）绘制，绢本设色；全国现存唯一完整的一套明代水陆画；山西博物院藏。","im":"images/ep16_21.jpg","it":"明代宝宁寺水陆画 山西博物院藏by.foxjin","gp":"https://n.sinaimg.cn/sinacn20112/597/w561h836/20190222/19a9-htknpmh3961448.jpg"}]},{"no":"17","t":"山西青铜博物馆","loc":"山西太原","it":[{"n":"懋尊与懋卣","e":"西周早期","p":"山西青铜博物馆","b":"西周早期青铜酒器一对，器内铸\"武王赐义贝三十朋\"铭文，是罕见记载周武王的青铜器，2019年从境外追缴回国。","f":"西周早期（多数学者倾向成王初年以武王谥号追述）；山西洪洞同一高等级贵族墓被盗，2019年山西警方分别从境外追回，藏山西青铜博物馆；尊、卣同铭\"隹十又三月丁亥，武王赐义贝三十朋，用作父乙宝尊彝\"（23字）；义方彝为国内罕见带提梁方彝；器主\"义\"属商遗民\"丙\"族。","im":"images/ep17_00.jpg","it":"山西青铜博物馆展出的古代青铜器","gp":"https://n.sinaimg.cn/sinacn10106/640/w1600h2240/20190809/7d9c-iaxiufp1344229.jpg"},{"n":"义尊与义方彝","e":"西周早期","p":"山西青铜博物馆","b":"西周早期青铜重器，铭文记周武王赏赐贵族\"义\"贝币三十朋，是极少直接记载武王的青铜器，2019年从境外追回。","f":"西周早期；山西洪洞同墓坑被盗，2019年5月、7月山西警方分别从境外追回，藏山西青铜博物馆；同铭\"武王赐义贝三十朋，用作父乙宝尊彝\"（23字），记丙族后裔\"义\"受武王赏赐；国家一级文物。","im":"images/ep17_01.jpg","it":"义尊、义方彝yí——古代青铜器名品集录 - 知乎","gp":"https://pic4.zhimg.com/v2-ed2299b65f85a8d15e1a84dd7f97583b_r.jpg"},{"n":"晋公盘","e":"春秋","p":"山西青铜博物馆","b":"春秋晋国青铜礼器，盘底铸183字铭文，记晋公嫁女孟姬作陪嫁，是印证晋国历史与联姻的稀有长铭重器。","f":"春秋；山西青铜博物馆藏（2019年从海外追缴回归）；盘底183字铭文，晋公为长女孟姬出嫁所作媵器；盘内浮雕鱼、蛙、蛇、龟等圆雕动物可转动；分铸/失蜡工艺。","im":"images/ep17_02.jpg","it":"新生的山西青铜博物馆丨山右吉金 归去来兮_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/78310a55b319ebc4b74576592c6bd8fc1e178b82b894?x-bce-process=image/format,f_auto"},{"n":"兽面纹铜镈","e":"春秋","p":"山西青铜博物馆","b":"春秋青铜乐钟一套四件，纹饰精美，出自闻喜上郭城址与邱家庄墓群，是山西公安追缴的青铜重器。","f":"春秋；闻喜县上郭城址、邱家庄墓群盗掘出土，山西青铜博物馆藏（追缴）；共四件镈钟，兽首衔凤纹，国家一级文物；最小一件因破损未及倒卖，其余流转京、津、沪、深、港后被追回。","im":"images/ep17_03.jpg","it":"山西青铜博物馆展出的古代青铜器_新浪新闻","gp":"http://k.sinaimg.cn/n/sinacn10106/0/w1333h1867/20190809/b55c-iaxiufp1344383.jpg/w700d1q75cms.jpg?by=cms_fixed_width"},{"n":"水陆攻战纹铜鉴","e":"战国","p":"山西青铜博物馆","b":"战国青铜大盆，腹壁满刻水陆攻战图，再现古代车战、水战、城战，是研究先秦军事的罕见图像资料。","f":"战国；闻喜出土，山西青铜博物馆藏；器腹阴刻水陆攻战、宴乐纹饰，分多层描绘格斗、射杀、划船等场景；青铜鉴为盛水/冰之大器。","im":"images/ep17_04.jpg","it":"宴乐狩猎水陆攻战纹方壶 ···铜壶铜罍 - 知乎","gp":"https://pic3.zhimg.com/v2-28906aeb4615f7a1f129d73c615eefee_r.jpg"},{"n":"蟠蛇纹建鼓座","e":"战国","p":"山西青铜博物馆","b":"战国青铜建鼓座，体积与重量均为全国已出土之最，满饰镂空蟠蛇，是失蜡法铸造的巅峰实物。","f":"战国；山西闻喜县出土（公安机关追缴移交）；直径约77厘米、高47厘米、重约80公斤，为目前国内出土体积最大、最重的青铜建鼓座；蟠蛇相互缠绕镂空，失蜡法铸造。","im":"images/ep17_05.jpg","it":"山西警方追回战国“蟠蛇纹建鼓座”等一批高等级文物--文化--人民网","gp":"http://www.people.com.cn/mediafile/pic/20190312/85/2618065564188577225.jpg"},{"n":"蟠蛇纹镂空鼎","e":"春秋","p":"山西青铜博物馆","b":"春秋青铜鼎，通体镂空蟠蛇纹，用失蜡法铸造，是中国早期失蜡法工艺的重要物证。","f":"春秋；山西新绛县柳泉村1965年出土，山西青铜博物馆藏；鼎身蟠蛇纹镂空，为失蜡法（熔模铸造）早期实物例证。","im":"images/ep17_06.jpg","it":"蛇年寻“蛇”—— 藏在山西博物院里的“蛇”","gp":"http://paper.people.com.cn/rmrbhwb/pc/pic/202502/11/a8f68c50-8171-4e65-8e99-6754cb2279bd.jpg"},{"n":"刖人守囿车","e":"春秋","p":"山西青铜博物馆","b":"春秋青铜\"小车厢\"，可转动的刖足守门人、猴、鸟等，是罕见的青铜机械\"手办\"，反映古刑与工艺。","f":"春秋（或西周晚期）；山西闻喜县上郭村1989年出土，山西青铜博物馆藏；青铜厢式小车，六轮可转动，厢顶立猴、周立鸮鸟，一刖足（断足）守门人；\"刖\"为断足之刑，\"囿\"指苑囿。","im":"images/ep17_07.jpg","it":"西周青铜刖人守囿车_百度百科","gp":"http://baike.baidu.com/cms/s/museum/v2/uploads/12西周青铜刖人守囿车原尺寸.png"},{"n":"雁鱼铜灯","e":"西汉","p":"山西青铜博物馆","b":"西汉青铜灯具，雁衔鱼造型，灯烟经雁颈入腹溶于水，环保设计超前两千年，是新绛追缴文物。","f":"西汉；山西新绛文物案追缴，山西青铜博物馆藏；通高约50厘米，雁回首衔鱼伫立，鱼身、雁腹中空导烟，腹内盛水溶烟尘；错金银/鎏金工艺。","im":"images/ep17_08.jpg","it":"汉雁鱼铜灯_百度百科","gp":"http://baike.baidu.com/cms/s/museum/v2/uploads/28汉雁鱼铜灯原尺寸.png"},{"n":"赵卿墓器物群（追回部分）","e":"春秋","p":"山西青铜博物馆","b":"春秋晋国赵卿（赵简子）墓出土青铜重器群，含礼器、乐器、车马器，是山西东周最丰富的墓葬之一。","f":"春秋晚期；太原金胜村赵卿墓（赵简子墓）1988年发掘，山西青铜博物馆/山西博物院藏；出土青铜器数千件，含镬鼎、升鼎、编镈、编磬、车马器等；此条为展出部分。","im":"images/ep17_09.jpg","it":"一起来逛博物馆：山西青铜博物馆 - 知乎","gp":"https://pic1.zhimg.com/v2-98eb98ef7ec0ce6fa40aa576147dd940_r.jpg"}]},{"no":"18","t":"浙江省博物馆（新版）","loc":"浙江杭州","it":[{"n":"双鸟朝阳纹象牙蝶形器","e":"新石器·河姆渡","p":"浙江省博物馆","b":"河姆渡象牙雕刻，双鸟朝阳图案，是中国最早牙雕艺术品之一，曾参选中国文化遗产标志。","f":"新石器河姆渡文化（约7000年前）；浙江省博物馆藏；象牙雕，正面阴刻同心圆（太阳）与相对双鸟，周饰火焰纹；曾参与\"中国文化遗产标志\"评选但未入选。","im":"images/ep18_00.jpg","it":"双鸟朝阳纹象牙碟形器_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/d833c895d143ad4bd1138a7f58554dafa40f4bfba84e?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_616"},{"n":"朱漆木碗","e":"新石器·河姆渡","p":"浙江省博物馆","b":"河姆渡木胎漆碗，是中国已知最早漆器之一，证明七千年前先民已用天然生漆。","f":"新石器河姆渡文化（约7000年前）；浙江省博物馆藏；木胎朱漆碗，髹漆工艺；比西汉早约4000余年使用天然生漆。","im":"images/ep18_01.jpg","it":"河姆渡文化朱漆木碗_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/63d9f2d3572c11dfa9ecf819fe7b75d0f703918f64ce?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"猪纹陶钵","e":"新石器·河姆渡","p":"浙江省博物馆","b":"河姆渡刻猪纹陶钵，写实猪形象反映原始农耕家畜驯养，是河姆渡文化代表性陶器。","f":"新石器河姆渡文化；浙江省博物馆藏；夹炭黑陶，外壁刻写实猪纹（长嘴鬃毛）；河姆渡遗址出土。","im":"images/ep18_02.jpg","it":"河姆渡“烟火气”文物京城首展_信息提示_首都之窗_北京市人民政府门户网站","gp":"https://www.beijing.gov.cn/fuwu/bmfw/sy/jrts/202311/W020231108350553631142.jpg"},{"n":"玉琮王","e":"新石器·良渚","p":"浙江省博物馆","b":"良渚反山12号墓出土玉琮，体量最大、纹饰最精，神人兽面纹即良渚\"神徽\"，国之重宝。","f":"新石器良渚文化；浙江余杭反山12号墓出土，浙江省博物馆藏；高约8.9厘米、重约6.5公斤，外方内圆，四面刻神人兽面纹（神徽）；良渚玉琮之王。","im":"images/ep18_03.jpg","it":"瞭望丨解码良渚玉琮王-新华网","gp":"https://www.zj.news.cn/20251112/9d170642c5794d7e85e533d0fe87a9f2/202511129d170642c5794d7e85e533d0fe87a9f2_2ff1c7b216e441cb88ef5ffdd1aa9661.jpg"},{"n":"伎乐铜屋","e":"春秋","p":"浙江省博物馆","b":"春秋青铜房屋模型，内铸奏乐俑，是唯一先秦青铜房屋建筑模型，再现越国礼乐场景。","f":"春秋（前770—前476）；绍兴坡塘狮子山306号墓1982年出土，浙江省博物馆藏；面阔三间、进深三间，屋内跪坐六俑奏乐（鼓、笙、琴等）；唯一先秦青铜房屋模型。","im":"images/ep18_04.jpg","it":"浙江省博物馆（浙江杭州综合性博物馆）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/43a7d933c895d143ad4b62736ca895025aafa40fa911?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_352"},{"n":"越王州句剑","e":"战国","p":"浙江省博物馆","b":"战国越王州句（朱勾）青铜剑，剑身错金鸟篆铭文，是越王剑中的精品。","f":"战国；浙江省博物馆藏；越王州句（朱勾）所铸，剑格铭\"戉王州句自乍用佥\"；州句为越王勾践曾孙、不寿之子（前448—前412年在位）。","im":"images/ep18_05.jpg","it":"越王州句复合剑_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/7d989310310b0f12203f2e52?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"彩凤鸣岐七弦琴","e":"唐","p":"浙江省博物馆","b":"唐代雷威制七弦琴，唐琴传世极少，音色苍古，是浙江省博物馆镇馆古琴。","f":"唐；雷威（蜀中斫琴名家）制，浙江省博物馆藏；仲尼式七弦琴，腹款\"大唐开元二年雷威制\"；杨宗稷旧藏，近代誉为\"唐琴第一\"。","im":"images/ep18_06.jpg","it":"唐彩凤鸣岐七弦琴_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/dc854fda6824e2bab7fd48f6?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"鎏金银阿育王塔","e":"五代·吴越","p":"浙江省博物馆","b":"吴越国银塔，出自雷峰塔地宫，内藏佛螺髻发舍利，是五代吴越佛教金工代表。","f":"五代·吴越国（钱俶时期）；杭州雷峰塔地宫2001年出土，浙江省博物馆藏；纯银鎏金，塔身铭文记钱俶造塔供养；内奉释迦螺髻发舍利（佛螺髻发）。","im":"images/ep18_07.jpg","it":"浙江省博物馆十大“镇馆之宝”——从河姆渡到民国的浙地留影_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/730e0cf3d7ca7bcb0a46e548ac477c63f6246b60020c?x-bce-process=image/format,f_auto"},{"n":"鎏金铜释迦牟尼说法像","e":"五代·吴越","p":"浙江省博物馆","b":"雷峰塔地宫鎏金铜佛像，佛座下镇压神兽，体现吴越国佛教造像与护法信仰。","f":"五代·吴越国；杭州雷峰塔地宫2001年出土，浙江省博物馆藏；鎏金铜释迦牟尼说法像，佛结跏趺坐于莲台，台下浮雕神兽/盘龙（\"佛像下镇龙\"）；钱俶造。","im":"images/ep18_08.jpg","it":"文物鎏金铜释迦牟尼佛说法像高清图片下载_红动中国","gp":"https://img.redocn.com/sheying/20170329/wenwujintongshimounifoshuofaxiang_8020893.jpg"},{"n":"彩塑泥菩萨立像","e":"北宋","p":"浙江省博物馆","b":"北宋彩绘泥塑菩萨，出自温州白象塔，神态温润，被誉为\"东方维纳斯\"。","f":"北宋；浙江温州白象塔出土，浙江省博物馆藏；彩绘泥塑菩萨立像，神态安详；被誉为\"东方维纳斯\"。","im":"images/ep18_09.jpg","it":"彩塑泥菩萨立像_百度百科","gp":"https://bkimg.cdn.bcebos.com/smart/b21bb051f81986187904609c49ed2e738bd4e663-bkimg-process,v_1,rw_1,rh_1,pad_1,color_ffffff?x-bce-process=image/format,f_auto"},{"n":"识文描金檀木经函","e":"北宋","p":"浙江省博物馆","b":"北宋檀木经函，识文描金工艺极精，出自慧光塔，是国内罕见宋代识文描金漆器之一。","f":"北宋；浙江瑞安慧光塔（仙岩寺塔）出土，浙江省博物馆藏；檀木胎，识文描金（堆漆描金）经函；国内现存宋代识文描金漆器极罕（仅数件）。","im":"images/ep18_10.jpg","it":"北宋檀木堆漆描金经函_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/f3d3572c11dfa9ec8a139fc57688e003918fa1ec6b92?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"吴兴赋","e":"元","p":"浙江省博物馆","b":"赵孟頫行书《吴兴赋》，盛赞家乡吴兴风物，是其早年辞章名篇，书法圆润遒劲。","f":"元；赵孟頫书并撰，浙江省博物馆藏；行书卷，写吴兴（今湖州）山川人物；赵孟頫（1254—1322）代表书法。","im":"images/ep18_11.jpg","it":"赵孟頫48岁佳作行书《吴兴赋》（一）现藏浙江省博物馆_新浪新闻","gp":"https://n.sinaimg.cn/sinacn20116/754/w640h914/20190530/0bdd-hxsrwwr2510991.jpg"},{"n":"富春山居图·剩山图","e":"元","p":"浙江省博物馆","b":"黄公望《富春山居图》前段，焚画断为两截，此残卷称\"剩山图\"，与台北\"无用师卷\"同源。","f":"元；黄公望（1350年画成）绘，浙江省博物馆藏（剩山图）；原卷清初火殉断为两段，前段\"剩山图\"、后段\"无用师卷\"藏台北故宫。","im":"images/ep18_12.jpg","it":"杭州：《富春山居图》（剩山图卷）亮相浙博-人民图片网","gp":"http://vip-public.people.com.cn/photo/2021/7/23/09f3973b8400451e90bfc26b09520015HowJ_m.jpg"},{"n":"龙泉窑舟形青瓷砚滴","e":"元","p":"浙江省博物馆","b":"元代龙泉窑舟形砚滴，塑成小舟载人，釉色青润，是文房瓷塑佳作。","f":"元；浙江省博物馆藏；龙泉窑烧造，舟形，舱内塑人，釉色粉青；文房水滴（砚滴）。","im":"images/ep18_13.jpg","it":"元龙泉窑舟形砚滴_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/77c6a7efce1b9d1620361ec9f3deb48f8d5464a1?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"万工轿","e":"清","p":"浙江省博物馆","b":"清末宁波朱金木雕花轿，用工逾万、榫卯无钉，号称\"万工轿\"，是浙东婚嫁轿辇之冠。","f":"清（清末民初）；宁波制作，浙江省博物馆藏；朱金木雕，高约275厘米、长150厘米宽90厘米，耗费万余工时，榫卯无钉；聚成号贳器店物。","im":"images/ep18_14.jpg","it":"浙江省博物馆十大“镇馆之宝”——从河姆渡到民国的浙地留影_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/d1a20cf431adcbef76090361bee139dda3cc7cd9310c?x-bce-process=image/format,f_auto"}]},{"no":"19","t":"江西省博物馆","loc":"江西南昌","it":[{"n":"穿孔蚌器","e":"旧石器晚期","p":"江西省博物馆","b":"万年仙人洞出土的穿孔蚌器，伴出最早栽培稻与陶片，是旧石器向新石器过渡的关键证据。","f":"旧石器晚期/中石器时代（约距今2万—1.5万年）；江西万年仙人洞与吊桶环遗址出土，江西省博物馆藏；同遗址出土12000年前栽培稻植硅石（世界最早稻作之一）、约2万年前陶片；穿孔蚌器40余件。","im":"images/ep19_00.jpg","it":"穿孔蚌刀_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/d53f8794a4c27d1ed21be0fbd09fba6eddc451da92f3?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"青铜斝","e":"商","p":"江西省博物馆","b":"吴城遗址出土青铜斝，证明长江以南也存在商代青铜文明，打破\"商文化不过江\"旧说。","f":"商代（吴城二期，约相当于殷墟早期）；江西樟树吴城遗址1973—1974年发掘出土，江西省博物馆藏；青铜斝为酒器，与郑州二里岗商文化特征相近；吴城遗址否定\"商文化不过长江\"。","im":"images/ep19_01.jpg","it":"江西省博物馆（中国江西省南昌市综合性博物馆）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/1e30e924b899a9014c08b6b931ce1d7b02087af45fb2?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_336"},{"n":"大洋洲商墓器物群（新干）","e":"商","p":"江西省博物馆","b":"新干大洋洲商墓1989年出土青铜玉器群，含双面神人、伏鸟双尾虎等，号称\"长江中游青铜王国\"。","f":"商代（约公元前1300年）；1989年江西新干大洋洲出土，江西省博物馆藏；点名器物：活环屈蹲羽人玉佩（通高11.5cm，最早玉羽人）、双面神人青铜头像（通高53cm重4.1kg）、伏鸟双尾青铜虎（通长53.5cm重6.2kg，存世最大先秦青铜虎）、立鹿耳四足青铜甗（通高105cm重78.5kg，\"甗王\"）、兽面纹提梁方腹青铜卣、长纹青铜刀。","im":"images/ep19_02.jpg","it":"南·方——江西新干大洋洲商代大墓出土文物精品展-展厅内景","gp":"https://file.ahm.cn:444/AnHuiMuseum/CMS_Article_Logo/2022-05-31/637896089483031840.jpg"},{"n":"云雷纹兽首提梁黑陶盉","e":"东周","p":"江西省博物馆","b":"东周黑陶酒器，仿铜器造型、蟠曲神兽提梁，贵溪崖墓出土，是研究江南东周文化的珍罕黑陶。","f":"东周（前770—前256）；1979年江西鹰潭贵溪渔塘公社崖墓出土，江西省博物馆藏；通高19.8、口径7.2、足高5厘米；弓形提梁两端塑兽首与卷尾，仿铜黑陶，饰云雷纹。","im":"images/ep19_03.jpg","it":"云观江博瑰宝| ⑦东周云雷纹兽首提梁黑陶盉_崖墓","gp":"http://5b0988e595225.cdn.sohucs.com/images/20200212/1ca39bc8f1dc44929c831d64eb2875a2.jpeg"},{"n":"十三弦木筝","e":"东周","p":"江西省博物馆","b":"东周十三弦木筝，贵溪崖墓出土，是现存最早木制弦乐器实物，把古筝文献记录大幅提前。","f":"东周（春秋战国，约距今2650年）；1979年江西贵溪仙水岩崖墓出土，江西省博物馆藏；长166厘米、宽17.5厘米，梓木刳制，13弦孔；比《史记》李斯\"弹筝\"记载（前237年）早约400年（一说早200余年）。","im":"images/ep19_04.jpg","it":"赣艺探源丨文物里的江西戏曲史（上）|南昌市|江西省|青铜|戏台|戏剧_新浪新闻","gp":"https://k.sinaimg.cn/n/sinakd20230410s/177/w640h337/20230410/fbab-b412476be824ac2186ab5643ed1f9afd.jpg/w700d1q75cms.jpg?by=cms_fixed_width"},{"n":"御仙花金带板","e":"北宋","p":"江西省博物馆","b":"北宋郭知章墓出土金带板，锤揲御仙花高浮雕，是等级最高、物主清楚的宋代金带，号称\"宋代第一带\"。","f":"北宋；1978年江西遂川枚江郭知章墓出土，江西省博物馆藏；一套13块（方銙9、桃形銙1、铊尾1、带扣2），总重943克；御仙花纹（北宋名，南宋称荔枝纹）；郭知章（1039—1114）官至三品；\"宋代第一带\"。","im":"images/ep19_05.jpg","it":"南宋御仙花金带饰_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/3801213fb80e7bec54e7fe95b174ae389b504fc23d36?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_336"},{"n":"黑釉木叶纹盏","e":"宋","p":"江西省博物馆","b":"南宋吉州窑木叶纹盏，桑叶贴釉烧出叶脉，禅茶一味，是吉州窑独创黑瓷绝品。","f":"宋（南宋）；吉州窑（江西吉安永和镇）烧造，1962年南昌市征集，江西省博物馆藏；高5.5、口径14.8、底径3.8厘米，斗笠形，盏内木叶纹；吉州窑独创，存世少。","im":"images/ep19_06.jpg","it":"【宋 宋黑釉木叶兔毫盏】拍卖品_图片_价格_鉴赏_元代以前陶瓷_雅昌艺术品拍卖网","gp":"https://img1.artron.net/auction/2012/art502556/d/art5025560343.jpg"},{"n":"青花釉里红楼阁式谷仓","e":"元","p":"江西省博物馆","b":"元代青花釉里红楼阁谷仓，凌氏墓明器，集四釉彩于一器，是禁止出国（境）展览国宝。","f":"元；后至元四年（1338年）景德镇凌氏墓出土，1979年丰城征集，江西省博物馆藏；通高约29.5厘米，重檐庑殿顶楼阁，塑18俑，背刻159字墓志；青白釉+红釉+青花+釉里红四彩；首批禁止出国(境)展览文物。","im":"images/ep19_07.jpg","it":"元代江西古瓷精品鉴赏（上）|江西省博物馆|高安市|卵白釉_新浪新闻","gp":"http://n.sinaimg.cn/sinacn15/155/w400h555/20180518/c0db-haturfs1373240.jpg"},{"n":"青花松竹梅纹梅瓶","e":"元","p":"江西省博物馆","b":"元青花松竹梅纹梅瓶，岁寒三友图文人气息浓，是国内少见的出土元青花大器。","f":"元；1976年江西波阳县（今鄱阳县，属上饶）出土，江西省博物馆藏；高17、口径5.7、底径5.8厘米；腹部绘松竹梅\"岁寒三友\"，国产青料灰蓝；民窑精品。","im":"images/ep19_08.jpg","it":"【清康熙 青花松竹梅纹梅瓶】拍卖品_图片_价格_鉴赏_清代青花瓷器_雅昌艺术品拍卖网","gp":"https://img1.artron.net/auction/2014/art505545/d/art5055450155.jpg"},{"n":"阳平治都功印","e":"元","p":"江西省博物馆","b":"元代白玉法印，龙虎山张天师世代嗣教信物，螭龙钮显皇家等级，是道教镇坛之宝。","f":"元；1952年江西贵溪县政府移交，江西省博物馆藏；青白玉，通高6.4、边长12.3厘米、重972克；螭龙钮，阳文九叠篆\"阳平治都功印\"六字；历代天师袭用。","im":"images/ep19_09.jpg","it":"张天师的法宝——阳平治都功印_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/a50f4bfbfbedab64034f5384477bb8c379310a55b068?x-bce-process=image/format,f_auto"},{"n":"明代益王墓金玉器","e":"明","p":"江西省博物馆","b":"南城明益王墓出土金玉首饰群，累丝金凤簪等工艺极精，折射明代藩王奢华。","f":"明；江西抚州南城益王墓（益端王朱祐槟夫妇等）出土，江西省博物馆藏；点名器物：累丝金凤簪（长22.5cm重150.5g，永乐二十二年银作局造，1972年益端王彭妃棺出）、凤纹桃形霞帔金坠、金镶玉八仙金钿、青花龙凤鹤纹冠等。","im":"images/ep19_10.jpg","it":"2015玉叶金枝——江西明代藩王墓出土文物精华展","gp":"https://www.njmuseumadmin.com/zt/panwangmu/images/nav8.JPG"}]},{"no":"20","t":"海昏侯国遗址博物馆","loc":"江西南昌新建","it":[{"n":"山羊纹银当卢","e":"西汉","p":"南昌汉代海昏侯国遗址博物馆","b":"海昏侯车马坑银当卢，独角山羊纹饰带西域风格，是汉代丝绸之路文化交流的物证。","f":"西汉；海昏侯刘贺墓车马坑出土，南昌汉代海昏侯国遗址博物馆藏；银质盾形，外缘云气纹，主体独角山羊回首奔跃；银器捶打工艺源自西域，丝路物证。","im":"images/ep20_00.jpg","it":"精美绝伦的古代豪车配置——当卢","gp":"http://k.sinaimg.cn/n/sinakd20200525ac/504/w640h664/20200525/7ab5-itzixrt0492923.jpg/w700d1q75cms.jpg"},{"n":"昌邑籍田青铜鼎","e":"西汉","p":"南昌汉代海昏侯国遗址博物馆","b":"海昏侯墓\"昌邑籍田\"铜鼎，昌邑王亲耕籍田礼器，铭文记容量重量，是昌邑旧物。","f":"西汉；海昏侯刘贺墓出土，南昌汉代海昏侯国遗址博物馆藏；铭文15字\"昌邑籍田 铜鼎 容十斗 重卌八斤 第廿\"；昌邑王（刘髆/刘贺）籍田（亲耕劝农、祭宗庙）礼器。","im":"images/ep20_01.jpg","it":"西汉“昌邑籍田”三足青铜鼎_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/cdbf6c81800a19d8bc3e5ba99ab0958ba61ea8d3e84e?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"刘贺玉印","e":"西汉","p":"南昌汉代海昏侯国遗址博物馆","b":"海昏侯刘贺的和田白玉私印，螭钮阴刻\"刘贺\"，直接确定墓主身份，是核心物证。","f":"西汉；海昏侯刘贺墓主棺内棺刘贺腰际出土，南昌汉代海昏侯国遗址博物馆藏；和田白玉（羊脂白玉），局部浅褐沁，螭纽，阴刻篆书\"刘贺\"二字；方寸之印。","im":"images/ep20_02.jpg","it":"海昏侯墓主系汉武帝之孙刘贺 遗骸腰部现玉印(图)_手机凤凰网","gp":"http://y3.ifengimg.com/a/2016_10/a60c5b38874efb9.jpg"},{"n":"金器（马蹄金/麟趾金/金饼/金板）","e":"西汉","p":"南昌汉代海昏侯国遗址博物馆","b":"海昏侯墓出土金器478件约115公斤，含金饼、马蹄金、麟趾金、金板，创汉墓黄金之最。","f":"西汉；海昏侯刘贺墓出土，南昌汉代海昏侯国遗址博物馆藏；共478件（金饼385、马蹄金48、麟趾金25、金板20），合计约115公斤；纯度约99%（金饼检测99%以上）；马蹄金/麟趾金为汉武帝太始二年（前95年）祥瑞纪念币。","im":"images/ep20_03.jpg","it":"南昌汉代海昏侯国遗址博物馆（江西省南昌市境内的国家一级博物馆）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/21a4462309f7905298229da539aac0ca7bcb0b467fac?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_1000"},{"n":"孔子徒人图漆衣镜+衣镜赋","e":"西汉","p":"南昌汉代海昏侯国遗址博物馆","b":"海昏侯墓孔子衣镜，绘最早孔子像并附《衣镜赋》，也是最早东王公图像，实证西汉崇儒。","f":"西汉；海昏侯刘贺墓主椁室出土，南昌汉代海昏侯国遗址博物馆藏（复制展示，铜镜为真品）；集屏风、衣镜一体\"屏镜\"，镜背绘孔子及颜回、子贡、子路、子羽、子夏等；现存最早孔子像；伴出《衣镜赋》，最早东王公图像（西汉宣帝时）。","im":"images/ep20_04.jpg","it":"海昏之最︱刘贺的儒学修养_澎湃江西_澎湃新闻-The Paper","gp":"https://imgpai.thepaper.cn/newpai/image/1742798205929_byx82Q_1742798368139.jpg?x-oss-process=image/resize,w_1024"},{"n":"竹简（5200余枚）","e":"西汉","p":"南昌汉代海昏侯国遗址博物馆","b":"海昏侯墓出土5200余枚简牍，含失传1800多年的《齐论语》，是《论语》最早抄本之一。","f":"西汉；海昏侯刘贺墓主椁室西北回廊北部出土，南昌汉代海昏侯国遗址博物馆藏；共5200余枚（竹简木牍），含《齐论语》500余枚（\"智道\"即\"知道\"篇题，较今本多《知道》《问王》）；以儒典\"六艺\"为主。","im":"images/ep20_05.jpg","it":"南昌汉代海昏侯国遗址博物馆（江西省南昌市境内的国家一级博物馆）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/a1ec08fa513d269759eed9c660a2a5fb43166c2272ac?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_1000"},{"n":"奏牍（58件）","e":"西汉","p":"南昌汉代海昏侯国遗址博物馆","b":"海昏侯墓近60枚公文奏牍，是刘贺上奏汉宣帝的文书，现存最早上行公文实物。","f":"西汉；海昏侯刘贺墓出土，南昌汉代海昏侯国遗址博物馆藏；约近60枚公文奏牍，内容为刘贺向汉宣帝请示派遣家臣赴长安等；标准西汉上行公文格式。","im":"images/ep20_06.jpg","it":"南昌汉代海昏侯国遗址博物馆（江西省南昌市境内的国家一级博物馆）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/21a4462309f7905298229da539aac0ca7bcb0b467fac?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_1000"},{"n":"海昏侯国除诏书","e":"西汉","p":"南昌汉代海昏侯国遗址博物馆","b":"海昏侯墓出土《除海昏侯国诏》木牍，是首份西汉国除诏书实物，记刘贺死后除国始末。","f":"西汉（神爵三年/前59年）；海昏侯刘贺墓主椁室西室出土，南昌汉代海昏侯国遗址博物馆藏；共25版木牍，自铭\"诏书\"，记刘贺卒（前59年九月初八）后海昏侯国除国；首份西汉国除诏书实物。","im":"images/ep20_07.jpg","it":"南昌汉代海昏侯国遗址博物馆（江西省南昌市境内的国家一级博物馆）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/a1ec08fa513d269759eed9c660a2a5fb43166c2272ac?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_1000"},{"n":"熊形石嵌饰","e":"西汉","p":"南昌汉代海昏侯国遗址博物馆","b":"海昏侯墓熊形石嵌饰，蹲坐招手怪萌神兽，原镶漆樽，形象未见他例，汉代石雕珍品。","f":"西汉；海昏侯刘贺墓主椁室西回廊（西藏椁）出土，南昌汉代海昏侯国遗址博物馆藏；浅灰白灰岩，片状单面浅浮雕，高5.25厘米，蹲坐抚胸招手、似熊面独角；原镶玉漆樽配饰；学界推测为饕餮/畏兽/方相氏/熊。","im":"images/ep20_08.jpg","it":"南昌汉代海昏侯国遗址博物馆（江西省南昌市境内的国家一级博物馆）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/f9dcd100baa1cd11728b30a18c4bdffcc3cec2fd87a3?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_620"},{"n":"釦银贴金人物动物纹漆笥","e":"西汉","p":"南昌汉代海昏侯国遗址博物馆","b":"海昏侯墓银釦贴金漆笥，黑底金银贴花、神仙云气，集多种漆艺，代表西汉漆器巅峰。","f":"西汉；海昏侯刘贺墓西藏椁出土，南昌汉代海昏侯国遗址博物馆藏；长方形委角身、盝顶盖，夹纻胎，黑漆地红漆绘云气，通体贴金银箔（人物、瑞兽纹）；盛梳篦脂粉妆具；釦银（包镶银边）、贴金工艺。","im":"images/ep20_09.jpg","it":"釦银贴金动物纹漆笥_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/203fb80e7bec54e736d11b868a618c504fc2d4623ca8?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,w_504"},{"n":"编钟（钮钟、甬钟）","e":"西汉","p":"南昌汉代海昏侯国遗址博物馆","b":"海昏侯墓编钟两堵24件，钮钟14、甬钟10，标示汉代乐悬规格，音乐考古大发现。","f":"西汉；海昏侯刘贺墓北藏椁乐器库出土，南昌汉代海昏侯国遗址博物馆藏；编钟两堵共24件：鎏金钮钟14件、甬钟10件；配钟虡、磬虡构成轩悬；铁编磬为首次发现。","im":"images/ep20_10.jpg","it":"海昏侯墓里挖掘出了哪些比较独特的文物？ - 知乎","gp":"https://pic1.zhimg.com/e658592ca790e0f1e4999839f0c54bfa_r.jpg?source=1940ef5c"}]},{"no":"21","t":"中国考古博物馆","loc":"北京","it":[{"n":"玉玦","e":"兴隆洼文化（约公元前6200–前5200年）","p":"中国考古博物馆","b":"兴隆洼先民八千年前就磨出这种带缺口的小玉环，是中国迄今所知最早的真玉器，多置于墓主耳旁，堪称\"耳环\"。","f":"内蒙古敖汉旗兴隆洼遗址出土；兴隆洼文化距今约8000年；环状体，一侧有缺口；刘国祥1993年发掘的一对每件约23克；为中国最早的真玉器，见证\"崇玉文化\"起源。","im":"images/ep21_00.jpg","it":"考古发掘品_中国国家博物馆官方网站","gp":"https://www.chnmuseum.cn/zp/zpml/kgfjp/202104/P020221111371875081506.jpg"},{"n":"陶人面像","e":"仰韶文化晚期（距今约7000年）","p":"中国考古博物馆（北首岭出土）","b":"陕西宝鸡北首岭挖出的这件细泥红陶小人头，宽脸直鼻，是我国目前发现最早的人像雕塑，像史前先民给我们留的一张\"照片\"。","f":"1958年陕西宝鸡北首岭遗址出土；仰韶文化晚期；细泥红陶，高7.3厘米、宽9厘米、厚1厘米；双眼口部为长条形镂空，双耳有穿孔；被誉为最早人像雕塑作品。","im":"images/ep21_01.jpg","it":"中国考古博物馆：必打卡，考博全景展示，你觉得有多少件国宝？ - 知乎","gp":"https://pic1.zhimg.com/v2-7c2438bed771ebaa013cb732a6154420_r.jpg"},{"n":"大口陶尊+立鸟异形陶器","e":"大口文化尉迟寺类型（约公元前2800–前2300年）","p":"蒙城县博物馆等","b":"安徽尉迟寺出的大口陶尊身上刻着\"日、月、山\"符号，被视为汉字雏形；同出的鸟形神器造型神秘，被认为是先民的鸟图腾或权杖象征。","f":"安徽亳州蒙城尉迟寺遗址出土；大口陶尊高约60.5厘米、宽35厘米，腹上部刻\"日月山\"形符号；\"立鸟异形陶器\"即考古所称\"鸟形神器\"；属大口文化（尉迟寺类型），距今约5000年；现多藏蒙城县博物馆。","im":"images/ep21_02.jpg","it":"中国收藏网---新闻中心--浙江博物馆里看文物","gp":"http://news.socang.com/NewsImage/2012/02/02/0951216603.jpg"},{"n":"七柱镂空器","e":"龙山文化（约公元前2800–前2300年）","p":"蒙城县博物馆","b":"尉迟寺龙山时期房址里出土七件带七条长腿的镂孔陶器，无法平稳摆放，学者猜是祭祀用的\"谜器\"，是安徽的镇馆之宝之一。","f":"蒙城尉迟寺遗址F37房基出土，共7件；夹砂红陶，通高约42–43厘米、口径12–13厘米、腹径约17厘米；腹部三圆孔贯通，圜底附七支锥足；用途存祭祀、礼器诸说；列安徽省博物馆\"百大镇馆之宝\"。","im":"images/ep21_03.jpg","it":"尉迟寺遗址_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/b21c8701a18b87d6067979b70a0828381f30fd5b?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_586"},{"n":"蛙纹彩陶盆","e":"马家窑文化（约公元前3500–前2000年）","p":"中国考古博物馆","b":"甘肃天水出的这只红陶盆内壁画了只写实的青蛙，四肢舒展，是先民对水神和繁衍的崇拜，也是马家窑彩陶动物纹的代表作。","f":"1981年甘肃天水师赵村遗址出土；马家窑文化（马家窑类型）；泥质红陶，高5厘米、口径16.4厘米、底径6厘米；内壁黑彩绘完整蛙纹，口沿一周黑彩；现藏中国考古博物馆。","im":"images/ep21_04.jpg","it":"（六）蛙纹陶盆-甘肃马家窑彩陶文化博物馆 - 知乎","gp":"https://pica.zhimg.com/v2-5a7372a54d3a7518356561216d6c78e2_1440w.jpg"},{"n":"彩绘龙纹陶盘","e":"陶寺文化（约公元前2300–前1900年）","p":"中国考古博物馆（兼藏社科院考古所、陶寺遗址博物馆）","b":"陶寺大墓里出的蟠龙纹陶盘，龙身带鳞片、嘴衔枝状物，是中原地区所见最早的龙形象标本，被视为华夏龙图腾的重要源头。","f":"1980年山西襄汾陶寺遗址早期王级大墓（M3016、M3072、M2001等）出土，共4件；褐色胎，内壁红白彩绘蟠龙纹；高约9厘米、口径约40.7厘米；2013年列入第三批禁止出国（境）展览文物；现藏中国考古博物馆等。","im":"images/ep21_05.jpg","it":"中国考古博物馆正式向公众开放，多件国宝级文物亮相|考古_新浪财经_新浪网","gp":"https://n.sinaimg.cn/spider20230915/315/w640h475/20230915/122e-f73bdc2ecd9c07a93465b118dd01ee25.jpg"},{"n":"朱书文字扁壶","e":"陶寺文化（距今约4000年）","p":"中国考古博物馆","b":"陶寺出的灰陶扁壶上用朱砂写了两个字，其中一个被公认是\"文\"字，把中国文字实物证据推到甲骨文之前，意义重大。","f":"山西襄汾陶寺遗址出土；泥质灰陶汲水器；壶面朱砂写两处字符，一为\"文\"字，另一字有\"尧\"\"命\"\"邑\"等多种释读；距今约4000年；现藏中国考古博物馆。","im":"images/ep21_06.jpg","it":"朱书扁壶_百度百科","gp":"https://bkimg.cdn.bcebos.com/smart/a686c9177f3e6709c93de6e8359b883df8dcd100ff2a-bkimg-process,v_1,rw_289,rh_252,maxl_578?x-bce-process=image/format,f_auto"},{"n":"绿松石龙形器","e":"二里头文化（距今约3750–3520年）","p":"中国考古博物馆","b":"二里头贵族墓里整取出来的这条绿松石龙，两千多片绿松石拼成，被称为\"华夏第一龙\"，是龙图腾最直接最正统的源头。","f":"2002年河南偃师二里头遗址VM3出土；龙身长64.5厘米、中部最宽4厘米；由2000余片绿松石组合；中部有铜铃，铃内有玉质铃舌；现藏中国考古博物馆，列入禁止出国（境）展览文物。","im":"images/ep21_07.jpg","it":"文明印记——中国珍贵文物影像志丨国之瑰宝“中国龙”-新华网","gp":"https://www.xinhuanet.com/photo/20240208/f69d0d61571d454ab7044c37911ed86e/20240208f69d0d61571d454ab7044c37911ed86e_202402084a2a1f2f747149518b6c1e8035c33dcf.jpg"},{"n":"嵌绿松石兽面纹铜牌饰","e":"二里头文化（约公元前1700–前1500年）","p":"中国考古博物馆","b":"二里头贵族胸前的这件铜牌，青铜框里嵌几百片绿松石拼出兽面，三千多年没掉一片，是中国最早的\"金镶玉\"，把镶嵌工艺史提前千年。","f":"1984年二里头遗址11号墓（VIM11）出土；长16.5厘米、宽8–11厘米；青铜铸框、数百片绿松石镶嵌兽面纹；现藏中国考古博物馆三层展厅；将中国青铜镶嵌工艺起源从春秋战国提前至夏代。","im":"images/ep21_08.png","it":"中国之中：中原古代文明精粹","gp":"https://www.artmuseum.tsinghua.edu.cn/cpsj/zlxx/zlhg/202512/W020260318406786138205.png"},{"n":"玉牙璋/象牙权杖","e":"二里头文化（约公元前1750–前1530年）","p":"中国考古博物馆、二里头夏都遗址博物馆","b":"二里头出的龙形牙璋体型硕大，是夏王朝辐射四方、宣示王权的礼器；同出的象牙权杖等，共同见证中国最早王朝的礼制气象。","f":"玉牙璋（龙牙璋）长48.1厘米、宽11.4厘米，2002年VM3出土，扉牙表现张嘴龙形，二里头共出4件，为高等级贵族专用玉礼器；象牙权杖亦为二里头出土代表性器物；现藏中国考古博物馆（部分在二里头夏都遗址博物馆）。","im":"images/ep21_09.png","it":"考古探源长三角-新华网","gp":"http://zj.news.cn/2022-07/01/1128797137_16566784604341n.png"},{"n":"妇好墓器物群","e":"商代晚期（武丁时期，约公元前13–前12世纪）","p":"中国考古博物馆、殷墟博物馆、国博等","b":"女将军妇好墓没被盗过，陪葬品多得惊人：司母辛方鼎、青铜大钺、嵌绿松石象牙杯、各种玉雕，件件是商代工艺巅峰。","f":"1976年河南安阳殷墟妇好墓出土；司母辛铜方鼎内壁\"司母辛\"三字铭文，现藏殷墟博物馆；妇好青铜钺（虎纹钺重9千克、龙纹钺重8.5千克）；嵌绿松石象牙杯高30.5厘米，列入首批禁止出国（境）展览文物，现藏中国考古博物馆；玉象、玉熊等为商代玉雕精品。","im":"images/ep21_10.jpg","it":"考古发掘品_中国国家博物馆官方网站","gp":"https://www.chnmuseum.cn/zp/zpml/kgfjp/202107/P020220302575591112456.jpg"},{"n":"妇好鸮尊","e":"商代晚期（武丁时期）","p":"中国国家博物馆、河南博物院","b":"妇好墓出的这对猫头鹰造型青铜尊，昂首挺胸，是目前发现最早的鸟形铜酒器，萌中带凶，是商代青铜艺术的代表。","f":"1976年安阳殷墟妇好墓出土，成对；通高约46厘米；一件重117.5千克、另一件重128千克；口下内壁铸\"妇好\"铭文；现分藏中国国家博物馆与河南博物院。","im":"images/ep21_11.jpg","it":"商妇好青铜鸮尊_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/6a63f6246b600c33bf42e80b144c510fd9f9a13d?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_1000"},{"n":"凤鸟纹玉琮","e":"西周（约公元前10世纪）","p":"中国考古博物馆（张家坡出土）","b":"长安张家坡井叔墓出的这件玉琮四面刻凤鸟纹，是西周少有的带纹饰玉琮，线条婉转飘逸，格外珍贵。","f":"1985年陕西长安张家坡M170井叔墓出土；高5.5厘米、边宽4.3厘米；方柱形，中心圆孔，四外壁阴刻凤鸟纹；为西周玉琮中罕见的带纹饰实例；现藏中国考古博物馆（社科院考古所）。","im":"images/ep21_12.jpg","it":"古玉收藏需练眼 说说汉玉上的凤鸟纹-中国文物网-文博收藏艺术专业门户网站","gp":"http://im.wenwuchina.com/upload/2016/07/15/20160715102952222.jpg"},{"n":"铜牺尊（清单作\"铜犀尊\"）","e":"西周中期（约公元前10–前9世纪）","p":"中国考古博物馆","b":"井叔墓出的这件神兽铜尊，马身、双角、带翅膀，身上还趴着龙虎凤鸟，是西周青铜铸造巅峰，也是邓国女子远嫁的陪嫁。","f":"1984年陕西长安张家坡西周井叔家族墓地出土；通高38.8厘米、通长41.4厘米；盖内底与腹内各有六字铭文\"邓仲作宝尊彝\"；造型似马非马、腹有双翼，背钮立凤鸟，项背附卷尾虎，胸臀各回首卷尾龙；现藏中国考古博物馆，为该馆镇馆之宝之一。","im":"images/ep21_13.jpg","it":"中国考古博物馆_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/9922720e0cf3d7ca7bcb2efaf644a9096b63f72403be?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_973"},{"n":"错金铜豹镇","e":"西汉（公元前206–公元25年）","p":"河北博物院、中国考古博物馆","b":"满城汉墓窦绾墓出的四只小铜豹，错金豹斑、玛瑙红眼，是压席角的席镇，掌心大小却工艺极致，憨态可掬。","f":"1968年河北满城陵山二号汉墓（中山靖王刘胜妻窦绾墓）出土，共4件；高3.5厘米、长5.9厘米；通体错金银饰梅花状豹斑，双目嵌白玛瑙（因粘料含朱砂显红色），体内灌铅稳重；两件藏河北博物院、两件藏中国考古博物馆。","im":"images/ep21_14.jpg","it":"错金豹形器座 - 河南博物院","gp":"https://www.chnmus.net/images/attachement/jpg/site2/20120628/2c4138aa3db611565dc606.jpg"},{"n":"王莽封禅玉牒","e":"新莽（公元8–25年，制于约公元12年）","p":"中国考古博物馆","b":"王莽准备封禅泰山、与天沟通的玉牒，因封禅未成留在长安，是迄今发现的唯一一件皇帝\"通天\"实物，学术价值极高。","f":"2001年出土于汉长安城桂宫四号建筑遗址；青石质，残长13.8厘米、宽9.4厘米、厚2.7厘米；阴刻篆隶涂朱，存5行29字（含\"封泰山，新室昌\"）；新莽时期（王莽）；因王莽封禅未行而留置长安；现藏中国考古博物馆。","im":"images/ep21_15.jpg","it":"五大夫翳刻石非新莽时物辨-光明日报-光明网","gp":"https://epaper.gmw.cn/gmrb/images/1/20250811/1754856888938_1.jpg"},{"n":"熹平石经残石","e":"东汉熹平四年（公元175年始刻）","p":"中国国家博物馆、西安碑林、辽宁省博物馆等多家","b":"蔡邕等人主持刊刻的儒家七经石碑，原立洛阳太学，是中国第一部官定石经，战乱后只剩残石散藏各地。","f":"东汉灵帝熹平四年（175年）由蔡邕等奏请刊刻，至光和六年（183年）成，共46碑，隶书刻《诗》《书》《易》《仪礼》《春秋》《公羊传》《论语》七经，原立洛阳太学；汉末战乱及后世迁徙致损毁；残石分藏中国国家博物馆、西安碑林、上海博物馆、洛阳博物馆、辽宁省博物馆等。","im":"images/ep21_16.jpg","it":"“熹平石经”残石-中国文物网-文博收藏艺术专业门户网站","gp":"http://im.wenwuchina.com/upload/2018/04/17/20180417025603289.jpg"},{"n":"鎏金錾花九曲银勺/金银平脱对鸟纹铜镜","e":"唐（公元7–10世纪）","p":"中国考古博物馆","b":"偃师唐墓出的九曲银勺，勺面如花瓣、柄尾是凫头，錾刻宝相花雀鸟，鎏金灿然；同期的金银平脱铜镜是唐代奢华工艺代表。","f":"鎏金錾花九曲银勺1984年出土于河南偃师杏园唐墓（墓主李景由，开元五年/717年卒，开元二十六年/738年合葬），全长24.4厘米，勺柄末端凫头形，勺面九曲花瓣状，鱼子纹地錾尖瓣宝相花及雀绕花枝，现藏中国考古博物馆；金银平脱为唐代铜镜典型工艺，对鸟纹为常见题材。","im":"images/ep21_17.jpg","it":"内蒙古日报数字报-金银平脱铜镜 映照盛唐奢华","gp":"https://szb.northnews.cn/nmgrb/resfile/2023-05-11/12/2722997_an_1682326669885_s.jpg"},{"n":"唐哀帝即位册","e":"唐天祐年间（公元904–907年）","p":"中国考古博物馆","b":"唐哀帝李柷即位时刻的玉册，是目前唯一完整传世的唐代皇帝即位玉册，见证了晚唐政权更迭和朱温篡唐。","f":"1990年出土于隋唐洛阳城宫城应天门遗址（洛阳西工区）；玉版制成，长28.5厘米、宽27–31厘米；唐天祐年间（904–907）镌刻；为现存唯一完整的唐代即位玉册；现藏中国考古博物馆。","im":"images/ep21_18.jpg","it":"唐哀帝即位玉册_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/4bd1e803d1a7e6633912bbe4?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"近现代文献（孙中山对联、鲁迅仙台入学公函、毛泽东《湘江评论》创刊号、陈望道译《共产党宣言》初版）","e":"清末至民国（1904–1920年）","p":"中国考古博物馆（民族觉醒展区）","b":"中国考古博物馆\"民族觉醒\"展区收了一批近代文献原件：孙中山题词、毛泽东《湘江评论》创刊号、陈望道译《共产党宣言》首版等，见证思想启蒙。","f":"展区展出孙中山题词手迹、《湘江评论》创刊号（毛泽东，1919年）、陈望道译《共产党宣言》首个中文全译本（1920年出版，俗称\"蓝头本\"）等；鲁迅1904年入仙台医学专门学校相关文献亦属近代留学与思想传播史料；均藏于中国考古博物馆\"民族觉醒\"专题展。","im":"images/ep21_19.jpg","it":"走进中国考古博物馆 迎文化和自然遗产日","gp":"http://www.news.cn/culture/20240607/37da4263d66448adac1263b5b214dba5/2024060737da4263d66448adac1263b5b214dba5_202406074debb450acd24c01b3a8f3901a697fe2.jpg"}]},{"no":"22","t":"辽宁省博物馆","loc":"辽宁沈阳","it":[{"n":"金牛山人少女头骨+骨鱼镖","e":"旧石器时代（距今约26万年）","p":"辽宁省文物考古研究院（常展于辽宁省博物馆）","b":"营口金牛山挖出的这具完整古人类少女骨架，把东北人类史推到26万年前，是直立人向智人过渡的罕见标本。","f":"1984年辽宁营口大石桥金牛山A点洞穴出土，属同一20岁左右女性个体（56块骨骼）；距今约26万年，旧石器时代早期；伴出石器30余件、用火灰烬层及大量哺乳动物化石；填补我国晚期直立人向早期智人过渡的空白，为全国重点文物保护单位。","im":"images/ep22_00.jpg","it":"辽宁营口金牛山遗址","gp":"http://www.ncha.gov.cn/picture/0/2203172342123584944.jpg"},{"n":"之字纹陶罐/龙纹陶片","e":"查海文化（距今约8000年）","p":"辽宁省博物馆","b":"查海遗址陶罐上压印着\"之\"字纹，同出的石堆塑龙被誉为\"中华第一龙\"，是辽河文明八千年的源头。","f":"辽宁阜新查海遗址出土，查海文化距今约8000年；陶器饰压印之字纹；遗址内发现红褐色石块堆塑龙形（长约19.7米），被誉为\"中华第一龙\"（之一），是迄今最早龙形象之一。","im":"images/ep22_01.jpg","it":"考古发掘品_中国国家博物馆官方网站","gp":"https://www.chnmuseum.cn/zp/zpml/kgfjp/202008/P020220802364217117881.jpg"},{"n":"煤精制品","e":"新乐文化（距今约7200年）","p":"辽宁省博物馆","b":"新乐遗址出土的这些煤精雕刻小件，是七千年前沈阳先民的原始艺术品，也是罕见的史前煤雕实物。","f":"1973年辽宁沈阳新乐遗址下层出土，新乐文化距今约7200年；原料为煤精（煤玉），雕成耳坠、圆泡等小件装饰品；为我国迄今发现最早的煤雕制品之一。","im":"images/ep22_02.jpg","it":"在博物馆里读懂百年开滦的悠久历史-新华网河北频道-新华网","gp":"https://www.he.news.cn/20231019/388e0222162b48e48fd96d8663cdd83c/20231019388e0222162b48e48fd96d8663cdd83c_2023101995c950558ff9486ea1309095d2a6ab52.jpg"},{"n":"玉龙（红山C形龙）","e":"红山文化（距今约5500–5000年）","p":"辽宁省博物馆（玉猪龙）/中国国家博物馆（C形龙）","b":"红山文化的玉龙蜷曲如环、被誉为\"中华第一龙\"，是五千年玉龙崇拜的源头，辽博镇馆之宝玉猪龙即其代表。","f":"红山玉龙分两类：C形碧玉龙（1971年赤峰翁牛特旗三星他拉出土，通高26厘米，现藏中国国家博物馆）；玦形龙（玉猪龙，牛河梁等红山墓葬出土，辽宁省博物馆藏）。红山文化距今约5500–5000年。","im":"images/ep22_03.jpg","it":"“何以中国”第四展，五千多年红山玉龙现身上海博物馆_古代艺术_澎湃新闻-The Paper","gp":"https://imgpai.thepaper.cn/newpai/image/20250620/b7e8e206-3963-43fe-b6e3-2b940cc16e10.jpg"},{"n":"女神头像","e":"红山文化（牛河梁女神庙，距今约5500–5000年）","p":"辽宁省博物馆","b":"牛河梁女神庙出土的泥塑女神头像，双目嵌玉、神态庄严，是五千年前红山先民祭祀\"女神\"崇拜的实证。","f":"辽宁凌源、建平交界的牛河梁遗址女神庙出土，红山文化晚期（距今约5500–5000年）；泥质红陶，残高约22.5厘米，双眼嵌淡青色圆玉片，鼻梁挺直，是世界最早真人大小的女神塑像之一。","im":"images/ep22_04.png","it":"辽博推出开年大展“漫步美中——古罗马时期女性主题文物展”-国际在线","gp":"https://v2.cri.cn/286401a0-4e98-4bfb-bde8-38b2e8cb7a51/image/6ce5d468bd314fc3ac31efd35cad4c98.550x825.png"},{"n":"彩陶筒形器","e":"红山文化（牛河梁，距今约5500–5000年）","p":"辽宁省博物馆","b":"牛河梁积石冢上成排摆放的彩陶筒形器，无底中空、用途成谜，被认为是红山祭天礼器的组成部分。","f":"牛河梁红山文化遗址积石冢出土；泥质红陶，筒形、无底、上部施黑彩弦带与三角纹；多成排立于冢界，用途或为沟通天地的祭祀器，具体功能学界仍有争议。","im":"images/ep22_05.png","it":"中华文明的辉煌见证——马家窑文化彩陶珍品欣赏","gp":"https://www.gsyongjing.gov.cn/cms_files/filemanager/813956128/picture/20246/9c9262f18ee449468c7074d8ebafc908.png"},{"n":"双人首三孔玉梳背饰/双枭玉佩","e":"红山文化（牛河梁）","p":"辽宁省博物馆","b":"牛河梁出土的这些精美玉饰，双人首三孔、双枭造型奇特，是红山贵族头饰与佩玉工艺的巅峰之作。","f":"牛河梁红山文化墓葬出土；双人首三孔玉梳背饰为佩饰构件，双枭形玉佩为红山典型动物玉雕；现藏辽宁省博物馆（部分藏辽宁省文物考古研究院）。","im":"images/ep22_06.jpg","it":"【红山文化 玉雕双人首三孔器（小缺 断粘）】拍卖品_图片_价格_鉴赏_玉石器其它_雅昌艺术品拍卖网","gp":"https://img1.artron.net/auction/2021/art518304/d/art5183040001.jpg"},{"n":"商代者方鼎","e":"商代晚期（喀左北洞窖藏）","p":"辽宁省博物馆","b":"喀左北洞窖藏出土的商代铜方鼎，腹内长铭记载贵族祭祀，是辽西商代方国文明的重要见证。","f":"辽宁喀左县北洞村窖藏出土（北洞1号窖藏，1973年）；通称\"㠱（jì）侯方鼎\"，旧或释\"者方鼎\"；腹内壁铸铭文约24字，记㠱侯作器事；为商代晚期青铜重器。","im":"images/ep22_07.jpg","it":"地理基础与研究路径：观察商代文明的新窗口-光明日报-光明网","gp":"https://epaper.gmw.cn/gmrb/images/2025-01/18/10/res1011_attpic_brief.jpg"},{"n":"青铜罍","e":"商代晚期（喀左北洞2号窖藏）","p":"辽宁省博物馆","b":"喀左北洞二号窖藏的这件蟠龙盖青铜罍，造型瑰丽、卷体夔龙盖夺人眼目，是辽博商周青铜的镇馆重器。","f":"1973年辽宁喀左北洞2号窖藏出土；通称\"卷体夔纹蟠龙盖铜罍\"，通高40余厘米，盖铸蟠龙；为商代晚期青铜器，辽宁省博物馆珍藏，属该馆商周青铜代表藏品。","im":"images/ep22_08.jpg","it":"辽宁省博物馆藏西周青铜器 - 知乎","gp":"https://pic4.zhimg.com/v2-b9a768974c787f688f66608efe1e4a89_1440w.jpg"},{"n":"伯爵甗/鱼尊/鱼卣","e":"商代晚期（喀左山湾子等）","p":"辽宁省博物馆","b":"喀左山湾子窖藏一次出土二十余件商周铜器，伯某所作甗、鱼形尊卣造型别致，彰显辽西青铜礼器之盛。","f":"1974年辽宁喀左山湾子窖藏出土，共22件青铜礼器；含\"伯矩甗\"（或某伯所作甗）、鱼尊、鱼卣等，多带族氏铭文；现藏辽宁省博物馆。","im":"images/ep22_09.jpg","it":"辽宁省博物馆：辽宁历史，满族风俗 - 知乎","gp":"https://pic3.zhimg.com/v2-535507b4e22b629c06052093663a2ef0_1440w.jpg"},{"n":"燕王职戈","e":"战国（北票东官营子）","p":"辽宁省博物馆","b":"北票出土的这件青铜戈刻\"郾王职\"铭文，证其为燕昭王之物，可补《史记》燕国世系之缺。","f":"1967年辽宁北票东官营子出土；援部铭\"郾（燕）王职乍（作）御司马\"；\"职\"即燕昭王（名职）；是研究燕国兵器与历史的重器，现藏辽宁省博物馆。","im":"images/ep22_10.jpg","it":"战国燕王职戈_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/5327ce16b2bda57f962b4325?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"金柄青铜短剑","e":"战国（建昌东大杖子）","p":"辽宁省文物考古研究院","b":"建昌东大杖子出的这把黄金剑柄曲刃短剑，是\"辽宁式铜剑\"标杆，见证战国辽西族群与燕文化交融。","f":"葫芦岛建昌县东大杖子战国墓出土；通长43厘米，剑柄呈T形喇叭筒状、以黄金失蜡法熔铸，嵌磁铁矿石加重器；剑身琵琶形曲刃，属东北系（辽宁式）曲刃青铜短剑；现藏辽宁省文物考古研究院（辽宁省博物馆常借展）。","im":"images/ep22_11.png","it":"东大杖子古墓群","gp":"https://whly.ln.gov.cn/eportal/fileDir/data/lnswhlyt/W020200827546536800792.png"},{"n":"毌丘俭纪功碑","e":"曹魏（正始年间）","p":"辽宁省博物馆","b":"吉林集安出土、辽博珍藏的这通残碑，是曹魏毌丘俭征高句丽的纪功刻石，现存最早东北边疆石刻文献。","f":"清光绪年间（1904/1906）吉林集安板岔岭（板石岭）修路时发现；残长39厘米、宽30厘米、厚8.5厘米，赭红色含石英粒岩石，隶书阴刻存7行约50字，记正始三年高句丽反、五年出兵、六年凯旋；王国维《观堂集林》详考；现藏辽宁省博物馆，国家一级文物。","im":"images/ep22_12.jpg","it":"新疆博物馆10号展厅：黄龙元年简和格登山纪功碑 - 知乎","gp":"https://pic4.zhimg.com/v2-3f8cc2f5fafd4c0fb683b25d81440d79_1440w.jpg"},{"n":"范阳公章金印","e":"北燕（冯素弗墓）","p":"辽宁省博物馆","b":"北燕权臣冯素弗墓出的龟钮金印，含金量八成以上，是确认墓主身份、十六国金印孤例的稀世之宝。","f":"1965年辽宁北票西官营子冯素弗墓出土；金质龟钮，通宽2.6厘米、印面2.27×2.35厘米、通高1.9厘米、重100克（一说70克），含金量80%–85%；印文篆书阴文\"范阳公章\"；为十六国北燕时期金印仅见实例，现藏辽宁省博物馆。","im":"images/ep22_13.jpg","it":"范阳公章印_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/10dfa9ec8a1363276b19d57d918fa0ec09fac783?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"鎏金木芯马镫","e":"北燕（冯素弗墓）","p":"辽宁省博物馆","b":"冯素弗墓出的这副鎏金木芯马镫，是全世界有绝对年代可考的最早双马镫，改写骑兵史、影响中世纪欧洲。","f":"1965年辽宁北票冯素弗墓出土；以桑木条揉成镫圈、外包鎏金铜片，公元415年（北燕太平七年）有明确纪年；是迄今唯一有绝对年代可考的世界最早完整双马镫实物；现藏辽宁省博物馆。","im":"images/ep22_14.jpg","it":"跨越28万年！这项展览用文物见证各民族交融共生 - 新华网客户端","gp":"https://xhsc.app.xinhuanet.com/cms/article/image/ce94a5f0afa442d4b986142519decf1a.jpeg"},{"n":"鸭形玻璃注","e":"北燕（冯素弗墓）","p":"辽宁省博物馆","b":"冯素弗墓出的这件鸭形玻璃注，是古罗马钠钙玻璃沿草原丝路输入的孤例，全世界仅此一件。","f":"1965年辽宁北票冯素弗墓出土；长20.5厘米、腹径5.2厘米、重约70克，淡绿色半透明；成分为钠钙玻璃（罗马玻璃），无模自由吹制成型；重心设计使其半水方稳，用途有欹器/计时器/盛物诸说；首批禁止出国（境）展览文物；现藏辽宁省博物馆。","im":"images/ep22_15.jpg","it":"辽宁省博物馆· 北燕时期鸭形玻璃注|辽宁省博物馆|北燕|冯素弗墓|玻璃条|雏鸭_新浪新闻","gp":"https://n.sinaimg.cn/sinacn17/798/w958h640/20180704/8946-hevauxk3968819.jpg"},{"n":"花树状金步摇","e":"三燕（北票房身村/冯素弗墓）","p":"辽宁省博物馆","b":"三燕慕容鲜卑的金步摇，纯金打造、行步摇颤，是辽西鲜卑贵族身份象征，也是草原丝路东西交融的见证。","f":"辽宁北票房身村（1957年，高27.3厘米）与北票冯素弗墓（1965年，通高约26厘米冠饰）均有出土；含金量85%–92%；由顶花与笼冠梁架构成，缀极薄金叶，步则摇颤；现藏辽宁省博物馆（国内慕容鲜卑步摇最集中，共16件）。","im":"images/ep22_16.jpg","it":"花树状金步摇 - 知乎","gp":"https://pic2.zhimg.com/v2-a77a60a1dcaa194916b480de5b6b84d7_1440w.jpg"},{"n":"摩羯纹水盂","e":"五代（北票水泉1号辽墓）","p":"辽宁省博物馆","b":"北票水泉辽墓出的五代耀州窑摩羯形水盂，龙鱼合体、青釉莹润，是耀州窑断代的标准器和禁出文物。","f":"1971年辽宁北票水泉1号辽墓出土；高9.3厘米、长14厘米、宽7.4厘米；通体作龙鱼形（摩羯），白瓷胎施青釉；2013年列入第三批禁止出国（境）展览文物；现藏辽宁省博物馆。","im":"images/ep22_17.jpg","it":"五代耀州窑摩羯形水盂_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/ac345982b2b7d0a20cf4d4d9b9b761094b36acaf2c64?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_416"},{"n":"绿釉贴团龙菊花纹双孔鸡冠壶","e":"辽代（北票）","p":"辽宁省博物馆","b":"辽代陶瓷仿皮囊容器的代表作，绿釉上贴塑团龙与菊花，鞍形双孔便于系带，见证契丹与中原交融。","f":"辽宁北票市出土；高29.5厘米、口径5.9厘米；红陶胎施绿釉不及底，扁体垂腹、管状短流、双鼻孔系，外侧塑贴坐猴；器表一面团龙卷云、一面折枝菊花流云；辽宁省博物馆一级文物。","im":"images/ep22_18.jpg","it":"辽绿釉贴团龙菊花纹双孔鸡冠壶_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/b21bb051f8198618367ae30df0ba39738bd4b21c48b8?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_1000"},{"n":"白瓷盘口长颈注壶","e":"辽代（法库叶茂台7号墓）","p":"辽宁省博物馆","b":"法库叶茂台辽墓出的这对白瓷注壶，壶里竟封存着千年辽代古酒，是国内首次发现的液态古酒。","f":"1974年辽宁法库叶茂台7号辽墓出土，同出两件白瓷盘口长颈注壶；壶内保存约多半壶淡黄色液体，化验含微量乙醇，证为千年古酒（蒸馏酒说）；现藏辽宁省博物馆。","im":"images/ep22_19.jpg","it":"白瓷长颈瓶_中国国家博物馆官方网站","gp":"https://www.chnmuseum.cn/zp/zpml/kgfjp/202112/P020211203373436762200.jpg"},{"n":"双陆棋","e":"辽代（法库叶茂台7号墓）","p":"辽宁省博物馆","b":"叶茂台辽墓出的这套双陆棋具，木板配三十枚棋子，是中国出土唯一完整的古代双陆实物。","f":"辽宁法库叶茂台7号辽墓出土；木板长52.8厘米、宽25.7厘米、高1.6厘米，棋子高4.6厘米；由双陆板与三十枚双陆子组成，两面各六\"梁\"；是目前中国出土唯一完整的古代双陆实物；现藏辽宁省博物馆。","im":"images/ep22_20.jpg","it":"古画中的冬景与运动，辽博展《明皇击球图卷》等_古代艺术_澎湃新闻-The Paper","gp":"https://imagecloud.thepaper.cn/thepaper/image/176/892/643.jpg"},{"n":"北宋交子旧版拓存","e":"北宋（交子，拓存清制）","p":"四川省博物院","b":"这纸交子拓存是世上最早纸币——北宋交子的唯一实物见证，竖版图文兼备，其\"防伪\"风俗画为首创。","f":"清代以制作交子的原始印版拓印而成，国内仅此一件；竖长版面，上部十个方孔圆钱符号、中部29字（\"除四川外，许于诸路州县……同见钱七百七十陌流转行使\"）、下部宋代风俗画；是世界最早纸币交子的唯一实物资料。","im":"images/ep22_21.jpg","it":"辽博展出世上唯一“交子”拓片-动态-浑南区人民政府","gp":"http://www.hunnan.gov.cn/files/ueditor/HNQZF/jsp/upload/image/20210416/1618536576655047972.jpg"},{"n":"缂丝紫鸾鹊谱图","e":"北宋","p":"辽宁省博物馆","b":"北宋缂丝《紫鸾鹊谱》纵逾1.3米，是现存最大最完整的宋缂丝，鸾鹊穿花、紫地烂漫，一寸缂丝一寸金。","f":"纵131.6（一说132）厘米、横55.6厘米；紫色经丝地上分区段挖花缂织，每组五横排花鸟，鸾鹊展翅、牡丹佛莲相衬；采用通经断纬技法，可两面观；传为北宋定州/宣和制品，作者未详；现藏辽宁省博物馆（辽博共藏3件）。","im":"images/ep22_22.jpg","it":"紫鸾鹊谱_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/d57e9994364c570dd21b7086?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"大晟编钟","e":"北宋（宋徽宗）","p":"辽宁省博物馆","b":"宋徽宗铸的\"大晟\"编钟，靖康之变被金人掠往上京，钟唇金代刻款，是北宋雅乐与亡国之乱的双重见证。","f":"北宋徽宗崇宁三至四年（1102–1106）京师所铸；辽博藏\"大晟南吕编钟\"高27.9厘米、宽18.45厘米，青铜合瓦形，正面刻\"大晟\"、背面刻\"南吕中声\"、钟唇刻\"上京都僧录官押\"；靖康二年（1127）被金掠至会宁府；现藏辽宁省博物馆，存世大晟编钟二十余件。","im":"images/ep22_23.png","it":"“箫韶九成”：辽博聚焦中国古代音乐文物_凤凰网","gp":"https://x0.ifengimg.com/res/2023/6FC4AC0EBBD3274AEF52272FDB81F056EEBAE0E4_size321_w600_h402.png"},{"n":"元青花八棱罐","e":"元代（鞍山征集）","p":"辽宁省博物馆","b":"鞍山民间曾用来腌咸鸭蛋的这件元青花八棱罐，松竹梅满工、全球仅两件，是辽博从民间征集的镇馆之宝。","f":"1977年辽宁鞍山征集（原为民间腌蛋容器）；通高39.7厘米、口径15.3厘米，八棱罐体，肩部对称堆塑兽首耳，苏麻离青料；腹部八面绘松竹梅\"岁寒三友\"与莲池鸳鸯；全球仅两件（另一件出土于泰国）；国家一级文物，新中国首件民间征集的元青花；现藏辽宁省博物馆。","im":"images/ep22_24.jpg","it":"辽博镇馆之宝组团出镜-新华网辽宁频道","gp":"http://ln.news.cn/20250731/25795546506744ada7f666aafaac2aa4/2025073125795546506744ada7f666aafaac2aa4_2025073184db760554aa4637b3f61a7fe45a8c9d.jpg"},{"n":"白地黑花龙凤纹大酒罐","e":"元代（绥中三道岗沉船）","p":"辽宁省博物馆","b":"绥中三道岗元代沉船出水的磁州窑白地黑花龙凤罐，黑白分明、龙凤呈祥，是宋元海贸外销瓷的实证。","f":"辽宁绥中三道岗元代沉船遗址（1993年全国十大考古新发现）出水；元代磁州窑白地黑花器，罐身一面龙纹、一面凤纹，构成龙凤呈祥；同船出水文物2000余件，多为磁州窑产品；现藏辽宁省博物馆（部分藏葫芦岛市博物馆），国家一级文物。","im":"images/ep22_25.jpg","it":"【中国纹样】龙爪究竟有几根？ - 知乎","gp":"https://pic3.zhimg.com/v2-ca4def6090543f8ee2280a655a95d2fc_r.jpg"}]},{"no":"23","t":"北京故宫博物院","loc":"北京","it":[{"n":"亚丑方尊","e":"商代晚期（约公元前13–前11世纪）","p":"故宫博物院","b":"故宫\"青铜之宝\"亚丑方尊方形四角立象首，腹内九字铭文记亚族祭祀，是商代方尊中的巨制重器。","f":"商代晚期青铜盛酒器，清宫旧藏，现藏故宫博物院；高约45.5厘米、口径约33.6厘米、重约21.5千克；肩四角各饰象首，通体兽面纹、夔纹，以雷纹为地；口内侧铸2行9字铭文\"亚（酗）者（司）以大子尊彝\"，意为亚族祭祀王后太子之宝器；传世的亚器有数十件，多带\"亚丑\"族徽。","im":"images/ep23_00.jpg","it":"亚丑方尊_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/034965f4854be2f8f2d38599?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"平复帖","e":"西晋（公元3世纪）","p":"故宫博物院","b":"陆机《平复帖》是传世最早的名家墨迹，麻纸草书九行，被称为\"法帖之祖\"，是书法史开山之作。","f":"西晋陆机（261–303）书，纸本（麻纸）草书，9行约84–86字，无款，内容为一封问候友人的书札；入清为乾隆、嘉庆内府所藏，后归恭亲王奕訢、溥儒，1937年张伯驹重金购得并于1956年捐献；现藏故宫博物院，为禁止出国（境）展览文物；是现存最早的名家书法墨迹真迹。","im":"images/ep23_01.jpg","it":"北京故宫博物院“10大镇馆之宝”！你最欣赏哪一个？ - 知乎","gp":"https://picx.zhimg.com/v2-d1537fc4c6d33e7a4987af8686adf9f7_1440w.jpg"},{"n":"清明上河图","e":"北宋（张择端）","p":"故宫博物院","b":"张择端《清明上河图》长卷描绘汴京清明市井繁华，是北宋社会的全景式百科，中国十大传世名画之一。","f":"北宋张择端绘，绢本设色手卷，纵24.8厘米、横528.7厘米；以散点透视绘汴河两岸城郊、虹桥、城门内外商贸百业与数百人物；曾入北宋、金、元、明清内府，清亡后流出，1950年代由东北博物馆（今辽博）收得后调拨故宫；现藏故宫博物院，禁止出国（境）展览文物；历来有\"季节之谜、作者之谜、描绘地点之谜\"诸说。","im":"images/ep23_02.jpg","it":"为故宫庆生：《清明上河图》10年来首展真容--艺术收藏--人民网","gp":"http://www.people.com.cn/mediafile/pic/20150828/17/15016188639043402953.jpg"},{"n":"玉云龙纹炉","e":"宋代","p":"故宫博物院","b":"这件宋代青玉仿古炉以青铜簋为蓝本，工字地纹上浮雕游龙海水，是宋人\"格物\"慕古的玉器典范，故宫十大镇馆之宝之一。","f":"宋，青玉质，高7.9厘米、口径12.8厘米；圆形侈口、垂腹圈足，两侧对称兽首吞耳；通体\"工\"字纹为地，饰游龙、祥云、海水；器内底阴刻乾隆戊戌（1778）御题七言诗；清宫旧藏，现藏故宫博物院；属宋代仿古玉器代表，为故宫玉器镇馆之作。","im":"images/ep23_03.jpg","it":"100岁的故宫博物院，风华正茂！_人民日报","gp":"https://cdnjdphoto.aikan.pdnews.cn/zhbj-2025-10-13/epaper/21f28530-6550-48f4-9d3e-e42cfe548314.jpg"},{"n":"缂丝梅鹊图","e":"南宋（沈子蕃）","p":"故宫博物院","b":"南宋沈子蕃缂丝《梅鹊图》以通经断纬织出寒梅喜鹊，是\"一寸缂丝一寸金\"的织中之圣，南宋缂丝工艺巅峰。","f":"南宋缂丝名家沈子蕃制，纵约104厘米、宽约36厘米；清宫旧藏，现藏故宫博物院；丝质依画稿缂织，用\"通经断纬\"手法，经密20根/厘米、纬密44–46根/厘米；图下方缂\"子蕃制\"\"沈氏\"方印；为沈子蕃传世少数精品之一，体现南宋缂丝典雅工丽的最高水平。","im":"images/ep23_04.jpg","it":"仿张若霭花鸟四条屏 - 河南博物院","gp":"https://www.chnmus.net/images/attachement/jpg/site2/20140210/24be050d2bed146277b828.jpg"},{"n":"张成造剔红云纹盘","e":"元代（张成）","p":"故宫博物院","b":"元代漆艺大师张成款的剔犀云纹盘，黑漆堆厚、刀口露朱，是元明雕漆\"藏锋圆润\"的典范，故宫漆器之宝。","f":"元，雕漆（剔犀）云纹盘，木胎黑漆，高3.3厘米、口径19.2厘米；内外满雕云纹，堆漆甚厚，刀口断面露朱漆数道（\"乌间朱线\"）；近足缘针划\"张成造\"三字细款；张成为元代雕漆大家，传世真品极稀；现藏故宫博物院，为故宫漆器代表藏品。","im":"images/ep23_05.jpg","it":"“张成造”剔犀云纹盘 - 故宫博物院","gp":"https://img.dpm.org.cn/Uploads/Picture/dc/12434[1024].jpg"},{"n":"掐丝珐琅缠枝莲纹象耳炉","e":"元代（明景泰后改）","p":"故宫博物院","b":"俗称\"景泰蓝\"的掐丝珐琅象耳炉，宝蓝地上红白黄缠枝莲，是元代珐琅工艺代表作，故宫珐琅之宝。","f":"元（后配构件为明景泰年），通高13.9厘米、口径16厘米、足径13.5厘米；铜胎圆形鼓腹，口沿两侧象首卷鼻耳，圈足；颈部浅蓝釉地饰四色菊花12朵，腹部宝蓝釉地饰三色缠枝莲6朵；原为元代珐琅器，铜胆、象耳、圈足为明代景泰年间后配（后改器）；清宫旧藏，现藏故宫博物院。","im":"images/ep23_06.jpg","it":"【清乾隆 铜胎掐丝珐琅缠枝莲纹象耳象足熏炉】拍卖品_图片_价格_鉴赏_金银琉璃珐琅器_雅昌艺术品拍卖网","gp":"https://img1.artron.net/auction/2016/art005619/d/art0056190338.jpg"},{"n":"郎窑红釉穿带直口瓶","e":"清康熙","p":"故宫博物院","b":"康熙郎廷极督窑创烧的郎红穿带瓶，铜红釉如牛血、口白足浓，\"脱口垂足郎不流\"，是故宫陶瓷之宝。","f":"清康熙，高20.8厘米、口径6.1厘米、足径9.1厘米；直口长颈垂腹，足外墙两侧长方形穿孔可穿系绳带；通体铜红釉，高温还原焰一次烧成，口沿因垂流露白胎、底部釉浓；外底镌乾隆乙未（1775）御题诗；郎红由江西巡抚郎廷极（1705–1712在任）督理景德镇御窑创烧；清宫旧藏，现藏故宫博物院，为十大镇馆之宝之一。","im":"images/ep23_07.jpg","it":"郎窑红釉穿带直口瓶 - 故宫博物院","gp":"https://img.dpm.org.cn/Uploads/Picture/dc/15514[1024].jpg"},{"n":"金瓯永固杯","e":"清乾隆","p":"故宫博物院","b":"乾隆钦定元旦开笔的\"金瓯永固杯\"，鼎式金杯嵌珠宝，寓意江山永固，是清宫岁首祈福的礼仪重器。","f":"清乾隆，高12.5厘米、口径8厘米、足高5厘米；以九成黄金（约20两）铸成，杯体鼎式，两侧夔龙耳上嵌珍珠，外壁缠枝宝相花、花蕊嵌珍珠与红蓝宝石，三象首足；\"金瓯永固\"寓意疆域完整；据《内务府活计档》乾隆五十五年（1790）造办处成造，每逢元旦子时乾隆于养心殿开笔仪式注屠苏酒、书吉语；现藏故宫博物院。","im":"images/ep23_08.jpg","it":"百年守护 文脉赓续 古老而年轻的故宫博物院焕发时代光彩","gp":"http://www.ncha.gov.cn/picture/0/2510111206076152326.jpg"},{"n":"黑漆彩绘楼阁群仙祝寿钟","e":"清乾隆","p":"故宫博物院","b":"乾隆造办处用五年造的二层楼阁自鸣钟，海屋添筹、群仙祝寿机关活动，是清宫机械与工艺结合的钟表之宝。","f":"清乾隆，高185厘米、面宽102厘米、侧宽70厘米；木胎黑漆彩绘二层楼阁，一层双针时钟（\"乾隆年制\"黄珐琅钟盘）配5个上弦孔控制走时报时刻开关门打乐，左右布景箱演\"海屋添筹\"\"群仙祝寿\"；二层三间房各一报时人逢3/6/9/12时出门敲钟碗报时；共7套机械系统；乾隆八年至十四年由造办处做钟处西洋匠师制；现藏故宫博物院，为钟表代表藏品。","im":"images/ep23_09.webp","it":"黑漆彩绘楼阁群仙祝寿钟 - 故宫钟表仪器类藏品 - 美术资料网","gp":"http://museum.meishuziliao.com/file/gugong_img/yig32d21isx.webp"},{"n":"石鼓","e":"先秦·秦国（春秋晚期）","p":"故宫博物院","b":"唐初发现的十块花岗岩石鼓，上刻大篆\"石鼓文\"记秦王游猎，是我国现存最早的一组石刻文字，被誉为\"石刻之祖\"。","f":"共十块花岗岩，高约60–95厘米、直径约60厘米；每鼓刻四言诗一篇，记秦国君游猎（\"猎碣\"），字体为大篆（籀文），上承西周金文、下启秦小篆；唐初发现于陕西凤翔，历经宋徽宗填金、金兵剔金、元明清收藏，抗战时随故宫文物南迁；现藏故宫博物院（宁寿宫），为\"中华第一古物\"；石鼓年代学界多定为春秋晚期秦国遗物。","im":"images/ep23_10.jpg","it":"康有为眼中的“中华第一古物”：“石鼓”喜迁故宫新居并开放_古代艺术_澎湃新闻-The Paper","gp":"http://image.thepaper.cn/www/image/5/699/522.jpg"},{"n":"三希帖（中秋帖、伯远帖）","e":"东晋—唐摹/宋临（王氏一门）","p":"故宫博物院（中秋、伯远）/台北故宫（快雪）","b":"\"三希\"原指王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》，其中中秋、伯远现藏故宫，是魏晋书法至高代表。","f":"三希堂旧藏三帖——王羲之《快雪时晴帖》为唐代摹本（今藏台北故宫博物院）；王献之《中秋帖》为北宋米芾临本；王珣《伯远帖》为东晋真迹（传世唯一东晋名家书法真迹）。中秋帖、伯远帖1951年由国家对海外购回，现藏故宫博物院；均为禁止出国（境）展览文物。","im":"images/ep23_11.jpg","it":"青玉“乾隆御笔三希堂记”册 - 故宫博物院","gp":"https://www.dpm.org.cn/Uploads/Picture/dc/53187[1024].jpg"},{"n":"上阳台帖","e":"唐（李白）","p":"故宫博物院","b":"李白《上阳台帖》是诗仙唯一存世书法真迹，纸本草书五行，风骨磊落，唐宋以来名家递藏有绪。","f":"唐李白书，纸本草书，纵28.5厘米、横38.1厘米，5行25字：\"山高水长，物象千万，非有老笔，清壮何穷。十八日，上阳台书，太白\"；为李白唯一传世书迹；曾入北宋宣和内府，经贾似道、明项元汴、清安岐、乾隆内府等收藏，后归张伯驹，1958年捐献；现藏故宫博物院。","im":"images/ep23_12.jpg","it":"国家一级文物！李白唯一传世的真迹，藏于北京故宫博物院_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/7dd98d1001e93901213f58b1f8b943e736d12e2e38bc"},{"n":"五牛图","e":"唐（韩滉）","p":"故宫博物院","b":"韩滉《五牛图》黄麻纸本五牛神态各异，是现存最早的纸本中国画，中国十大传世名画之一。","f":"唐韩滉（723–787）绘，黄麻纸本设色手卷，纵20.8厘米、横139.8厘米；五牛从右至左一字排开，姿态互异（吃草、回首、鸣叫、前瞻、络首），无背景；曾入南宋、元、清内府及赵孟頫、项元汴收藏，1900年八国联军劫出海外，1950年代国家以6万港币自香港购回，故宫修复重裱；现藏故宫博物院，禁止出国（境）展览文物。","im":"images/ep23_13.jpg","it":"现场北京故宫博物院的韩滉《五牛图》已是少数几件唐代传世纸绢画作品_新浪新闻","gp":"https://n.sinaimg.cn/sinacn20110/132/w2048h484/20190517/d15d-hwzkfpu7928505.jpg"},{"n":"定窑白釉孩儿枕","e":"北宋","p":"故宫博物院（另件藏台北故宫）","b":"定窑白釉孩儿枕以俯卧童子为枕面托，釉色温润、塑形生动，是宋瓷婴戏题材与定窑白瓷的巅峰之作。","f":"北宋定窑白釉瓷器，高约18.3厘米、长30厘米、宽11.8厘米；童子俯卧、臂枕于头下，身着长衫，背后有提花香炉等；河北曲阳定窑窑址出土同类标本；故宫博物院藏一件，台北故宫亦藏一件；定窑为宋代五大名窑之一，以白瓷覆烧、泪痕显著为特征。","im":"images/ep23_14.jpg","it":"定窑白釉孩儿枕 - 故宫博物院","gp":"https://www.dpm.org.cn/Uploads/Picture/dc/96[1024].jpg"},{"n":"大禹治水图玉山","e":"清乾隆","p":"故宫博物院（宁寿宫乐寿堂）","b":"大禹治水图玉山用整块和田青玉雕成，重逾五吨、高两米多，是乾隆钦定、举国雕造的玉雕巨制。","f":"清乾隆，和田青玉雕，高224厘米、宽96厘米、重约5330千克；以宋代《大禹治水图》为稿，扬州琢玉匠耗时约六年（1781–1787）雕成，底座镌乾隆御题诗；正面雕大禹率众开山治水的宏大场景；原置宁寿宫乐寿堂，现藏故宫博物院，为世界最大玉雕之一、禁止出国（境）展览文物。","im":"images/ep23_15.jpg","it":"北京故宫与台北故宫，哪里的国宝多？--书画--人民网","gp":"http://www.people.com.cn/mediafile/pic/20170309/10/2292004324893594042.jpg"},{"n":"金嵌珍珠天球仪","e":"清乾隆","p":"故宫博物院","b":"乾隆造办处以纯金打造、九龙支架、珍珠为星的天球仪，是传世唯一的金质天球仪模型，融天文与工艺于一身。","f":"清乾隆，球径29.5厘米、架高61.5厘米；内务府造办处用纯金制作，由座、九龙支架与天球三部分组成；球面以珍珠镶嵌三垣、二十八宿及众星，阴刻紫微、天市、太微三垣，配赤道环、地平环、时辰盘；是唯一传世金质天球仪模型；现藏故宫博物院。","im":"images/ep23_16.jpg","it":"金嵌珍珠天球仪 - 故宫博物院","gp":"https://img.dpm.org.cn/Uploads/Picture/dc/50889[1024].jpg"},{"n":"田黄三连玺","e":"清乾隆（太上皇时期）","p":"故宫博物院","b":"乾隆田黄三联玺由一整块田黄石镂雕三链连三印，溥仪出宫时贴身携带、1950年交出，是清宫传家之宝。","f":"清乾隆做太上皇时所镌，由整块田黄石镂雕三条活链连缀三印：左\"乾隆宸翰\"（阳文方印，边长2.6厘米）、中\"乐天\"（阳文椭圆，长径3厘米）、右\"惟精惟一\"（阴文方印，边长2.6厘米），高均约1厘米；\"惟精惟一\"出自《尚书》、\"乐天\"出自《周易》；乾隆之后各帝珍视；末代皇帝溥仪被逐出紫禁城时携出、随身不离，1950年交出，后移交故宫博物院。","im":"images/ep23_17.jpg","it":"清乾隆帝田黄三联玺_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/359b033b5bb5c9ea15ced6068b62a1003af33b871598?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_336"}]},{"no":"24","t":"辽宁省博物馆 · 书画篇","loc":"辽宁沈阳","it":[{"n":"曹娥诔辞","e":"东晋（传王羲之，今多定晋人佚名）","p":"辽宁省博物馆","b":"辽博\"三绝\"之一的《曹娥诔辞》是东晋小楷墨迹，传王羲之书，卷上韩愈、怀素题名尤为珍贵。","f":"东晋绢本小楷，纵32.3厘米、横54.3厘米，内容为表彰东汉孝女曹娥的诔辞，书心有\"升平二年\"（358年）署款；传为王羲之书，今多定为晋人佚名；卷上留存唐怀素题名及韩愈楷书题名（韩愈唯一存世墨迹），卷后有南宋高宗赵构、元赵孟頫等题跋；现藏辽宁省博物馆，与《万岁通天帖》《仲尼梦奠帖》并称\"辽博三绝\"。","im":"images/ep24_00.jpg","it":"山高水长——唐宋八大家主题文物展作品赏析-新华网","gp":"https://www.news.cn/shuhua/20210702/C96E486ACDA00001957613FD1CD01683/20210702C96E486ACDA00001957613FD1CD01683_1126871560_1608171101804.jpg"},{"n":"万岁通天帖","e":"唐代摹本（武周万岁通天二年）","p":"辽宁省博物馆","b":"武则天命弘文馆双钩廓填的王氏一门书翰，是存世最接近王羲之真迹的唐摹巨迹，辽博镇馆之宝。","f":"唐摹本，武周万岁通天二年（697）武则天命弘文馆以双钩廓填法摹制；底本为王羲之十世孙王方庆所献王氏一门二十九人书迹十一卷，今仅存七人十帖（含王羲之《姨母帖》《初月帖》等）；卷有火焚痕，曾两遭火灾；1950年代由东北博物馆（今辽博）收藏；现藏辽宁省博物馆，杨仁恺评\"下真迹一等\"。","im":"images/ep24_01.jpg","it":"“又见大唐”文物展点燃“冬天里的一把火”-新闻中心-温州网","gp":"http://world.people.com.cn/NMediaFile/2019/1212/MAIN201912121939000014273788639.JPG"},{"n":"仲尼梦奠帖","e":"唐（欧阳询）","p":"辽宁省博物馆","b":"欧阳询晚年行书《仲尼梦奠帖》笔力瘦硬险绝，帖上152枚藏印见证千年递藏，是中华十大传世名帖之一。","f":"唐欧阳询（557–641）行书，纸本，纵25.5厘米、横33.6厘米（一说23.6），9行78字，无款印；内容为孔子梦奠之事，有佛教无常报应之意；曾入南宋内府，经贾似道、元郭天锡、明项元汴、清内府递藏，帖上钤鉴藏印152枚，引首乾隆题\"真迹无疑\"；现藏辽宁省博物馆，国家一级文物。","im":"images/ep24_02.jpg","it":"省级博物馆系列04【辽宁省博物馆】-镇馆之宝及典藏 - 知乎","gp":"https://pica.zhimg.com/v2-51517d3f896b66583cc24fe00d8f4978_1440w.jpg"},{"n":"古诗四帖","e":"唐（张旭）","p":"辽宁省博物馆","b":"张旭狂草《古诗四帖》是唯一传世的狂草孤本，五色笺上笔走龙蛇，被誉为\"狂草第一帖\"。","f":"唐张旭草书，纸本（五色笺），纵29.5厘米、横195.2厘米（一说纵29横205），40行共188字；前两首为庾信《步虚词》、后两首为谢灵运赞诗；北宋初曾误归谢灵运，明董其昌考定为张旭书；现藏辽宁省博物馆，国家一级文物，是认识唐代狂草的孤本实物。","im":"images/ep24_03.jpg","it":"辽宁省博物馆藏的国宝级文物：张旭狂草《古诗四帖》_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/314e251f95cad1c8a786e60e0e6a7009c93d70cffbc4?x-bce-process=image/resize,m_fill,w_2314,h_1542,align_10,limit_0/format,f_auto"},{"n":"论书帖","e":"唐（怀素）","p":"辽宁省博物馆","b":"怀素《论书帖》一反其狂草常态，出入魏晋法度、圆浑平和，是其草书另一面目，辽博珍藏。","f":"唐怀素草书，纸本（暗花笺），纵28.6厘米、横40.5厘米（一说38.5），9行85字；内容为自省书艺、反思颠逸之变；最早著录于《宣和书谱》，存宣和内府原装裱，帖前有宋徽宗金书签题，后有赵孟頫、项元汴跋；墨迹本或为唐宋摹本；现藏辽宁省博物馆。","im":"images/ep24_04.jpg","it":"最接近王羲之的《万岁通天帖》将展，辽博再推古代书法_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/5fdf8db1cb1349540923b1bc4d008558d109b2dedc9f?x-bce-process=image/format,f_auto"},{"n":"簪花仕女图","e":"唐（传周昉）","p":"辽宁省博物馆","b":"传为周昉所绘的《簪花仕女图》是全世界唯一认定的唐代仕女画传世孤本，原系屏风、宋改装卷。","f":"唐（传）周昉绘，粗绢本设色，纵46厘米、横180厘米；绘贵族妇女五人、侍女一人及狗、鹤、辛夷花；1972年重裱发现由数幅直绢拼接，推断原为唐代屏风画、北宋前改装成长卷；无作者款印，卷藏\"绍兴\"连珠印，经贾似道、梁清标、安岐、清内府，溥仪携出后归东北博物馆；现藏辽宁省博物馆。","im":"images/ep24_05.jpg","it":"【国家宝藏】簪花仕女图：唐代“美人画”巅峰代表 - 知乎","gp":"https://picx.zhimg.com/v2-aad6db0d9d8453c719a7e81bf20354dd_r.jpg"},{"n":"夏景山口待渡图","e":"五代南唐（董源）","p":"辽宁省博物馆","b":"五代董源《夏景山口待渡图》写江南夏景，披麻皴点苔，是\"南宗\"山水画的经典范本，辽博珍藏。","f":"五代南唐董源绘，绢本淡设色，纵约49.8–50厘米、横约320–329厘米；绘江南夏日平远江景，卷尾一人待渡点题；近山披麻皴、远山多施苔点，设色雅淡；无款印，董其昌引首题\"董北苑夏景山口待渡图真迹\"，后有元柯九思等跋；经南宋内府、项元汴、清内府，溥仪携出后归东北博物馆；现藏辽宁省博物馆。","im":"images/ep24_06.jpg","it":"“南宗”山水画大宗主——董源《夏景山口待渡图》_江南","gp":"http://5b0988e595225.cdn.sohucs.com/images/20181018/eb8b9320bbb14ca68e228c703eed3b8d.jpeg"},{"n":"虢国夫人游春图","e":"北宋摹本（原唐张萱）","p":"辽宁省博物馆","b":"宋摹张萱《虢国夫人游春图》以八马九人盛装出游再现盛唐风华，虢国夫人身份成千古之谜。","f":"北宋摹本（原作唐张萱已佚），绢本设色，纵51.8厘米、横148厘米；绘杨贵妃三姐虢国夫人及眷从八骑九人春游，不写背景而雍容尽显；旧传宋徽宗赵佶摹，实为北宋摹本；画中虢国夫人究为哪一位学界三说并存（中间并辔者、前导男装者、抱婴后者）；现藏辽宁省博物馆，国家一级文物。","im":"images/ep24_07.jpg","it":"【博物馆展览】辽宁省博物馆《诗画中国：虢国夫人游春图》21展厅 - 知乎","gp":"https://pica.zhimg.com/v2-9a630950616e6bb44e0bcd7851a930fa_r.jpg"},{"n":"瑞鹤图","e":"北宋（宋徽宗赵佶）","p":"辽宁省博物馆","b":"宋徽宗《瑞鹤图》以瘦金体题诗画结合，定格政和二年汴京宣德门二十只飞鹤的祥瑞奇观。","f":"北宋徽宗赵佶绘，绢本设色，纵51厘米、横138.2厘米；政和二年（1112）上元次夕，汴京宣德门上空群鹤翔集（20只，二鹤立于鸱尾），徽宗以为祥瑞御笔写之；右图左书，画后瘦金体题记诗序并署\"御制御画并书\"\"天下一人\"押；曾入清内府，溥仪赐溥杰流出，归东北博物馆；现藏辽宁省博物馆，镇馆之宝。","im":"images/ep24_08.jpg","it":"那一年，白鹤飞过宋徽宗的头顶-新华网辽宁频道","gp":"http://ln.news.cn/20241004/51e561cf70c840bbb5efe02e02593045/2024100451e561cf70c840bbb5efe02e02593045_9b41c191c55d484cb528fa83d286e431.jpg"},{"n":"草书千字文","e":"北宋（宋徽宗赵佶）","p":"辽宁省博物馆","b":"宋徽宗40岁所书《草书千字文》写在三丈描金云龙笺上，一气呵成，是其狂草巅峰，辽博珍藏。","f":"北宋徽宗赵佶草书，纸本（描金云龙笺），纵31.5厘米、横1172厘米（约11.72米）；宣和四年（1122）书，时年40岁；草法出自怀素狂草一派，全卷无一接缝，气势雄健；经金、南宋贾似道、明项元汴、清内府递藏；2012年列入第二批禁止出境展览文物；现藏辽宁省博物馆。","im":"images/ep24_09.jpg","it":"草书千字文（辽宁省博物馆藏的书卷）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/1b4c510fd9f9d72a6059c5e4827a3f34349b023b0db3?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"洛神赋图","e":"东晋顾恺之（辽博藏南宋摹本）","p":"辽宁省博物馆","b":"辽博藏宋摹顾恺之《洛神赋图》图文相映、分段连环，是公认最接近原作的一本，再现人神之恋。","f":"东晋顾恺之（原作已佚），辽宁省博物馆藏为南宋摹本，绢本设色，纵27.1厘米、横572.8厘米；以连续式构图分\"邂逅、定情、情变、分别、怅归\"数幕演绎曹植《洛神赋》，画面书有赋文（现存宋摹本中唯一带赋文者）；很大程度保留顾恺之原貌，反映六朝章法；现藏辽宁省博物馆。","im":"images/ep24_10.jpg","it":"辽博展出《洛神赋图》等国宝级画作-新华网辽宁频道","gp":"http://www.ln.xinhuanet.com/20241222/44a3f47c91864f048b62653a30c7837a/2024122244a3f47c91864f048b62653a30c7837a_XxjdzbC007063_20241220_CBMFN0A001.jpg"},{"n":"草书洛神赋","e":"南宋（宋高宗赵构）","p":"辽宁省博物馆","b":"南宋高宗赵构晚年草书《洛神赋》，字字独立而气脉连贯，是宋代复古草书的典范，辽博藏。","f":"南宋高宗赵构（1107–1187）草书，绢本，纵27.9厘米、横约398厘米（近4米）；退居德寿宫时书，卷末署\"德寿殿书\"、钤\"德寿殿御书宝\"；录曹植《洛神赋》全文并省略所有\"兮\"字，属小草，笔意圆润流畅；现藏辽宁省博物馆。","im":"images/ep24_11.jpg","it":"洛神赋图（辽宁省博物馆藏本）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/a8014c086e061d953d9ae39973f40ad163d9cab7?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_883"},{"n":"毛诗唐风图","e":"南宋（赵构书、马和之画）","p":"辽宁省博物馆","b":"南宋高宗赵构书、马和之画的《毛诗唐风图》诗画合璧，以十二段图解《诗经·唐风》，辽博藏精本。","f":"南宋赵构书、马和之画，绢本设色手卷，纵28.6厘米、横827.1厘米；以《毛诗·唐风》十二首诗为题材，高宗书诗、马和之绘画，左图右书、图文相间；马和之有\"小吴生\"之誉，为奉敕所绘《诗经图》之一；现藏辽宁省博物馆，国家一级文物。","im":"images/ep24_12.jpg","it":"走进“唐宋八大家”的世界_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/30adcbef76094b36acafac6e79816bd98d1000e937a8?x-bce-process=image/format,f_auto"},{"n":"红衣罗汉图","e":"元（赵孟頫）","p":"辽宁省博物馆","b":"赵孟頫51岁所绘《红衣罗汉图》取法唐人、梵相生动，是其人物画力追唐风的代表作，辽博藏。","f":"元赵孟頫绘，纸本设色，纵26厘米、横52厘米；大德八年（1304）暮春自题\"吴兴赵孟頫子昂画\"，时年51岁；绘身着红袈裟罗汉盘坐说法，取法唐阎立本，铁线描勾勒、设色浓丽，因久在元大都常与天竺僧游而梵相逼真；卷后有董其昌、陈继儒跋；现藏辽宁省博物馆。","im":"images/ep24_13.jpg","it":"元 | 赵孟頫《红衣罗汉图》 - 知乎","gp":"https://picx.zhimg.com/v2-adb4d0653896e10bd71382284309222b_1440w.jpg"},{"n":"浒溪草堂图","e":"明（文徵明）","p":"辽宁省博物馆","b":"文徵明66岁为友人沈天民作《浒溪草堂图》，青绿山水秀润清幽，是吴门别号图的佳作，辽博藏。","f":"明文徵明绘，纸本设色，纵26.7厘米、横142.5厘米；嘉靖乙未（1535）腊月，66岁时应友人沈天民之请作其别号图（沈居苏州浒墅关，号\"浒溪\"）；画法秀润、青绿明快，近景草堂二高士对坐；经清内府、溥仪携出，归东北博物馆；现藏辽宁省博物馆。","im":"images/ep24_14.jpg","it":"浒溪草堂图(卷)","gp":"https://www.szmuseum.com/wzmzl/img/wzm/3015-1.jpg"}]},{"no":"25","t":"辽宁省博物馆 · 补完篇","loc":"辽宁沈阳","it":[{"n":"草书千字文","e":"唐·孙过庭","p":"辽宁省博物馆","b":"孙过庭写的《书谱》名气大，但这卷草书千字文是辽博的另一件宝贝，纸本草书，笔法精熟，是学习草书的经典范本之一。","f":"作者孙过庭（646—691），字虔礼，吴郡人；唐代草书千字文墨迹；辽宁省博物馆藏；纸本，草书；与其《书谱》并称，为唐代草书重要墨迹。","im":"images/ep25_00.jpg","it":"草书千字文（北宋宋徽宗赵佶书写的狂草作品）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/b3119313b07eca80653818bcab6a80dda144ad34251d?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_865"},{"n":"神骏图","e":"五代·摹韩干","p":"辽宁省博物馆","b":"画的是支遁和尚爱马的故事，原传韩干所画，辽博这件是五代时期的摹本，绢本设色，人马神态生动，是现存韩干系马画的重要传世摹本。","f":"旧传唐韩干（约706—783）作；现定为五代摹本；辽宁省博物馆藏；绢本设色；手卷；题材为晋代高僧支遁爱马故事；学界多认为非韩干真迹而是宋前摹本。","im":"images/ep25_01.jpg","it":"张成思 又见大唐韩干《神骏图》_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/cb8065380cd7912397ddbcee997a4e82b2b7d0a22a51?x-bce-process=image/format,f_auto"},{"n":"茂林远岫图","e":"北宋·李成（传，存疑）","p":"辽宁省博物馆","b":"一卷水墨山水，写夏日山峦林木之景，传为北宋李成所作，但风格更近燕文贵一路，辽博定为\"传李成\"，真伪历来有争议。","f":"旧题北宋李成（919—967）作；辽宁省博物馆藏；绢本水墨；立轴或手卷形制；现多数学者认为是宋人仿李成风格之作，非李成真迹；曾入清内府。","im":"images/ep25_02.jpg","it":"辽宁省博物馆馆藏《茂林远岫图》疑云--艺术收藏--人民网","gp":"http://www.people.com.cn/mediafile/pic/20140818/0/151438200875112988.jpg"},{"n":"寒鸦图","e":"北宋·李成（传，存疑）","p":"辽宁省博物馆","b":"画枯木寒鸦，萧瑟冬日意境，旧传李成，辽博定为\"传李成\"作品，笔墨与李成传世风格有出入，一般视作宋人水墨花鸟佳构。","f":"旧题北宋李成作；辽宁省博物馆藏；绢本水墨；手卷；描绘古木寒鸦；学界多判为宋人作品，归属李成存疑；与《茂林远岫图》同为辽博\"传李成\"系列。","im":"images/ep25_03.jpg","it":"寒鸦图（宋代李成创作的绢本水墨画）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/cc11728b4710b912c8fc68a3c7b7eb039245d688841e?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"山弈候约图 / 竹雀双兔图","e":"辽代","p":"辽宁省博物馆","b":"两幅都出自辽代墓葬的绢画，山弈候约图画隐士对弈，竹雀双兔图画竹石雀兔，是罕见的辽代卷轴画实物，填补了辽画空白。","f":"均为辽代绢本画；1974年辽宁法库叶茂台辽墓（第7号墓）出土；辽宁省博物馆藏；《山弈候约图》又名《深山会棋图》；《竹雀双兔图》为辽代花鸟；均属禁止出国（境）展览文物候选级别。","im":"images/ep25_04.jpg","it":"竹雀双兔图_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/0dd7912397dda1440821e3f8bfb7d0a20cf48654?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"沙汀烟树图","e":"北宋·惠崇","p":"辽宁省博物馆","b":"小景山水画，写江边沙汀烟树朦胧之景，传为北宋僧惠崇所作，辽博定为惠崇风格小景画，是宋人\"状小景\"一路的代表。","f":"作者惠崇，北宋初九僧之一，善画小景；辽宁省博物馆藏；绢本设色；描绘江南水乡烟树小景；旧传惠崇，学界多视为宋人仿惠崇风格作品。","im":"images/ep25_05.jpg","it":"读东坡：从东坡的诗文风骨到东坡肉_澎湃号·湃客_澎湃新闻-The Paper","gp":"https://imagepphcloud.thepaper.cn/pph/image/196/436/356.jpg"},{"n":"诗书稿","e":"北宋·欧阳修","p":"辽宁省博物馆","b":"欧阳修的手稿墨迹，存其诗文草稿，是研究这位文坛宗师书法与文献的一手材料，辽博将其列为书法名迹。","f":"作者欧阳修（1007—1072），字永叔，北宋文学家；辽宁省博物馆藏；纸本墨迹；为欧阳修亲笔诗文稿；传世欧阳修墨迹极稀，此卷文献与书法价值并重。","im":"images/ep25_06.jpg","it":"【博物馆展览】辽宁省博物馆《诗画中国：烟江叠嶂图卷》20展厅（上） - 知乎","gp":"https://pic2.zhimg.com/v2-2df7e40ea07ccce7c774aa943c6a2f9d_1440w.jpg"},{"n":"明皇击球图","e":"北宋·李公麟（传，疑）","p":"辽宁省博物馆","b":"画唐明皇打马球的场景，长卷人物众多，旧传李公麟，辽博标\"疑为李公麟\"，白描风格，是宋人表现唐代宫廷马球题材的佳作。","f":"旧传北宋李公麟（1049—1106）作；辽宁省博物馆藏；绢本水墨；手卷；描绘唐玄宗与嫔妃击球；现多定为宋人摹本或托名之作，非李公麟真迹。","im":"images/ep25_07.jpg","it":"古画中的冬景与运动，辽博展《明皇击球图卷》等_古代艺术_澎湃新闻-The Paper","gp":"https://imagecloud.thepaper.cn/thepaper/image/176/892/637.jpg"},{"n":"白莲社图","e":"北宋·张激","p":"辽宁省博物馆","b":"长卷白描，画东晋慧远和尚在庐山结白莲社的故事，传为李公麟首创、张激所绘，辽博这件归于张激名下，是宋人宗教人物画精品。","f":"作者张激，北宋画家，李公麟外甥；辽宁省博物馆藏；纸本白描；手卷；题材源自李公麟《白莲社图》粉本；描绘东晋庐山东林寺慧远结社事。","im":"images/ep25_08.jpg","it":"追忆或构想：兰亭、莲社与琉璃堂_古代艺术_澎湃新闻-The Paper","gp":"https://imagecloud.thepaper.cn/thepaper/image/246/991/184.png"},{"n":"燃灯佛授记释迦文图","e":"宋代","p":"辽宁省博物馆","b":"一幅绢本设色宗教画，画燃灯佛为释迦授记的佛教故事，宋代作品，辽博藏，代表了宋辽时期佛教变相画的水平和信仰面貌。","f":"宋代绢本设色宗教画；辽宁省博物馆藏；描绘燃灯佛为释迦牟尼授记本生故事；手卷或立轴形制；属宋元佛教绘画遗存，具体画派待考。","im":"images/ep25_09.jpg","it":"燃灯佛授记释迦文图_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/bd315c6034a85edff8bdedea4b540923dc5475c1?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"二骏图","e":"金·杨微","p":"辽宁省博物馆","b":"画两匹骏马在草原上驰骋，笔法遒劲，是辽博珍藏的北方游牧题材画作，作者署款大定甲辰，为金代画家杨微的真迹。","f":"作者杨微，金代画家；画心有\"大定甲辰（1184）\"款；辽宁省博物馆藏；绢本设色；手卷；描绘两骏马；著录见于《石渠宝笈》。","im":"images/ep25_10.jpg","it":"二骏图_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/21a4462309f79052abb28c8700f3d7ca7acbd5de?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"卤簿玉辂图","e":"南宋","p":"辽宁省博物馆","b":"一卷工笔设色画，细致描绘南宋皇家卤簿仪仗中的玉辂（天子车驾），场面浩大，是了解宋代舆服制度与宫廷礼仪的图解式名作。","f":"全称《卤簿玉辂图》；南宋院画风格；辽宁省博物馆藏；绢本设色；手卷；描绘宋代帝王卤簿（仪仗）中玉辂车驾；反映南宋舆服制度。","im":"images/ep25_11.jpg","it":"辽宁省博物馆南宋《卤簿玉辂图》","gp":"https://k.sinaimg.cn/n/sinakd20117/626/w1080h1946/20241116/6566-b2636f915927d6d6b6f405b6771959a6.jpg/w700d1q75cms.jpg"},{"n":"行书二帖","e":"南宋·朱熹","p":"辽宁省博物馆","b":"理学大家朱熹的毛笔信札，存两通信帖，行书写得从容洒脱，和他端严的理学形象不太一样，辽博藏，是研究朱熹书法的实物。","f":"作者朱熹（1130—1200），南宋理学家；辽宁省博物馆藏；纸本行书；存二通书帖（信札）；朱熹传世墨迹稀少，此二帖为其书法代表。","im":"images/ep25_12.jpg","it":"【博物馆】辽宁省博物馆：可能是东北区域里最好的的博物馆 - 知乎","gp":"https://pic2.zhimg.com/v2-7836544eeadb5422efba70fdd488ddbd_1440w.jpg"},{"n":"秋山红树图","e":"南宋·萧照","p":"辽宁省博物馆","b":"秋日山林红树烂漫，山石用笔刚硬，传为南宋萧照所作，辽博藏，是南宋院体山水\"斧劈皴\"一路的典型，气息接近李唐传派。","f":"作者萧照，南宋画家，李唐弟子；辽宁省博物馆藏；绢本设色；立轴；描绘秋山红树；旧传萧照，与李唐—萧照北方山水一脉相承。","im":"images/ep25_13.jpg","it":"秋山红树图中央美术学院美术馆 CAFA Art Museum","gp":"https://static.cafamuseum.org/museum-image/upload/201801/M400005230010100660405-001.jpg"},{"n":"秋窗读书图","e":"南宋·刘松年","p":"辽宁省博物馆","b":"秋天窗下有人读书的文人生活小景，庭院梧桐红叶，意境安闲，传刘松年所作，辽博藏，是南宋院体\"界画加山水人物\"的细腻之作。","f":"作者刘松年，南宋四家之一，钱塘人；辽宁省博物馆藏；绢本设色；团扇或册页；描绘秋日文人窗下读书；体现南宋院画精丽风格。","im":"images/ep25_14.jpg","it":"艺晟集团祝贺辽宁省博物馆全面开放，《洛神赋图》领衔馆藏十二个专题展_人物画","gp":"http://5b0988e595225.cdn.sohucs.com/images/20180818/8f6b3c4c05b24e628f1ec3974d7322ed.jpeg"},{"n":"松寿图","e":"南宋·马远","p":"辽宁省博物馆","b":"马远典型的\"一角半边\"构图，画虬松下老人，用笔刚健，辽博藏，署款\"马远\"，是南宋院体山水人物结合的代表作品。","f":"作者马远，南宋四家之一；辽宁省博物馆藏；绢本设色；立轴；\"马一角\"式边角构图；画松下寿星（或隐者）；署\"马远\"款。","im":"images/ep25_15.jpg","it":"【戊子（1648年）作 松寿图 立轴 设色纸本】拍卖品_图片_价格_鉴赏_绘画_雅昌艺术品拍卖网","gp":"https://img1.artron.net/auction/2010/art6467/d/art64671841.jpg"},{"n":"荷香清夏图","e":"南宋·马麟","p":"辽宁省博物馆","b":"夏塘荷花开得正好，水阁里有人纳凉，马麟画风工细秀润，辽博藏，是南宋院体花鸟山水的清新小品，气息平和闲适。","f":"作者马麟，马远之子，南宋院画家；辽宁省博物馆藏；绢本设色；手卷或册页；描绘夏日荷塘清夏之景；承马远家学而更趋秀润。","im":"images/ep25_16.jpg","it":"首个“唐宋八大家”主题文物展终于来了，有哪些看点 - 济宁博物馆","gp":"https://www.jiningmuseum.com/uploadimg/jsp/upload/image/20201203/1606958496453048265.jpg"},{"n":"雪中梅竹图","e":"南宋·徐禹功","p":"辽宁省博物馆","b":"雪地里梅竹傲寒，墨笔写意，徐禹功是扬补之的弟子，专画墨梅，辽博这件是他存世不多的墨梅代表作，延续了文人\"墨梅\"传统。","f":"作者徐禹功，南宋画家，扬补之弟子，擅墨梅；辽宁省博物馆藏；绢本水墨；手卷；《雪中梅竹图》为其代表作；与扬补之墨梅一脉相承。","im":"images/ep25_17.jpg","it":"雪中梅竹图_百度百科","gp":"https://bkimg.cdn.bcebos.com/smart/8c1001e93901213fa6e9249a54e736d12e2e9599-bkimg-process,v_1,rw_638,rh_420,maxl_431?x-bce-process=image/format,f_auto"},{"n":"自书诗帖","e":"南宋·陆游","p":"辽宁省博物馆","b":"陆游亲笔写的自家诗稿，行草相间，写得率性痛快，辽博藏，是这位爱国诗人少有的书法真迹，字里行间都是性情。","f":"作者陆游（1125—1210），南宋诗人；辽宁省博物馆藏；纸本行草；自书诗作数首；陆游传世墨迹稀少，此帖为其书法重要遗存。","im":"images/ep25_18.jpg","it":"【博物馆展览】辽宁省博物馆《诗画中国：烟江叠嶂图卷》20展厅（上） - 知乎","gp":"https://pica.zhimg.com/v2-45a566c5bd4d9922d174242213aeaf4c_r.jpg"},{"n":"大字杜甫诗","e":"南宋·张即之","p":"辽宁省博物馆","b":"张即之用大字写杜甫的诗，笔力雄强、结体开张，是他招牌式的\"写经体\"楷书放大版，辽博藏，是宋代大字书法的一件硬货。","f":"作者张即之（1186—1263），南宋书法家；辽宁省博物馆藏；纸本大字楷书；录杜甫诗；张即之以写经体大字著称，此卷为晚年代表作之一。","im":"images/ep25_19.jpg","it":"典藏级书法巨著：《伟大的中国书法》 - 知乎","gp":"https://picx.zhimg.com/v2-fd4b6ce72c0c17aab9337821494f8c5d_r.jpg"},{"n":"木鸡集序","e":"南宋·文天祥","p":"辽宁省博物馆","b":"文天祥为《木鸡集》写的序文，亲笔行书，写得磊落有骨气，辽博藏，是这位民族英雄少见的书法墨迹，文献与气节双重可贵。","f":"作者文天祥（1236—1283），南宋抗元名臣；辽宁省博物馆藏；纸本行书；《木鸡集序》为其应友人所作序文墨迹；传世文天祥书迹极稀。","im":"images/ep25_20.jpg","it":"文天祥草书谢昌元座右辞·木鸡集序_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/caef76094b36acaf2edd913657959a1001e9380136ef?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"王安石杂诗","e":"元·鲜于枢","p":"辽宁省博物馆","b":"鲜于枢用行草写王安石的诗，笔墨酣畅、气势连贯，和他与赵孟頫并称的北方书风一致，辽博藏，是元代草书的重要范本。","f":"作者鲜于枢（1246—1302），元代书法家，与赵孟頫齐名；辽宁省博物馆藏；纸本行草；书王安石杂诗数首；为其代表作之一。","im":"images/ep25_21.jpg","it":"鲜于枢行草书王安石杂诗《奉酬约之见招》，现藏于辽宁博物馆_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/7e3e6709c93d70cf3bc7cfa3ae92c600baa1cd11fd45?x-bce-process=image/format,f_auto"},{"n":"秋声赋","e":"元·赵孟頫","p":"辽宁省博物馆","b":"赵孟頫用行书写欧阳修的《秋声赋》，笔法圆熟流美，辽博藏，是其行书成熟期的代表作，也是元人\"复古\"书风的一面旗帜。","f":"作者赵孟頫（1254—1322），元代书画家；辽宁省博物馆藏；纸本行书；书欧阳修《秋声赋》；为其行书代表作，现多见于辽博书画陈列。","im":"images/ep25_22.jpg","it":"图解辞赋佳作，溥心畬绘《秋声赋图》_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/728da9773912b31bb051f55d6555217adab44aed4b3b?x-bce-process=image/format,f_auto"},{"n":"太白山图","e":"元·王蒙","p":"辽宁省博物馆","b":"王蒙长卷写浙江太白山（天童寺）景致，千岩万壑、繁密苍郁，是他\"解索皴\"密体山水的典范，辽博藏，卷后有大量名家题跋。","f":"作者王蒙（？—1385），元四家之一，赵孟頫外孙；辽宁省博物馆藏；纸本设色；手卷；描绘浙江太白山天童寺一带；为其晚年密体山水代表作，卷后题跋众多。","im":"images/ep25_23.jpg","it":"一览辽博特展全貌，《和合中国》呈现五百高清文物图_古代艺术_澎湃新闻-The Paper","gp":"https://imagecloud.thepaper.cn/thepaper/image/219/795/657.jpg"},{"n":"达摩至慧能六代祖师图","e":"明·戴进","p":"辽宁省博物馆","b":"戴进用白描把禅宗六代祖师从达摩到慧能一一画出，衣纹刚劲，辽博藏，是他早年宗教人物画的代表，也可见浙派线描功力。","f":"作者戴进（1388—1462），明初画家，浙派创始人；辽宁省博物馆藏；绢本白描；手卷；描绘禅宗初祖达摩至六祖慧能六代祖师像。","im":"images/ep25_24.jpg","it":"达摩至慧能六代祖师图_百度百科","gp":"https://bkimg.cdn.bcebos.com/smart/b3fb43166d224f4a4f82fa1207f790529822d19c-bkimg-process,v_1,rw_1,rh_1,pad_1,color_ffffff?x-bce-process=image/format,f_auto"},{"n":"归去来辞图","e":"明·三人合作","p":"辽宁省博物馆","b":"辽博藏有一卷《归去来辞图》，由明代三位画家分段合作，依陶渊明《归去来兮辞》各画一段，是明代画家联袂合作的难得例证。","f":"明代三位画家合作；辽宁省博物馆藏；纸本或绢本设色；手卷；分段描绘陶渊明《归去来兮辞》文意；具体合作者待考，一般归为明人合作本。","im":"images/ep25_25.jpg","it":"归去来辞意图_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/03087bf40ad162d9f2d354d51886beec8a13622767fb?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"万年松图","e":"明·宣宗朱瞻基","p":"辽宁省博物馆","b":"明宣宗朱瞻基亲笔画的一株苍松，寓意万年长寿，皇家气派中带点文人趣味，辽博藏，是明代帝王绘画中难得的真迹之一。","f":"作者朱瞻基（1399—1435），明宣宗，年号宣德；辽宁省博物馆藏；绢本设色；立轴；《万年松图》为其亲笔；明代帝王善画者以宣宗为代表。","im":"images/ep25_26.jpg","it":"万年松图_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/5366d0160924ab18972bc31d9ab2f1cd7b899e519dcb?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"吕纪花鸟作品","e":"明·吕纪","p":"辽宁省博物馆","b":"吕纪是明代宫廷花鸟画一把手，工笔重彩、设色浓丽，辽博收有他的花鸟若干，多写仙鹤、锦鸡、花木，一派院体富贵气象。","f":"作者吕纪（约1439—1505），明代院体花鸟画家；辽宁省博物馆藏其多幅花鸟；绢本设色；工整浓丽，兼工带写；与林良并称明代宫廷花鸟双璧。","im":"images/ep25_27.jpg","it":"明 吕纪 | 四季花鸟图——春、夏、秋、冬赏析|吕纪|花鸟图|夏圭_新浪新闻","gp":"http://n.sinaimg.cn/sinakd20115/762/w1000h562/20220902/a745-bb1fb93611a712994acbc497c962a015.jpg"},{"n":"魏园雅集图 / 盆菊幽赏图","e":"明·沈周","p":"辽宁省博物馆","b":"两幅都出自吴门画派领袖沈周之手，一画文人雅集、一画盆菊清赏，笔墨苍润、文人气浓，辽博藏，是明中期文人画的标杆。","f":"作者沈周（1427—1509），明四家之首，吴门画派开创者；辽宁省博物馆藏《魏园雅集图》《盆菊幽赏图》；纸本设色；为其中年及晚年代表作。","im":"images/ep25_28.jpg","it":"盆菊幽赏图_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/8d5494eef01f3a29d57670669725bc315d607cd8?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_500"},{"n":"东坡记游","e":"明·祝允明","p":"辽宁省博物馆","b":"祝枝山用狂草写苏东坡的游记，笔势奔放跳宕、个性十足，辽博藏，是把宋人文章和明人狂草拧在一起的一件痛快之作。","f":"作者祝允明（1461—1527），字希哲，号枝山，明书法家；辽宁省博物馆藏；纸本狂草；书苏轼（东坡）游记文；为其草书代表作之一。","im":"images/ep25_29.jpg","it":"祝允明-明代书法-书法空间——永不落幕的书法博物馆","gp":"https://9610.com/zhym/dpjy/04.jpg"},{"n":"兰亭修禊图","e":"明·祝枝山与文徵明","p":"辽宁省博物馆","b":"传说辽博有文徵明画、祝允明题的《兰亭修禊图》一类合作或成对作品，画王羲之兰亭雅集，一文一书，是吴门双璧联袂的文人画典型。","f":"文徵明（1470—1559）、祝允明（1461—1527）均为明四家/吴门书家；辽宁省博物馆藏有二人相关书画；兰亭修禊为常见文人画题；合作/对题本多见。","im":"images/ep25_30.jpg","it":"【书圣王羲之】(4)汇集22套名家画作《兰亭修禊图（曲水流觞图）》（下）+几件兰亭题材的故宫文玩 - 知乎","gp":"https://pic3.zhimg.com/v2-f752eca42482308cc1d7936cc35595ae_r.jpg"},{"n":"吴门避暑诗","e":"明·唐寅","p":"辽宁省博物馆","b":"唐伯虎的行书诗卷，写夏日避暑的闲情，字态欹侧洒脱，自带几分玩世不恭，辽博藏，是唐寅书法的代表性墨迹之一。","f":"作者唐寅（1470—1523），字伯虎，明四家之一；辽宁省博物馆藏；纸本行书；《吴门避暑诗》（或《吴门避暑诗卷》）为其书迹；唐寅书风学赵孟頫而自出机杼。","im":"images/ep25_31.jpg","it":"历代书法名家大图范本·唐寅·一吴门避暑诗_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/b2de9c82d158ccbf117ca31c10d8bc3eb03541d7?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"清明上河图","e":"明·仇英","p":"辽宁省博物馆","b":"仇英摹画北宋汴京繁盛，但换成了他熟悉的青绿设色和明代市井，辽博藏其本，与张择端宋本、清院本并称，是\"苏州片\"里的精构。","f":"作者仇英（约1494—1552），明四家之一；辽宁省博物馆藏仇英《清明上河图》摹本；绢本设色；手卷；以青绿重彩重绘汴京风物，带明代气息。","im":"images/ep25_32.jpg","it":"相隔四个世纪，两幅《清明上河图》有何不同？_人民日报","gp":"https://cdnjdphoto.aikan.pdnews.cn/zhbj-20250404/image/content/131840e9d97348f6b30e4b789b0ccc08.jpeg"},{"n":"董其昌作品数种","e":"明·董其昌","p":"辽宁省博物馆","b":"董其昌是晚明书画宗师，辽博收其山水、书法多种，或水墨禅意、或行楷疏淡，\"南北宗\"论的实践都在这些卷轴里，分量很重。","f":"作者董其昌（1555—1636），晚明书画家、理论家；辽宁省博物馆藏其书画多种（山水、行草等）；纸本/绢本水墨设色；倡导\"南北宗论\"；传世作品多。","im":"images/ep25_33.jpg","it":"元、明、清三代珍贵文物齐聚董其昌书画艺术博物馆_各区风采_上海市文化和旅游局","gp":"https://whlyj.sh.gov.cn/cmsres/53/53f8da3d283945e4ae04dab86f196b90/ebcf1bc304e2430da4fe1251f3149bfe.jpg"},{"n":"野墅平林图","e":"明·倪雅谷绘、利玛窦题","p":"辽宁省博物馆","b":"一幅西洋透视法的中国乡村风景画，过去误传利玛窦所画，其实由耶稣会中国籍画师倪雅谷绘制、利玛窦题字，是中西绘画交流的早期物证。","f":"辽宁省博物馆藏《野墅平林图》；学界考证作者为耶稣会中国籍画师倪雅谷（Jacomo Niva之徒），利玛窦（Matteo Ricci）仅为题款者；明万历年间；融合西洋透视与中国题材；林梅村《文物》2010年考订。","im":"images/ep25_34.jpg","it":"野墅平林图_百度百科","gp":"https://bkimg.cdn.bcebos.com/smart/6391e9034450e4b809fa9311-bkimg-process,v_1,rw_317,rh_250,maxl_360?x-bce-process=image/format,f_auto"},{"n":"临唐太宗帖","e":"明·王铎","p":"辽宁省博物馆","b":"王铎临写唐太宗李世民的书帖，立轴大字，涨墨淋漓、气势逼人，是他\"神笔\"书风的代表，辽博藏，展开就是满纸风云。","f":"作者王铎（1592—1652），明末清初书法家；辽宁省博物馆藏《临唐太宗帖》；纸本墨书；立轴，约252×50厘米；临唐太宗《枇杷帖》等；为其行草代表作。","im":"images/ep25_35.jpg","it":"全国博物馆“尖子生”名单公布！辽宁省博物馆上榜","gp":"https://www.ln.gov.cn/web/fileDir/resource/cms/2025/05/2025051909183638232.jpg"},{"n":"傅山作品","e":"明清之际·傅山","p":"辽宁省博物馆","b":"傅山是硬骨头遗民书画家，辽博藏其行书、草书多件，字势奇崛、宁拙毋巧，和他\"四宁四毋\"的主张一致，是晚明个性书风的典型。","f":"作者傅山（1607—1684），字青主，明清之际思想家、书画家；辽宁省博物馆藏其《行书浦台诗轴》等作品；纸本行/草书；主张\"宁拙毋巧，宁丑毋媚\"。","im":"images/ep25_36.jpg","it":"傅山（明末清初道家思想家、书法家、医学家）_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/8694a4c27d1ed21bd7a6e1afad6eddc451da3f09?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,w_440"},{"n":"古木垂荫图","e":"清·石涛","p":"辽宁省博物馆","b":"石涛画的一株老树垂荫，水墨淋漓、构图奇崛，带他标志性的\"搜尽奇峰打草稿\"的性灵，辽博藏，是他中晚年山水画的一件佳作。","f":"辽宁省博物馆藏《古木垂荫图》；作者为清代石涛（原济，1642—约1707）；纸本设色；立轴，约175×50.7厘米；作于1691年（辛未）；为其山水画代表。","im":"images/ep25_37.jpg","it":"古木垂阴图_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/3bf33a87e950352a2b7d629e5343fbf2b2118b0c?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"临富春山居图","e":"清·王翚","p":"辽宁省博物馆","b":"王翚精心临摹黄公望《富春山居图》，把元人长卷的味道摹得十足，辽博藏其丙寅年本，是清代\"虞山派\"摹古功力的 showcase。","f":"作者王翚（1632—1717），清初\"四王\"之一，虞山派领袖；辽宁省博物馆藏其1686年（丙寅）临《富春山居图》卷；绢本水墨；约36.5×475厘米；据唐宇昭藏粉本临写。","im":"images/ep25_38.jpg","it":"【临黄公望富春山居图 手卷 设色纸本】拍卖品_图片_价格_鉴赏_绘画_雅昌艺术品拍卖网","gp":"http://img1.artron.net/auction/2012/art501502/d/art5015020283.jpg"},{"n":"西湖实景图","e":"清·王原祁","p":"辽宁省博物馆","b":"王原祁奉敕画的西湖十景长卷，设色工稳、层层烘染，把实景山水画出庙堂气，辽博藏，是清代\"四王\"正统派山水的大制作。","f":"作者王原祁（1642—1715），清初\"四王\"之一；辽宁省博物馆藏《西湖十景图卷》（绢本设色，约62×656厘米，奉敕作）及《西岭云霞图卷》（1710年）；清单\"西湖实景图\"对应《西湖十景图卷》。","im":"images/ep25_39.jpg","it":"藏着200年前的西湖，是很多人到西湖的第一站_央广网","gp":"https://mediabluk.cnr.cn/record/img/cnr/CNRCDP/2025/0911/f2202ae613bf4fe3ad7f3bd1452a8eaf10.jpg"},{"n":"怒容钟馗图","e":"清·高其佩","p":"辽宁省博物馆","b":"高其佩用手指画的钟馗，怒目圆睁、须发皆张，指墨苍辣有奇趣，辽博藏，是他\"指头画\"招牌题材，端午节应景的镇宅神物。","f":"作者高其佩（1660—1734），字韦之，号且园，铁岭人，指画创始人；辽宁省博物馆藏《怒容钟馗图》；纸本设色；立轴，约148×67厘米；作于雍正六年（1728）端午；指画。","im":"images/ep25_40.jpg","it":"怒容钟馗图_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/63d9f2d3572c11dfba0d823e6e2762d0f603c2ca?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"姑苏繁华图","e":"清·徐扬","p":"辽宁省博物馆","b":"徐扬花二十四年画成的一卷苏州全盛图，从郊野到城墙、从市集到胥门，连绵十几米，辽博镇馆长卷，清代版\"清明上河图\"。","f":"作者徐扬，清乾隆朝宫廷画家；辽宁省博物馆藏；原名《盛世滋生图》；纸本设色；手卷，约36.5×1241厘米；乾隆二十四年（1759）绘成；描绘苏州城繁华。","im":"images/ep25_41.jpg","it":"姑苏繁华图｜清.徐扬 辽宁省博物馆","gp":"https://n.sinaimg.cn/sinakd20115/452/w1214h838/20220831/073c-ad1130b20b17e7caa607819f06a3035a.jpg"},{"n":"幽兰图","e":"清·郑板桥","p":"辽宁省博物馆","b":"郑板桥画兰竹石，几笔瘦兰从石缝里钻出来，疏朗有骨格，配上他的\"六分半书\"，辽博藏，是\"扬州八怪\"文人画的典型趣味。","f":"作者郑燮（1693—1765），号板桥，扬州八怪之一；辽宁省博物馆藏《幽兰图》；纸本水墨；立轴，约91.3×51厘米；画兰竹石，题其\"六分半书\"款。","im":"images/ep25_42.jpg","it":"松柏幽兰图_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/18d8bc3eb13533fa261dad72a8d3fd1f40345bc6?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"远景楼记","e":"清·刘墉","p":"辽宁省博物馆","b":"刘罗锅用肥厚圆润的\"墨猪\"体抄写苏轼《眉州远景楼记》，字态丰腴雍容，辽博藏，是他晚年馆阁体行书的从容之作。","f":"作者刘墉（1719—1804），号石庵，乾隆朝重臣，世称\"刘罗锅\"；辽宁省博物馆藏《行书远景楼记轴》；纸本；立轴，约165×56.1厘米；乾隆五十七年（1792）73岁书苏轼《眉州远景楼记》。","im":"images/ep25_43.jpg","it":"“打卡中国·读懂中国式现代化（辽宁篇）”网络国际传播活动在沈阳启动_安青网","gp":"http://ln.people.com.cn/NMediaFile/2023/0530/LOCAL1685407645248ZGNM96QIP4.jpg"},{"n":"牡丹图","e":"清·赵之谦","p":"辽宁省博物馆","b":"赵之谦把篆刻的金石气带进花卉，牡丹设色浓丽、笔力厚重，开海上画派先声，辽博藏，是他晚年\"以书入画\"的代表。","f":"作者赵之谦（1829—1884），清末书画家、篆刻家；辽宁省博物馆藏《牡丹图》；纸本设色；立轴，约126×63.5厘米；同治十年（1871）作；融碑学笔意入花鸟。","im":"images/ep25_44.jpg","it":"一览辽博特展全貌，《和合中国》呈现五百高清文物图_古代艺术_澎湃新闻-The Paper","gp":"https://imagecloud.thepaper.cn/thepaper/image/219/809/547.jpg"}]},{"no":"26","t":"南京博物院（两岸的纽带）","loc":"江苏南京","it":[{"n":"透雕人鸟兽玉饰件","e":"新石器·良渚文化","p":"南京博物院","b":"一块巴掌大的玉饰，上面透雕着人、鸟、兽纠缠的神秘图案，1991年从昆山赵陵山良渚墓里出土，是南博镇院之宝里最古老的一件。","f":"1991年江苏昆山赵陵山77号墓出土；良渚文化；高约5.5厘米；透雕人、鸟、兽组合纹饰；南京博物院藏；列为南博\"镇院之宝\"之一。","im":"images/ep26_00.png","it":"首次举办！国家博物馆、南京博物院等20家博物馆来厦门 _ 文博资讯 _ 福建省文物局","gp":"http://wwj.wlt.fujian.gov.cn/xwzx/wbyw/202411/W020241104351195005352.png"},{"n":"神人兽面纹玉琮","e":"新石器·良渚文化","p":"南京博物院","b":"外方内圆的玉琮，四面刻着良渚标志性的\"神人兽面纹\"，1982年武进寺墩出土，是南博镇院之宝，也是五千年神权信仰的实物。","f":"1982年江苏武进寺墩4号墓（一说3号墓）出土；良渚文化；高约7.2厘米；四面饰神人兽面纹；南京博物院藏；南博\"镇院之宝\"之一。","im":"images/ep26_01.jpg","it":"良渚与古代中国","gp":"https://ggzlimg.dpm.org.cn/app/gugong/2019/1009/7wHbqwI8yKsulF7kebWFZitca37LcY78jDtzspvF.jpg"},{"n":"陈璋圆壶","e":"战国","p":"南京博物院","b":"1982年盱眙南窑庄挖出来的战国青铜壶，壶身错金银、嵌绿松石，还带着\"公元前315年齐宣王伐燕\"的铭文，是南博镇院之宝。","f":"1982年江苏盱眙南窑庄窖藏出土；战国；又名\"错金银镶嵌丝网套铜壶\"\"重络铜壶\"；腹刻\"陈璋伐匽（燕）\"铭文，记公元前315年齐宣王五年陈璋伐燕事；南京博物院藏；镇院之宝。","im":"images/ep26_02.jpg","it":"淮安政协文史","gp":"http://zx.huaian.gov.cn/upload/2022-11/20221129145106369328/image1.jpeg"},{"n":"西汉金兽","e":"西汉","p":"南京博物院","b":"一块实心金疙瘩，长得像豹子，重达9公斤多，纯度99%，1982年和陈璋圆壶同坑出土，是国内最重的古代金器，南博镇院之宝。","f":"1982年江苏盱眙南窑庄出土；西汉；重约9100克（9.1公斤）；含金量99%；长17.5厘米；状如豹形怪兽；南京博物院藏；迄今所见最重古代金器；镇院之宝。","im":"images/ep26_03.jpg","it":"南京博物院藏· 西汉金兽","gp":"https://n.sinaimg.cn/sinacn20112/286/w1606h1080/20190219/7df5-htfpvza0468661.jpg"},{"n":"广陵王玺金印","e":"东汉","p":"南京博物院","b":"一枚纯金龟钮小印，刻着\"广陵王玺\"，1980年扬州甘泉山汉墓出土，是东汉广陵王刘荆的官印，和日本的\"汉委奴国王\"印同制式。","f":"1980—1981年江苏扬州甘泉山2号墓出土；东汉；广陵王刘荆（光武帝子）之印；龟钮金印；重122.87克；印文篆书\"广陵王玺\"；南京博物院藏；镇院之宝。","im":"images/ep26_04.jpg","it":"揭秘“广陵王玺”金印：主人是东汉广陵王刘荆--文化--人民网","gp":"http://paper.people.com.cn/rmrb/res/1/20141214/1418496279731_1.jpg"},{"n":"错银铜牛灯","e":"东汉","p":"南京博物院","b":"一头铜牛驮着灯盘，灯火冒烟顺着牛肚子里的水循环过滤，环保设计超前两千年，1980年广陵王刘荆墓出土，南博镇院之宝。","f":"1980年江苏邗江甘泉2号东汉墓（广陵王刘荆墓）出土；东汉；通高46.2厘米；错银铜牛灯；灯烟经牛首、牛腹（贮水）过滤净化；南京博物院藏；镇院之宝。","im":"images/ep26_05.jpg","it":"南京博物院镇馆之宝——东汉错银铜牛灯-人民图片网","gp":"http://vip-public.people.com.cn/photo/2021/12/18/3349957a53254817811d1fe18f959342iHJu_m.jpg"},{"n":"银缕玉衣","e":"东汉","p":"南京博物院","b":"用银丝把两千多片玉片编缀成的一整套玉衣，是东汉诸侯王级别的殓服，1969年徐州土山汉墓出土，南博镇院之宝级别文物。","f":"1969年江苏徐州土山一号汉墓出土；东汉；彭城王（或某代楚王/彭城王）殓服；玉片2600余片，银丝约800克；全长约170厘米；南京博物院藏；镇院之宝。","im":"images/ep26_06.jpg","it":"银缕玉衣_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/a044ad345982b2b7d0a2353c2cf5dcef76094a362d89?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_852"},{"n":"鎏金银嵌宝石兽形铜砚滴","e":"东汉","p":"南京博物院","b":"一只蟾蜍模样的铜砚滴，通体鎏金、嵌着红蓝宝石，1970年徐州土山汉墓出土，造型精巧到不像实用器，是南博的汉代工艺极品。","f":"1970年江苏徐州土山汉墓出土；东汉；蟾蜍（兽形）铜砚滴；通体鎏金、镶嵌宝石；长约25厘米；南京博物院藏（院方定名\"鎏金镶嵌兽形铜盒砚\"）；工艺极精。","im":"images/ep26_07.jpg","it":"东汉鎏金镶嵌兽形铜盒砚_百度百科","gp":"http://baike.baidu.com/cms/s/museum/v2/uploads/06鎏金镶嵌兽形铜盒砚原尺寸.png"},{"n":"青釉瓷神兽尊","e":"西晋","p":"南京博物院","b":"一件西晋青瓷，塑成带翼神兽、张口嘶吼的尊形器，1976年宜兴周处家族墓出土，是国宝级越窑代表作，南博镇院之宝。","f":"1976年江苏宜兴周处（周鲂）家族墓出土；西晋；越窑青釉；高约27.9厘米；神兽尊，贴塑鸟兽纹；南京博物院藏；国宝级文物；镇院之宝。","im":"images/ep26_08.jpg","it":"禁止出国展览的陶瓷文物--书画--人民网","gp":"http://art.people.com.cn/NMediaFile/2017/0306/MAIN201703061529000292919520128.jpg"},{"n":"竹林七贤与荣启期砖画","e":"南朝","p":"南京博物院","b":"用模印砖拼出来的\"壁画\"，画着嵇康、阮籍等竹林七贤加荣启期，1960年南京西善桥南朝墓出土，是禁止出境展览的国宝。","f":"1960年南京西善桥南朝墓出土；南朝；模印拼嵌砖画；分嵌墓室两壁，画嵇康、阮籍、山涛、王戎、向秀、刘伶、阮咸及荣启期；南京博物院藏；国家禁止出国（境）展览文物。","im":"images/ep26_09.jpg","it":"南京博物院","gp":"https://www.njmuseum.com/files/nb/collection/modify/2020/09/09/159962003516803.jpg"},{"n":"釉里红岁寒三友纹梅瓶","e":"明·洪武","p":"南京博物院","b":"明洪武的釉里红梅瓶，通体画松竹梅\"岁寒三友\"，1957年南京安成公主墓出土，发色纯正、存世极罕，南博镇院之宝级国宝。","f":"1957年南京东善桥响龙山明洪武安成公主墓出土；明洪武；釉里红；高约41.7厘米；通体绘松竹梅岁寒三友纹；南京博物院藏；国宝级；镇院之宝。","im":"images/ep26_10.jpg","it":"釉里红岁寒三友图梅瓶-文物鉴赏-南京市博物总馆","gp":"https://www.njmuseumadmin.com/Public/Upload/FckFile/150921021721459"},{"n":"鎏金藏式佛塔","e":"明","p":"南京博物院","b":"一座铜质鎏金的藏式佛塔，1956年南京牛首山弘觉寺塔地宫出土，小巧精丽，是明代汉藏佛教艺术交流的实物见证。","f":"1956年南京牛首山弘觉寺塔地宫出土；明代；铜鎏金；藏式佛塔（喇嘛塔）；高约35厘米；塔身刻\"李福善奉施\"等铭；南京博物院藏。","im":"images/ep26_11.jpg","it":"南京博物院数字文物之美","gp":"https://vr.njmuseum.org.cn/img/ww/3：2106.gif"},{"n":"金蝉玉叶","e":"明","p":"南京博物院","b":"一只金蝉趴在玉雕的叶片上，是明代女子发簪的顶端装饰，1954年苏州张安晚墓出土，金玉辉映、构思绝巧，国内仅此一件。","f":"1954年江苏苏州五峰山张安晚家族墓出土；明代；金蝉+玉叶组合发簪饰件；金蝉玉叶分体铸造/雕琢后组合；南京博物院藏；同类国内唯一；工艺极精。","im":"images/ep26_12.jpg","it":"明金蝉玉叶_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/18d8bc3eb13533fa828b3d505389ea1f4134970aed00?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_960"},{"n":"杂花图卷","e":"明·徐渭","p":"南京博物院","b":"徐文长一口气画了十三种花卉的水墨长卷，从牡丹到石榴恣意泼洒，是他\"泼墨大写意\"的巅峰，南博藏的明中期文人画狠货。","f":"作者徐渭（1521—1593），字文长，明中后期书画家；南京博物院藏《杂花图卷》；纸本水墨；纵约30厘米、横约1053.5厘米；分段画牡丹、石榴、荷花等13种花卉；泼墨大写意代表作。","im":"images/ep26_13.jpg","it":"艺赏 | 南博携徐渭《杂花图卷》带你感受春天的气息_芭蕉","gp":"http://5b0988e595225.cdn.sohucs.com/images/20200320/d8c674f9369044fd8ff089fc19dfd909.jpeg"},{"n":"青花寿山福海纹香炉","e":"明·永乐","p":"南京博物院","b":"明永乐景德镇官窑的青花大香炉，画着寿山福海纹，是南迁文物里的一件，形制硕大、发色浓艳，传世完整器极罕。","f":"明永乐；景德镇官窑青花；南京博物院藏；青花寿山福海纹三足炉；高约58厘米；为南迁文物（原故宫南迁珍藏）；传世完整器罕见，同式仅存数件。","im":"images/ep26_14.jpg","it":"二百四十二件珍贵文物，南京博物院的九十年春华秋实","gp":"https://jcdn.xhby.net/dams-res/editing/image/202311/03/JO2rA9PjnUAJmJDg6GXFucfz.jpg?image_process=resize,w_800/format,jpg"},{"n":"坤舆万国全图","e":"明·利玛窦","p":"南京博物院","b":"1608年彩色摹绘的世界地图，利玛窦带来、中国学者参与绘制，是中文世界最早的世界地图之一，南博藏的南迁国宝。","f":"明万历三十六年（1608）彩色摹绘本；利玛窦（Matteo Ricci）制，中国学者（如李之藻等）参与；南京博物院藏；纵约168厘米、横约382厘米；原为南迁文物；中文世界最早世界地图之一。","im":"images/ep26_15.jpg","it":"观天下——大明的世界_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/b7fd5266d0160924ab18b79c715e22fae6cd7a899eb9?x-bce-process=image/format,f_auto/resize,m_lfit,limit_1,h_1000"},{"n":"清代藏传金观音菩萨立像","e":"清·乾隆","p":"南京博物院","b":"一尊乾隆朝督造的藏传金观音立像，通体纯金、工艺繁复，重达四十来公斤，是清代宫廷佛造像的顶级代表，南博\"慈航之宝\"。","f":"清乾隆朝宫廷督造；藏传佛教金观音菩萨立像；南京博物院藏；高约88厘米；重约40公斤（清单\"41斤金\"）；含金量约83%；南博称\"慈航之宝\"。","im":"images/ep26_16.jpg","it":"南京博物馆好玩还是南京博物院好玩？ - 知乎","gp":"https://pic1.zhimg.com/50/v2-1ff8332c4139fcbc137274a305ff45a4_720w.jpg?source=1940ef5c"},{"n":"沈寿仿真绣耶稣像","e":"清末民初","p":"南京博物院","b":"沈寿独创\"仿真绣\"绣的西洋油画《耶稣像》，明暗立体、以针代笔，1915年巴拿马博览会拿了一等大奖，1986年入藏南博。","f":"作者沈寿（1874—1921），清末民初刺绣名家；仿真绣（美术绣）代表作《耶稣像》；1915年巴拿马—太平洋国际博览会一等大奖；1986年由张謇后人等捐赠入藏南京博物院。","im":"images/ep26_17.jpg","it":"认识真正的四大名绣：（一）苏绣 - 知乎","gp":"https://pica.zhimg.com/v2-4438eb69f4dc4ae30aba320c03c07912_r.jpg"},{"n":"补充12件","e":"汉至清","p":"南京博物院","b":"UP主打包补充的十余件南博藏品，涵盖史前陶壶、战国错金铜器、汉墓灯具、南朝陶俑、宋明书画缂丝及大报恩寺琉璃拱门等，多为南博常展重器。","f":"打包条目含：江豚形陶壶（史前）、原始瓷大罐（春秋战国）、青铜小鹿与盘螭纹铜镜（汉）、错金铜壶（战国）、刘非墓鎏金铜鹿灯（汉·江都王）、进口银盘（汉）、鸟柄汲水器、五宫格铜鼎、汉画像石、南唐二陵灰陶俑及人首鱼身/蛇身陶俑、四季牧牛图卷（明文徵明等）、月季鹌鹑图缂丝（明）、富春大岭图（元·黄公望）、大报恩寺琉璃塔拱门（明）等；均南京博物院藏。","im":"images/ep26_18.png","it":"南京博物院","gp":"https://www.njmuseum.com/files/nb/news/wysiwyg2022/12/29/d301bd9c196f49e959a75b4c74a96abc.png"}]},{"no":"27","t":"镇馆特别篇 · 西凤酒","loc":"陕西宝鸡凤翔","it":[{"n":"周公东征方鼎","e":"西周","p":"美国旧金山亚洲艺术博物馆","b":"西周青铜礼器，腹内铸 35 字铭文，记周公东征后返师用\"秦饮\"祭祀饮至。原为宝鸡戴家湾出土重器，后流散海外。","f":"西周早期；铭文 35 字；记周公东征、归后用\"秦饮\"祭典；1927 年出土于陕西宝鸡戴家湾（非 1924 年）；现藏美国旧金山亚洲艺术博物馆。","im":"images/ep27_00.jpg","it":"「陕西文物览」青铜器——周公东征方鼎：周公远征东方的实物佐证_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/91529822720e0cf3d7ca7f152908e51fbe096a637c85?x-bce-process=image/format,f_auto"},{"n":"何尊","e":"西周","p":"宝鸡青铜器博物院","b":"西周青铜酒器，内底铸 122 字铭文，其中\"宅兹中国\"四字是\"中国\"一词迄今最早的文字出处，年代约成王营洛邑时。","f":"西周早期（约康王前后）；内底铭文 122 字；\"宅兹中国\"为\"中国\"一词最早出处；1963 年陕西宝鸡贾村塬出土；现藏宝鸡青铜器博物院。","im":"images/ep27_01.png","it":"西凤酒文化博物馆开馆：以沉浸式叙事重塑中国酒文化传播新范式|陕西省_新浪科技_新浪网","gp":"https://n.sinaimg.cn/spider20250920/59/w550h309/20250920/7e7e-8f5d6c197b7837048e8aa3e4ebc7304e.png"},{"n":"周原凤雏宫甲骨","e":"西周","p":"周原博物馆","b":"陕西周原凤雏村西周甲骨窖藏出土，部分刻辞涉及周王祭祀、饮\"秦饮\"等内容，被合作方用作西凤酒渊源的文献佐证。","f":"西周早期（文王、武王时期）；1977 年周原凤雏甲组宫室（宗庙）基址窖穴 H11、H31 出土；数量逾万片，多为占卜刻辞；现藏周原博物馆（陕西扶风/岐山周原）。","im":"images/ep27_02.jpg","it":"《周原铸史》第十四集：周城宫址之凤雏宫室 - 知乎","gp":"https://pic3.zhimg.com/v2-bd5695355c4235037a2a51b5b0de98a6_r.jpg"},{"n":"秦汉血池遗址出土青铜壶、陶瓮","e":"秦汉","p":"陕西血池遗址（出土）","b":"凤翔雍山血池秦汉祭祀遗址出土器物，合作方称其中青铜壶、陶瓮内残有酒液，借以印证当地酿酒祭祀传统。","f":"秦汉（秦至西汉）；雍山血池遗址为秦汉国家祭天（畤）遗址；2016—2018 年发掘，出土玉器、青铜车马器及建筑构件约 2401 件（套）；现藏陕西相关文博机构。","im":"images/ep27_03.jpg","it":"考古发掘品_中国国家博物馆官方网站","gp":"https://www.chnmuseum.cn/zp/zpml/kgfjp/202010/P020220303606461380648.jpg"}]},{"no":"28","t":"首都博物馆","loc":"北京西城","it":[{"n":"三羊铜罍","e":"商代","p":"首都博物馆","b":"北京平谷刘家河商代墓葬出土青铜礼器，肩部铸三只卷角羊首，腹部饰饕餮纹，是北京地区早期青铜文明的代表性器物。","f":"商代晚期；1977 年出土于北京平谷刘家河商墓（M2）；罍身饰三卷角羊首与饕餮纹；同墓出土金臂钏、青铜小面具等；现藏首都博物馆。","im":"images/ep28_00.png","it":"三羊铜罍-中国文物网-文博收藏艺术专业门户网站","gp":"http://im.wenwuchina.com/upload/2018/06/04/20180604111718927.png"},{"n":"青铜小面具（两件套）","e":"商代","p":"首都博物馆","b":"平谷刘家河商墓出土的两件小型青铜人面面具，造型庄重神秘，与北方草原及商代面具传统相关，属北京早期青铜精品。","f":"商代晚期；1977 年出土于北京平谷刘家河商墓；青铜质，人面造型；同墓出土金臂钏、三羊铜罍等；现藏首都博物馆。","im":"images/ep28_01.jpg","it":"面具，覆面，面罩 - 知乎","gp":"https://pic3.zhimg.com/v2-5519a5f63d5a6b09e993d9513d94a41a_r.jpg"},{"n":"金臂钏","e":"商代","p":"首都博物馆","b":"平谷刘家河商墓出土喇叭口金臂钏，形制带北方草原风格，是北京地区迄今所见年代较早的黄金饰品之一。","f":"商代晚期；1977 年出土于北京平谷刘家河商墓；喇叭口形金质臂钏；反映商代北京地区与北方草原的文化联系；现藏首都博物馆。","im":"images/ep28_02.jpg","it":"南京市博物馆藏· 明代金臂钏|首饰|手臂|女性_新浪新闻","gp":"http://n.sinaimg.cn/sinacn20116/265/w1585h1080/20190407/5a55-hvhrcxm7352206.jpg"},{"n":"堇鼎","e":"西周","p":"首都博物馆","b":"琉璃河燕国墓地出土最大最重的青铜礼器，腹内铸 26 字铭文记燕侯命\"堇\"行事，是研究燕国早期历史的核心重器。","f":"西周早期（成康之际）；北京房山琉璃河遗址 M253（253 号墓）出土；通高 62 厘米、重 41.5 公斤，为北京出土最大最重青铜礼器；铭文 26 字；现藏首都博物馆。","im":"images/ep28_03.png","it":"太保墉燕——房山琉璃河遗址专题展 - 首都博物馆","gp":"https://m.canalmuseum.org.cn/res/mpwork/270998c36dcc4eb186297b58b6b82ea8.png"},{"n":"伯矩鬲","e":"西周","p":"首都博物馆","b":"琉璃河燕国贵族伯矩墓出土青铜鬲，盖与器身共饰七组牛头纹，造型繁复精美，是首博公认的\"镇馆之宝\"之一。","f":"西周早期；北京房山琉璃河遗址 M251（251 号墓）出土；通体装饰七牛头（七组牛面）纹饰；首博镇馆之宝；现藏首都博物馆。","im":"images/ep28_04.jpg","it":"最美的青铜器——西周伯矩鬲_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/8b13632762d0f703918fed28cfa9463d269758ee6fb1"},{"n":"伯矩盘","e":"西周","p":"首都博物馆","b":"与伯矩鬲同出琉璃河 251 号墓的青铜礼器，为燕国贵族伯矩所作，与伯矩鬲、伯矩簋构成伯矩器群，反映燕国青铜铸造水平。","f":"西周早期；北京房山琉璃河遗址 M251（251 号墓）出土；青铜盥洗礼器，同墓出土伯矩鬲、伯矩簋；现藏首都博物馆。","im":"images/ep28_05.png","it":"禁止出境文物，首博镇馆之宝！在中华艺术宫邂逅西周“伯矩鬲”_艺术活动_上海市文化和旅游局","gp":"https://whlyj.sh.gov.cn/cmsres/42/42613c1fe8e14a0d84c7643608624e57/1679091c5a880faf6fb5e6087eb1b2dc.png"},{"n":"羽方鼎、鱼父癸","e":"西周","p":"首都博物馆","b":"琉璃河 253 号墓出土的两件青铜鼎，口播作\"羽方鼎\"，学界一般隶定为\"圉方鼎\"，与鱼父癸鼎同出，铭文记燕国史事。","f":"西周早期；北京房山琉璃河遗址 M253（253 号墓）出土；圉方鼎腹内铸 14 字铭文（\"圉\"字或读\"羽\"）；鱼父癸鼎同出；现藏首都博物馆。","im":"images/ep28_06.jpg","it":"中国30个博物馆的镇馆之宝_澎湃号·湃客_澎湃新闻-The Paper","gp":"https://imagepphcloud.thepaper.cn/pph/image/289/199/557.jpg"},{"n":"井鼎","e":"西周","p":"首都博物馆","b":"口播称琉璃河 253 号墓出土\"井鼎\"，特征为北京最大最重、26 字铭文——这些特征与同墓堇鼎完全吻合，疑为同器异称的转写误差。","f":"西周早期；北京房山琉璃河遗址 M253（253 号墓）；\"北京最大最重青铜礼器、26 字\"之描述对应堇鼎；现藏首都博物馆。","im":"images/ep28_07.png","it":"太保墉燕——房山琉璃河遗址专题展 - 首都博物馆","gp":"https://m.canalmuseum.org.cn/res/mpwork/270998c36dcc4eb186297b58b6b82ea8.png"},{"n":"克盉、克罍","e":"西周","p":"首都博物馆","b":"琉璃河 1193 号大墓出土青铜重器，43 字铭文记周王封\"克\"为燕侯、授民授疆，实证燕国始封第一代燕侯为姬克。","f":"西周早期；北京房山琉璃河遗址 M1193（1193 号大墓）出土；克盉、克罍各铸 43 字铭文；记周王命\"克\"就封于燕，为第一代燕侯；现藏首都博物馆。","im":"images/ep28_08.png","it":"太保墉燕——房山琉璃河遗址专题展 - 首都博物馆","gp":"https://m.canalmuseum.org.cn/res/mpwork/f2fb61df69d84abeac404e3a49d7ef39.png"},{"n":"复尊、复鼎","e":"西周","p":"首都博物馆","b":"琉璃河 1902 号墓出土的青铜尊与鼎，铭文记\"复\"受燕侯赏赐之事，涉及太保召公一系，是燕国早期分封史的重要物证。","f":"西周早期；北京房山琉璃河遗址 M1902（1902 号墓）出土；复尊、复鼎铭文记\"复\"受赐及燕国史事；现藏首都博物馆。","im":"images/ep28_09.jpg","it":"复尊_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/a54e55fb4e1e8277024f5623?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"三犀鼎（通州）、虎纹鼎（顺义南彩）、三鸟罍（顺义龙湾）","e":"商—西周","p":"首都博物馆","b":"北京通州、顺义等地窖藏出土的青铜鼎、罍，分别饰三犀、虎纹、三鸟等写实动物纹，体现燕地本土青铜风格。","f":"商末至西周；1959 年通州（当时通县）出土三犀鼎；顺义南彩出土虎纹鼎、龙湾屯出土三鸟罍；动物写实名纹青铜礼器；现藏首都博物馆。","im":"images/ep28_10.png","it":"三犀鼎-中国文物网-文博收藏艺术专业门户网站","gp":"http://im.wenwuchina.com/upload/2018/06/04/20180604114417577.png"},{"n":"班簋","e":"西周","p":"首都博物馆","b":"西周青铜簋，腹内近 200 字铭文记周穆王命毛伯班伐东国，1981 年自废品站寻回，是流失文物抢救归藏的传奇重器。","f":"西周中期（穆王世）；原有 198 字铭文（一说约 190 余字），记穆王命毛公（毛伯）班征东国；1972 年废品收购站发现、1981 年入藏；现藏首都博物馆。","im":"images/ep28_11.jpg","it":"陈安 的想法: 首都博物馆镇馆之宝：班簋（gui） | 西周中期（前10世纪中期一前9世纪中期）此簋有四个兽首环耳，以内","gp":"https://pic4.zhimg.com/100/v2-0c437333392a45ac05dcb2740fee1735_r.jpg"},{"n":"华芳墓志","e":"西晋","p":"首都博物馆","b":"西晋幽州刺史王浚之妻华芳的墓志，以隶书刻近 1700 字，记录其家世与葬事，是北京地区出土字数最多的西晋墓志。","f":"西晋（永嘉元年，307 年）；北京石景山八宝山南麓华芳墓出土；隶书刻辞约 1630 字（一说近 1700 字）；墓志石质；现藏首都博物馆。","im":"images/ep28_12.jpg","it":"《望幽州》第9集：述华芳墓志 - 知乎","gp":"https://pic2.zhimg.com/v2-1e13487738fd49cde8198cad699a92fd_1440w.jpg"},{"n":"西晋骨尺","e":"西晋","p":"首都博物馆","b":"华芳墓同出骨尺，长 24.2 厘米，比中原秦汉一尺略长，为研究西晋度量衡与北京葬俗提供实物标尺。","f":"西晋；与华芳墓志同出于北京石景山华芳墓；骨制，长 24.2 厘米；较秦汉尺（约 23 厘米）长 1 厘米余；现藏首都博物馆。","im":"images/ep28_13.jpg","it":"彩绘骨尺、鎏金铜尺-中国文物网-文博收藏艺术专业门户网站","gp":"http://im.wenwuchina.com/upload/2018/04/16/20180416112559965.jpg"},{"n":"隶楷孝经卷","e":"西晋","p":"首都博物馆","b":"传为西晋人书写的《孝经》残卷，半隶半楷，与陆机《平复帖》并称，是楷书萌芽期的重要墨迹标本。","f":"西晋（太康四年，283 年，传）；纸本，楷隶（隶楷）书《孝经》残卷；作者名\"张儁\"（非\"张俊\"）；现藏首都博物馆。","im":"images/ep28_14.jpg","it":"首都博物馆--书法","gp":"https://www.museum.bj.cn/jpdc/content/images/attachement/jpg/site2/20110120/0014222d52d70ea2272a21.jpg"},{"n":"大代款铜鎏金释迦牟尼佛造像","e":"北魏","p":"首都博物馆","b":"背刻\"大代\"款北魏铜佛，高约 27 厘米，具犍陀罗式衣纹与中原审美交融特征，是早期金铜佛的标准断代器。","f":"北魏（\"大代\"为北魏前期国号，386—398 年曾用）；铜鎏金释迦牟尼像，通高约 27 厘米；犍陀罗风格衣纹；现藏首都博物馆。","im":"images/ep28_15.jpg","it":"释迦牟尼佛 - 故宫博物院","gp":"https://ggzlimg.dpm.org.cn/app/gugong/2023/0323/KvKsKHGLLYojDapz252fUSFpAwbQdyDzolTfFz4P.jpg"},{"n":"北魏太和造像","e":"北魏","p":"首都博物馆","b":"北魏石质背屏造像，传为冯太后祈福所造，背屏雕众多小佛，曾被盗卖、残损后修复归馆，是北京石雕佛教艺术名品。","f":"北魏太和年间（477—499）；石质背屏式造像，背面雕小佛约 124 尊（一说百余尊）；传为冯太后祈福造；曾被盗、残损后修复；现藏首都博物馆。","im":"images/ep28_16.jpg","it":"浙博“十六国至五代佛教金铜造像”展示佛教中国化进程_凤凰网","gp":"https://p1.ifengimg.com/2018_48/19C2DF3F79FE0AC5A636058C098DAC550465C054_w600_h887.jpg"},{"n":"鎏金银覆面","e":"辽代","p":"首都博物馆","b":"北京房山辽代契丹贵族墓葬出土的鎏金银面具，覆于逝者面部，属契丹\"黄金覆面\"葬俗，反映辽代幽燕地区的丧葬文化。","f":"辽代；北京房山辽墓出土；银质鎏金，人面形覆面；契丹贵族葬器（黄金/银覆面习俗）；现藏首都博物馆。","im":"images/ep28_17.jpg","it":"辽代鎏金银覆面_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/472309f7905298229e2f5e6cd7ca7bcb0a46d405?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"铜坐龙","e":"金代","p":"首都博物馆","b":"金中都宫殿遗址出土的青铜坐龙，龙呈蹲坐回首姿态，兼具女真质朴与中原龙形审美，是金中都皇家建筑的遗物。","f":"金代（金中都时期，1153—1214）；北京金中都宫殿遗址出土；青铜，龙作蹲坐回首状；体现女真审美与中原龙纹融合；现藏首都博物馆。","im":"images/ep28_18.jpg","it":"城事｜“辉煌中轴”首博开展：讲述古都北京中轴线的壮美秩序_快看_澎湃新闻-The Paper","gp":"https://imagecloud.thepaper.cn/thepaper/image/244/857/256.JPG"},{"n":"青白釉水月观音像","e":"元","p":"首都博物馆","b":"元大都遗址出土的景德镇青白釉观音瓷塑，高约 67 厘米，观音自在坐姿、神态安详，是元代瓷塑与佛教造像的精品。","f":"元代；元大都遗址出土；景德镇窑青白釉（影青）瓷塑；通高约 67 厘米；观音自在坐像；现藏首都博物馆。","im":"images/ep28_19.jpg","it":"景德镇窑青白釉水月观音菩萨像/元/首都博物馆|青白釉|景德镇窑|首都博物馆_新浪新闻","gp":"http://n.sinaimg.cn/sinakd20220307ac/120/w1080h1440/20220307/bd59-d7ba092320506dd009e20730b9f2534e.jpg"},{"n":"青白釉戏剧舞台人物枕","e":"元","p":"首都博物馆","b":"元大都出土的青白釉瓷枕，枕面塑戏台与众多戏曲人物，生动再现元代杂剧演出场景，是瓷塑与戏曲史结合的孤品。","f":"元代；元大都遗址出土；景德镇窑青白釉瓷枕；枕面塑戏台及人物约 18 人（一说 11—12 人）；再现元杂剧舞台；现藏首都博物馆。","im":"images/ep28_20.jpg","it":"景德镇窑青白釉戏剧舞台人物纹枕_百度百科","gp":"https://bkimg.cdn.bcebos.com/pic/4034970a304e251f95ca73035bccde177f3e6609f5bf?x-bce-process=image/resize,m_lfit,w_536,limit_1/quality,Q_70"},{"n":"元青花凤首扁壶","e":"元","p":"首都博物馆","b":"元青花名品，壶身作凤首扁瓶状，凤首为流、凤尾为柄，国内外存世仅两件，是元青花凤纹器的代表作。","f":"元代（青花）；1970 年出土于北京旧鼓楼大街豁口元大都遗址窖藏（非地铁施工）；存世约两件（一藏首博、一藏新疆）；现藏首都博物馆。","im":"images/ep28_21.jpg","it":"伊犁农民田里取土，挖出价值过亿国宝主动上交，博物馆奖励1000元_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/622762d0f703918f394a8faa5f3d269759eec433"},{"n":"鲜于枢行草韩愈进学解卷","e":"元","p":"首都博物馆","b":"元代书法大家鲜于枢行草《韩愈进学解》长卷，笔势酣畅、章法错落，是其草书代表作之一，现藏首博。","f":"元代；鲜于枢书韩愈《进学解》卷；行草书，全文约 704 字；鲜于枢为元初书法大家（与赵孟頫齐名）；现藏首都博物馆。","im":"images/ep28_22.jpg","it":"元鲜于枢行草书韩愈进学解卷_百度百科","gp":"https://bkimg.cdn.bcebos.com/smart/6f470395c1a6436e7af480e1-bkimg-process,v_1,rw_16,rh_9,maxl_504?x-bce-process=image/format,f_auto"},{"n":"斗彩葡萄纹杯","e":"明成化","p":"首都博物馆","b":"明成化斗彩葡萄纹杯，出自清初重臣索额图之孙女黑舍里氏墓，小巧精致，是成化斗彩中备受珍视的酒器小品。","f":"明成化（1465—1487）；景德镇窑斗彩；出自北京海淀黑舍里氏墓（索额图孙女、康熙重臣索尼孙媳）；现藏首都博物馆。","im":"images/ep28_23.jpg","it":"【明成化 斗彩葡萄纹杯】拍卖品_图片_价格_鉴赏_明代彩瓷_雅昌艺术品拍卖网","gp":"https://img1.artron.net/auction/2012/art501733/d/art5017330187.jpg"},{"n":"洒蓝釉钵","e":"明宣德","p":"首都博物馆","b":"明宣德景德镇洒蓝釉钵，为宣德皇帝朱瞻基御用之物，釉色如雪花洒落，存世稀少，是颜色釉瓷中的名品。","f":"明宣德（1426—1435）；景德镇窑洒蓝釉（雪花蓝）钵；传为明宣宗朱瞻基御用；存世约四件；现藏首都博物馆。","im":"images/ep28_24.jpg","it":"中国最蓝的蓝_百科TA说","gp":"https://bkimg.cdn.bcebos.com/pic/0824ab18972bd40735fa99b532da89510fb30f24a362"},{"n":"骊山避暑图","e":"清","p":"首都博物馆","b":"清代袁江所绘界画山水，以界尺工整绘楼阁亭台与骊山避暑行宫，是清代\"袁氏界画\
